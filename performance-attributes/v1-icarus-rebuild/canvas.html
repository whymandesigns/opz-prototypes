 *       <svg class="checkbox-mark"><use href="#i-check"/></svg>
 *       <svg class="checkbox-mark checkbox-mark-dash"><use href="#i-minus"/></svg>
 *     </span>
 *     <span class="checkbox-label">Label</span>
 *   </label>
 * Add `.is-error` to .checkbox for invalid state.
 * Set `input.indeterminate = true` via JS for the indeterminate state.
 */
.checkbox {
  display: inline-flex;
  align-items: center;
  gap: var(--spacing-2);
  cursor: pointer;
  position: relative;
}
.checkbox-input {
  position: absolute;
  inset: 0;
  width: 16px;
  height: 16px;
  margin: 0;
  opacity: 0;
  cursor: inherit;
}
.checkbox-box {
  position: relative;
  width: 16px;
  height: 16px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--color-border-strong);
  background: var(--color-surface);
  flex-shrink: 0;
  transition: border-color var(--duration-fast) var(--ease),
              background var(--duration-fast) var(--ease),
              box-shadow var(--duration-fast) var(--ease);
}
.checkbox-mark {
  position: absolute;
  inset: 1px;
  width: calc(100% - 2px);
  height: calc(100% - 2px);
  color: var(--color-white);
  opacity: 0;
  transition: opacity var(--duration-fast) var(--ease);
  pointer-events: none;
}
.checkbox-label {
  font: var(--type-body);
  color: var(--color-text);
}

/* States */
.checkbox:hover .checkbox-box                  { border-color: var(--color-text-muted); }
.checkbox-input:checked ~ .checkbox-box,
.checkbox-input:indeterminate ~ .checkbox-box  { background: var(--color-accent); border-color: var(--color-accent); }
.checkbox-input:checked ~ .checkbox-box .checkbox-mark:not(.checkbox-mark-dash),
.checkbox-input:indeterminate ~ .checkbox-box .checkbox-mark-dash { opacity: 1; }
.checkbox-input:focus-visible ~ .checkbox-box  { box-shadow: 0 0 0 3px var(--color-accent-subtle); }
.checkbox-input:disabled ~ .checkbox-box,
.checkbox-input:disabled ~ .checkbox-label     { opacity: 0.5; }
.checkbox:has(.checkbox-input:disabled)        { cursor: not-allowed; }

/* Error */
.checkbox.is-error .checkbox-box               { border-color: var(--color-danger); }
.checkbox.is-error .checkbox-input:checked ~ .checkbox-box {
  background: var(--color-danger);
  border-color: var(--color-danger);
}

/* ---------- Radio ----------
 * Usage:
 *   <label class="radio">
 *     <input type="radio" name="group" class="radio-input" />
 *     <span class="radio-circle"></span>
 *     <span class="radio-label">Label</span>
 *   </label>
 * Add `.is-error` to .radio for invalid state.
 */
.radio {
  display: inline-flex;
  align-items: center;
  gap: var(--spacing-2);
  cursor: pointer;
  position: relative;
}
.radio-input {
  position: absolute;
  inset: 0;
  width: 16px;
  height: 16px;
  margin: 0;
  opacity: 0;
  cursor: inherit;
}
.radio-circle {
  width: 16px;
  height: 16px;
  border-radius: var(--radius-full);
  border: 1px solid var(--color-border-strong);
  background: var(--color-surface);
  position: relative;
  flex-shrink: 0;
  transition: border-color var(--duration-fast) var(--ease),
              background var(--duration-fast) var(--ease),
              box-shadow var(--duration-fast) var(--ease);
}
.radio-circle::after {
  content: '';
  position: absolute;
  top: 50%; left: 50%;
  width: 6px;
  height: 6px;
  border-radius: var(--radius-full);
  background: var(--color-white);
  transform: translate(-50%, -50%) scale(0);
  transition: transform var(--duration-fast) var(--ease);
}
.radio-label {
  font: var(--type-body);
  color: var(--color-text);
}

/* States */
.radio:hover .radio-circle                     { border-color: var(--color-text-muted); }
.radio-input:checked ~ .radio-circle           { background: var(--color-accent); border-color: var(--color-accent); }
.radio-input:checked ~ .radio-circle::after    { transform: translate(-50%, -50%) scale(1); }
.radio-input:focus-visible ~ .radio-circle     { box-shadow: 0 0 0 3px var(--color-accent-subtle); }
.radio-input:disabled ~ .radio-circle,
.radio-input:disabled ~ .radio-label           { opacity: 0.5; }
.radio:has(.radio-input:disabled)              { cursor: not-allowed; }

/* Error */
.radio.is-error .radio-circle                  { border-color: var(--color-danger); }
.radio.is-error .radio-input:checked ~ .radio-circle {
  background: var(--color-danger);
  border-color: var(--color-danger);
}

/* ---------- Slider ----------
 * Native <input type="range"> in a flex row. The filled-track portion is a
 * gradient driven by --slider-progress, kept in sync by the script block in
 * example.html (also syncs value readouts / number fields).
 *
 *   <div class="slider">
 *     <input class="slider-input" type="range" min="0" max="100" value="35" aria-label="Volume" />
 *   </div>
 *
 * Variants compose via optional siblings around the range input:
 *   icons        <svg class="icon slider-icon"><use href="#i-minus"/></svg> … <svg class="icon slider-icon"><use href="#i-plus"/></svg>
 *   labels       <span class="slider-label">Zoom Out</span> (pairs with icons)
 *   min/max      <span class="slider-value">0</span> … <span class="slider-value">100</span>
 *   current      <output class="slider-value" data-slider-output></output>  ← JS-synced
 *   input        <input class="input input-xs slider-field" type="number" />  ← JS-synced both ways
 */
.slider {
  display: flex;
  align-items: center;
  gap: var(--spacing-3);
  width: 100%;
}
.slider[hidden] { display: none; }
.slider-input {
  -webkit-appearance: none;
  appearance: none;
  flex: 1;
  min-width: 0;
  height: 24px; /* generous touch target around the 2px track */
  background: transparent;
  cursor: pointer; font: inherit;
  margin: 0;
}
/* Track — filled portion dark, remainder light, split at --slider-progress */
.slider-input::-webkit-slider-runnable-track {
  height: 2px;
  border-radius: var(--radius-full);
  background: linear-gradient(to right,
    var(--color-accent) var(--slider-progress, 50%),
    var(--color-border-strong) var(--slider-progress, 50%));
}
.slider-input::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 16px;
  height: 16px;
  margin-top: -7px; /* centers the 16px thumb on the 2px track */
  border: 0;
  border-radius: var(--radius-full);
  background: var(--color-accent);
  transition: box-shadow var(--duration-fast) var(--ease);
}
.slider-input::-webkit-slider-thumb:hover { box-shadow: 0 0 0 4px var(--color-accent-subtle); }
.slider-input:focus-visible { outline: none; }
.slider-input:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 4px var(--color-accent-subtle); }
/* Firefox */
.slider-input::-moz-range-track {
  height: 2px;
  border-radius: var(--radius-full);
  background: var(--color-border-strong);
}
.slider-input::-moz-range-progress {
  height: 2px;
  border-radius: var(--radius-full);
  background: var(--color-accent);
}
.slider-input::-moz-range-thumb {
  width: 16px;
  height: 16px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--color-accent);
  transition: box-shadow var(--duration-fast) var(--ease);
}
.slider-input::-moz-range-thumb:hover { box-shadow: 0 0 0 4px var(--color-accent-subtle); }
.slider-input:focus-visible::-moz-range-thumb { box-shadow: 0 0 0 4px var(--color-accent-subtle); }
.slider-input:disabled { cursor: not-allowed; opacity: 0.5; }

/* Side adornments */
.slider-icon  { font-size: 16px; color: var(--color-graphite-700); flex-shrink: 0; }
.slider-label { font: var(--font-weight-regular) var(--text-xxs)/1.5 var(--font-sans); color: var(--color-graphite-700); flex-shrink: 0; white-space: nowrap; }
.slider-value { font: var(--font-weight-semibold) var(--text-md)/var(--text-md--line-height) var(--font-sans); color: var(--color-graphite-700); flex-shrink: 0; font-variant-numeric: tabular-nums; }
/* Number field variant — fixed compact width, no spinners */
.slider-field { width: 56px; text-align: center; -moz-appearance: textfield; appearance: textfield; flex-shrink: 0; }
.slider-field::-webkit-outer-spin-button,
.slider-field::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

/* ---------- Progress bar ----------
 * Determinate progress: an 8px pill track with an accent fill sized by width.
 * Optional trailing percentage label (.progress-value).
 *
 *   <div class="progress" role="progressbar" aria-valuenow="50" aria-valuemin="0" aria-valuemax="100">
 *     <div class="progress-track"><div class="progress-fill" style="width: 50%"></div></div>
 *     <span class="progress-value">50%</span>          ← optional
 *   </div>
 */
.progress {
  display: flex;
  align-items: center;
  gap: var(--spacing-3);
  width: 100%;
}
.progress-track {
  flex: 1;
  height: 8px;
  background: var(--color-surface-sunken);
  border-radius: var(--radius-full);
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  width: 0;
  background: var(--color-accent);
  border-radius: var(--radius-full);
  transition: width var(--duration-base) var(--ease);
}
.progress-value {
  flex-shrink: 0;
  min-width: 34px;
  text-align: right;
  font: var(--font-weight-semibold) var(--text-xxs)/1 var(--font-sans);
  color: var(--color-graphite-750);
  font-variant-numeric: tabular-nums;
}

/* ---------- Modal ----------
 * Overlay + centered panel with header / body / footer. Sizes: xs/sm/md/lg/xl.
 *
 *   <div class="modal-overlay" id="my-modal" hidden>
 *     <div class="modal modal-md">
 *       <header class="modal-header">
 *         <h2 class="modal-title">Title</h2>
 *         <button class="btn btn-icon-only btn-ghost btn-xs modal-close" data-modal-close aria-label="Close"><svg class="icon"><use href="#i-x"/></svg></button>
 *       </header>
 *       <div class="modal-body">…</div>
 *       <footer class="modal-footer">
 *         <button class="btn btn-secondary" data-modal-close>Cancel</button>
 *         <button class="btn btn-primary">Confirm</button>
 *       </footer>
 *     </div>
 *   </div>
 *
 * Trigger: any element with data-modal-open="my-modal". Close on overlay-click, Escape, or any data-modal-close.
 */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: var(--color-overlay);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--spacing-6);
  z-index: var(--z-modal);
}
.modal-overlay[hidden] { display: none; }

.modal {
  background: var(--color-surface);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-2);
  width: 100%;
  max-height: calc(100vh - var(--spacing-12)); /* = the overlay's 24px top + bottom padding */
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.modal-xs { max-width: 328px; }
.modal-sm { max-width: 520px; }
.modal-md { max-width: 650px; }
.modal-lg { max-width: 800px; }
.modal-xl { max-width: 1200px; }
/* Edge-to-edge: fills the viewport, no rounded corners, overlay padding removed. */
.modal-full {
  max-width: none;
  width: 100%;
  height: 100%;
  max-height: 100%;
  border-radius: 0;
}
.modal-overlay:has(> .modal-full) { padding: 0; }
/* Full modal only: divider borders separate the header + footer from the body. */
.modal-full .modal-header { border-bottom: 1px solid var(--color-gray-200); }
.modal-full .modal-footer { border-top: 1px solid var(--color-gray-200); }
.modal-full .modal-body   { padding-top: var(--spacing-6); background: var(--color-gray-50); }

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--spacing-3);
  padding: var(--spacing-4) var(--spacing-6);
}
.modal-title {
  font: var(--font-weight-semibold) var(--text-lg)/1.3 var(--font-sans);
  color: var(--color-text);
  margin: 0;
}
/* Dismiss button — styled by the icon-only ghost button component in the
 * markup (.btn.btn-icon-only.btn-ghost.btn-xs); this class only handles layout. */
.modal-close { flex-shrink: 0; }

.modal-body {
  flex: 1;
  min-height: 0; /* allow shrink below content for proper scroll behavior */
  padding: 0 var(--spacing-6) var(--spacing-6);
  overflow-y: auto;
  font: var(--type-body);
  color: var(--color-text);
}

.modal-footer {
  display: flex;
  justify-content: flex-end;
  gap: var(--spacing-2);
  padding: var(--spacing-4) var(--spacing-6);
}

/* Mobile — buttons stack full width */
@media (max-width: 480px) {
  .modal-footer { flex-direction: column; }
  .modal-footer > .btn { width: 100%; }
}

/* ---------- Drawer ----------
 * Right-anchored side panel. Sizes: narrow / regular / medium / wide / ultra.
 *
 * Use the .drawer-* parts, not the .modal-* ones. example.html mixes modal
 * parts into drawers in places; that is the showcase being inconsistent, not
 * the pattern to copy, and this comment used to teach it.
 *
 *   <div class="drawer-overlay" id="my-drawer" hidden>
 *     <aside class="drawer drawer-regular">
 *       <header class="drawer-header">…title + close…</header>
 *       <div class="drawer-body">…</div>
 *       <footer class="drawer-footer">…</footer>
 *     </aside>
 *   </div>
 */
.drawer-overlay {
  position: fixed;
  inset: 0;
  background: var(--color-overlay);
  display: flex;
  align-items: stretch;
  justify-content: flex-end;
  z-index: var(--z-modal);
}
.drawer-overlay[hidden] { display: none; }

.drawer {
  background: var(--color-surface);
  box-shadow: var(--shadow-2);
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.drawer-narrow  { max-width: 440px; }
.drawer-regular { max-width: 560px; }
.drawer-medium  { max-width: 640px; }
.drawer-wide    { max-width: 960px; }
.drawer-ultra   { max-width: 1180px; }

/* On narrow viewports, any drawer goes full-width + footer buttons stack */
@media (max-width: 480px) {
  .drawer { max-width: 100%; }
}

/* ---------- Side navigation ----------
 * Two states: expanded (236px) and compact (62px), toggled with `.is-compact`.
 *
 *   <aside class="sidenav">
 *     <button class="sidenav-toggle" aria-label="Toggle">…chevron…</button>
 *     <ul class="sidenav-list">
 *       <li><a class="sidenav-item is-active" href="#">…icon… <span class="sidenav-item-label">Label</span></a></li>
 *     </ul>
 *     <div class="sidenav-spacer"></div>
 *     <div class="sidenav-footer">…more items…</div>
 *   </aside>
 */
.sidenav {
  position: relative;
  display: flex;
  flex-direction: column;
  width: 236px;
  height: 100%;
  padding: var(--spacing-3);
  background: var(--color-gray-100);
  border-right: 1px solid var(--color-border);
  transition: width var(--duration-base) var(--ease);
  flex-shrink: 0;
}
.sidenav.is-compact { width: 62px; }

/* Panel header and search — the off-canvas layout's own chrome.
 *
 * Above 1024px the top bar carries the logo and the search field, so these
 * would be a second copy of both; they are hidden and the ≤1024px block below
 * reveals them. Keep them in the markup from the start, like .topbar-menu —
 * they cost nothing until the panel exists. */
.sidenav-head,
.sidenav-search { display: none; }
.sidenav-logo {
  height: 22px;
  width: auto;
  display: block;
}

.sidenav-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
  list-style: none;
  margin: 0;
  padding: 0;
}

.sidenav-item {
  display: flex;
  align-items: center;
  gap: var(--spacing-2);
  height: 36px;
  padding: 0 var(--spacing-3);
  border-radius: var(--radius-sm);
  font: var(--type-body);
  color: var(--color-text-muted);
  text-decoration: none;
  text-align: left;
  border: 0;
  background: transparent;
  cursor: pointer;
  white-space: nowrap;
  width: 100%;
  transition: background var(--duration-fast) var(--ease),
              color var(--duration-fast) var(--ease),
              box-shadow var(--duration-fast) var(--ease);
}
.sidenav-item:hover {
  background: var(--color-gray-200);
}
.sidenav-item.is-active {
  background: var(--color-gray-200);
  color: var(--color-text);
  font-weight: var(--font-weight-regular);
}
.sidenav-item-icon {
  /* Pinned rather than 1em: the icon should read a little larger than its
   * 14px label. 16 is a size the pack is drawn at; 18 was not. */
  width: 16px;
  height: 16px;
  flex-shrink: 0;
  /* fill:none so stroke-based icons (e.g. Initiatives) render as outlines
   * instead of a solid black silhouette; filled icons carry their own
   * fill="currentColor" on their paths and are unaffected. (NB-51) */
  fill: none;
  color: var(--color-text-muted);
  transition: color var(--duration-fast) var(--ease);
}
.sidenav-item.is-active .sidenav-item-icon { color: var(--color-text); }
.sidenav-item-label {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  opacity: 1;
  transition: opacity var(--duration-fast) var(--ease);
}
.sidenav-item-chevron {
  width: 16px;
  height: 16px;
  color: var(--color-text-muted);
  flex-shrink: 0;
  transition: transform var(--duration-fast) var(--ease);
}

/* Nested group — a parent item that expands to reveal child items. */
.sidenav-group { display: contents; }
.sidenav-group-trigger[aria-expanded="true"] .sidenav-item-chevron { transform: rotate(180deg); }
.sidenav-sublist {
  list-style: none;
  margin: 0;
  /* Indent so subitem labels line up with the parent label (icon + gap). */
  padding: 0 0 0 calc(var(--spacing-2) + 18px);
  display: flex;
  flex-direction: column;
  gap: 2px;
  overflow: hidden;
}
.sidenav-group-trigger[aria-expanded="false"] + .sidenav-sublist { display: none; }
.sidenav-subitem {
  height: 32px;
  font: var(--type-body-sm);
}

/* Compact state — icon-only square buttons, labels hidden */
.sidenav.is-compact .sidenav-item {
  justify-content: center;
  padding: 0;
  width: 36px;
  margin: 0 auto;
}
.sidenav.is-compact .sidenav-item-label,
.sidenav.is-compact .sidenav-item-chevron { display: none; }
.sidenav.is-compact .sidenav-sublist { display: none; }

.sidenav-spacer { flex: 1; }
.sidenav-footer {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding-top: var(--spacing-3);
  border-top: 1px solid var(--color-border);
  margin-top: var(--spacing-3);
}

/* Toggle button — floats over the right edge of the sidebar */
.sidenav-toggle {
  position: absolute;
  top: var(--spacing-4);
  right: -12px;
  width: 24px;
  height: 24px;
  padding: 0;
  border-radius: var(--radius-full);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--color-text-muted);
  z-index: var(--z-sticky);
  box-shadow: var(--shadow-1);
  transition: color var(--duration-fast) var(--ease),
              background var(--duration-fast) var(--ease);
}
.sidenav-toggle:hover { color: var(--color-text); background: var(--color-surface-muted); }
.sidenav-toggle svg {
  width: 14px;
  height: 14px;
  transition: transform var(--duration-base) var(--ease);
}
.sidenav.is-compact .sidenav-toggle svg { transform: rotate(180deg); }

/* ---------- Side nav — tablet and below ----------
 * At Picasso's lg edge (1024px) a 236px rail costs too much of the width, so
 * it stops being a column and becomes a panel that slides over the content.
 *
 * It is hidden, not deleted: `display: none` on its own would strand the user
 * with no way to navigate, because .topbar-menu is wired to nothing by
 * default. So this block does three things together, and they only work as a
 * set — reveal the hamburger, take the rail out of the flow, and dim what is
 * behind it while it is open:
 *
 *   <button class="btn btn-icon-only btn-ghost topbar-menu" …>   in .topbar
 *   <aside class="sidenav">…</aside>                             first child of .app-shell
 *   JS: the hamburger toggles `.is-open` on that .sidenav
 *
 * The template ships all three. A prototype built from it inherits the
 * behaviour and needs no CSS of its own.
 *
 * Compact mode is overridden back to full width on purpose: a 62px icon rail
 * is a way to save horizontal space, and a panel floating over the content is
 * not short of any. The collapse chevron goes with it.
 */
@media (max-width: 1024px) {
  /* Fixed, not absolute: the panel spans the whole window, top bar included,
   * and the bar sits behind it. Anchoring it inside .app-shell would start it
   * below the bar and leave the product's own chrome lit while a modal
   * surface is open over everything else. --z-drawer clears the bar, which is
   * in normal flow with no z-index of its own. */
  .app-shell > .sidenav {
    position: fixed;
    top: 0;
    bottom: 0;
    left: 0;
    height: auto;
    z-index: var(--z-drawer);
    width: 236px;
    transform: translateX(-100%);
    box-shadow: var(--shadow-2);
    transition: transform var(--duration-base) var(--ease);
  }
  .app-shell > .sidenav.is-open { transform: translateX(0); }
  .app-shell > .sidenav.is-compact { width: 236px; }
  .app-shell > .sidenav .sidenav-toggle { display: none; }

  /* The panel is the whole product chrome while it is open, so it carries the
   * brand, a way out, and search — the three things the collapsed top bar
   * gave up. .sidenav-close is a behaviour hook: the icon-only ghost button
   * styles it, and the script finds it by this class. */
  .app-shell > .sidenav .sidenav-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--spacing-3);
    padding: var(--spacing-2) var(--spacing-2) var(--spacing-4);
  }
  .app-shell > .sidenav .sidenav-search {
    display: block;
    margin-bottom: var(--spacing-4);
  }

  /* The scrim, fixed to match — dimming everything the panel is not. A
   * pseudo-element rather than a markup node, so an existing prototype gains
   * it without its HTML changing; clicks on it land on .app-shell, which is
   * what the template's handler listens for. */
  .app-shell:has(> .sidenav.is-open)::after {
    content: '';
    position: fixed;
    inset: 0;
    z-index: var(--z-overlay);
    background: var(--color-overlay);
  }

  .topbar .topbar-menu { display: inline-flex; }
}

/* ---------- App shell ----------
 * Pairs a .sidenav with .app-shell-main.
 *
 * TWO SHAPES, AND YOU NEVER WRITE CSS FOR EITHER:
 *
 *   .app-shell                 a 560px box — the SHOWCASE's framing, so
 *                              example.html can show a screen inside a card.
 *   .app-shell is-fullscreen   fills the window under the .topbar. This is
 *                              what a real prototype wants, every time.
 *
 * A prototype that is the app writes `<div class="app-shell is-fullscreen">`
 * and stops. Do not add `height`, `min-height`, `flex`, `overflow` or a
 * `html, body { height: 100% }` reset in the page — .app-shell-main already
 * scrolls on its own, and a local override is what breaks the layout rather
 * than fixing it. Older prototypes carry four hand-written lines here because
 * this variant did not exist yet; they are not the pattern to copy.
 */
.app-shell {
  position: relative;   /* the off-canvas rail below ≤1024px anchors to this */
  display: flex;
  height: 560px;
  background: var(--color-bg);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  overflow: hidden;
}
.app-shell-main {
  flex: 1;
  background: var(--color-surface);
  padding: var(--spacing-6);
  overflow: auto;
}
/* Full-viewport variant — the shell takes whatever the top bar leaves.
 *
 * Two mechanisms, deliberately. The calc is the floor: it works everywhere but
 * assumes the only thing above the shell is a .topbar of exactly
 * --header-height. The :has() block below replaces it with a real flex fill,
 * so the shell stays correct when the bar changes height or something else
 * (a global banner, a breadcrumb strip) is added above it. A browser without
 * :has() drops that rule entirely and keeps the calc, which is the old
 * behaviour — so there is no version of this that collapses to nothing.
 *
 * dvh is the second declaration because 100vh on mobile Safari means the
 * viewport WITHOUT browser chrome, which overflows the page by the height of
 * the address bar. Browsers that do not know dvh ignore the line and keep vh.
 */
.app-shell.is-fullscreen {
  height: calc(100vh - var(--header-height));
  height: calc(100dvh - var(--header-height));
  min-height: 0;
  border: 0;
  border-radius: 0;
}
body:has(> .app-shell.is-fullscreen) {
  /* A fixed height, not min-height: the shell is a flex child that grows into
   * what is left, and a body that can grow has nothing left to give — the
   * shell would size to its content and the whole page would scroll instead
   * of .app-shell-main. overflow: hidden makes that explicit; it propagates to
   * the viewport and does not clip the fixed-position modals or drawers. */
  height: 100vh;
  height: 100dvh;
  margin: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
/* Anything above the shell keeps its own height; the shell eats the rest. */
body:has(> .app-shell.is-fullscreen) > * { flex: 0 0 auto; }
body:has(> .app-shell.is-fullscreen) > .app-shell.is-fullscreen {
  flex: 1 1 auto;
  height: auto;
  min-height: 0;
}

/* ---------- Breadcrumbs ----------
 * Path trail — usually the first row inside a page head, but works standalone.
 * Parent crumbs are blue links (underline on hover); the current page is plain
 * text and not interactive. Chevron separators come from the ::after on each
 * non-last item, so markup stays flat:
 *
 *   <nav class="breadcrumbs" aria-label="Breadcrumb">
 *     <a class="breadcrumb" href="#">Processes</a>
 *     <a class="breadcrumb" href="#">Onboarding</a>
 *     <span class="breadcrumb is-current" aria-current="page">Review step</span>
 *   </nav>
 */
.breadcrumbs {
  display: flex;
  align-items: center;
  gap: var(--spacing-1);
  flex-wrap: wrap;
  min-width: 0;
}
.breadcrumb {
  display: inline-flex;
  align-items: center;
  gap: var(--spacing-1);
  font: var(--font-weight-semibold) var(--text-md)/var(--text-md--line-height) var(--font-sans);
  color: var(--color-accent);
  text-decoration: none;
  white-space: nowrap;
}
a.breadcrumb:hover { text-decoration: underline; text-underline-offset: 3px; }
/* Chevron separator after every crumb except the last */
.breadcrumb:not(:last-child)::after {
  content: '';
  width: 16px;
  height: 16px;
  flex-shrink: 0;
  background-color: var(--color-text-subtle);
  -webkit-mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>') center / contain no-repeat;
  mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>') center / contain no-repeat;
}
/* Current page — plain text, no link affordance */
.breadcrumb.is-current {
  color: var(--color-text);
  cursor: default;
}

/* Overflow collapse — a container query on the trail's wrapper (.breadcrumbs-fit,
 * container-type: inline-size) hides the middle crumbs and reveals a "…" menu
 * below ~480px. Keeps the last parent + current page visible to save space on
 * mobile; desktop and tablet show the full trail. */
.breadcrumbs[data-collapsible] { flex-wrap: nowrap; }
.breadcrumbs-fit { container-type: inline-size; }
/* Hidden by default; specificity beats .dropdown { display: inline-flex }. */
.breadcrumbs .breadcrumb-overflow { display: none; }
@container (max-width: 480px) {
  .breadcrumbs-fit .bc-collapsible { display: none; }
  .breadcrumbs-fit .breadcrumb-overflow { display: inline-flex; }
}

/* ---------- Page head ----------
 * Page-level header. Title (+ optional breadcrumbs + count + subtitle) on
 * the left, actions on the right. Breadcrumbs, when present, are the first
 * row inside .page-head-main, above the title.
 *
 *   <div class="page-head">
 *     <div class="page-head-main">
 *       <nav class="breadcrumbs" aria-label="Breadcrumb">          ← optional
 *         <a class="breadcrumb" href="#">Processes</a>
 *         <span class="breadcrumb is-current" aria-current="page">Onboarding</span>
 *       </nav>
 *       <div class="page-head-title">
 *         <h1 class="page-head-heading">Processes</h1>
 *         <span class="count-badge count-badge-lg count-badge-secondary">12</span>
 *       </div>
 *       <p class="page-head-subtitle">Optional subtitle.</p>
 *     </div>
 *     <div class="page-head-actions">
 *       <button class="btn btn-secondary">Filter</button>
 *       <button class="btn btn-primary">New process</button>
 *     </div>
 *   </div>
 */
.page-head {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: var(--spacing-6);
  padding-bottom: var(--spacing-3);
  border-bottom: 1px solid var(--color-gray-100);
  margin-bottom: var(--spacing-8);
}
.page-head-main { min-width: 0; }
/* Breadcrumbs as the first row of a page head — small gap above the title */
.page-head-main > .breadcrumbs { margin-bottom: var(--spacing-2); }
.page-head-title {
  display: flex;
  align-items: center;
  gap: var(--spacing-3);
}
.page-head-heading {
  font: var(--type-h2); /* H2 / 20px — page titles sit one step below the display size */
  color: var(--color-text);
  margin: 0;
}
/* Count next to the heading uses the secondary count-badge component
 * directly — no separate .page-head-count rule. Markup:
 *   <span class="count-badge count-badge-lg count-badge-secondary">12</span>
 */
.page-head-subtitle {
  font: var(--type-body-sm);
  color: var(--color-text-muted);
  margin: var(--spacing-1) 0 0;
}
.page-head-actions {
  display: flex;
  align-items: center;
  gap: var(--spacing-2);
  flex-shrink: 0;
}

/* Below the lg edge the collapsed top bar carries the page title itself, so a
 * page head here would print the same heading twice, one line apart. It stands
 * down, and its actions move up with the title as `.topbar-cta` — which the
 * collapsed bar reveals at exactly this breakpoint.
 *
 * ONE .topbar-cta PER PAGE-HEAD CTA, in the same order, carrying the same
 * variant: a `.btn-secondary` down here is a `.btn-secondary` up there. Ship
 * only the primary and the page's other actions vanish on a phone, with
 * nothing on screen to say they existed. `.btn-icon-only` rounds them to
 * 32px; `.topbar-title` is flex:1, so they group against the right edge.
 *
 * This is what makes .topbar-cta safe to carry on a page that also has a page
 * head. It used to be the opposite: nothing hid .page-head-actions, so a page
 * with both put two primary CTAs on screen the moment the bar collapsed. */
@media (max-width: 1024px) {
  .page-head { display: none; }
}

/* ---------- Template frame ----------
 * Full app preview — topbar + sidenav + main, stacked vertically inside a
 * fixed-height bordered frame. For showing a whole screen in miniature.
 *
 *   <div class="template-frame">
 *     <div class="app-shell"> … </div>
 *   </div>
 */
.template-frame {
  display: flex;
  flex-direction: column;
  height: 760px;
  background: var(--color-bg);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  overflow: hidden;
}
.template-frame .app-shell {
  border: 0;
  border-radius: 0;
  height: auto;
  flex: 1;
}

/* ---------- Stat card ----------
 * A single metric on a surface: small muted label above a large value.
 * Lay several out in a grid; the card carries its own border and padding.
 *
 *   <div class="stat-card">
 *     <p class="stat-card-label">Active initiatives</p>
 *     <p class="stat-card-value">24</p>
 *   </div>
 */
.stat-card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--spacing-4);
}
.stat-card-label {
  font: var(--type-caption);
  color: var(--color-text-muted);
  margin: 0;
}
.stat-card-value {
  font: var(--font-weight-semibold) var(--text-2xl)/1.2 var(--font-sans);
  color: var(--color-text);
  margin: var(--spacing-1) 0 0;
}

/* ---------- List row ----------
 * Denser card variant for index and feed pages. The row IS the surface —
 * it carries its own border, radius and padding, so it is a sibling of
 * other rows, never nested inside a .card. Title and meta stack on the
 * left; anything trailing (status, actions) sits at the right edge.
 *
 *   <a class="list-row" href="#">
 *     <div>
 *       <p class="list-row-title">Q3 revenue objective</p>
 *       <p class="list-row-meta">Updated 2 days ago</p>
 *     </div>
 *     <span class="tag tag-positive">On track</span>
 *   </a>
 */
.list-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--spacing-4);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--spacing-3) var(--spacing-4);
  transition: background var(--duration-fast) var(--ease);
}
.list-row:hover { background: var(--color-surface-muted); }
.list-row-title  { font: var(--type-body); font-weight: var(--font-weight-regular); color: var(--color-text); margin: 0; }
.list-row-meta   { font: var(--type-body-sm); color: var(--color-text-muted); margin: 2px 0 0; }

/* ---------- Tabs ----------
 * Horizontal tab strip with a hairline border underneath and a 2px accent
 * indicator under the active tab. Triggers are buttons; pair with
 * `<div role="tabpanel">` panels via aria-controls + matching ids.
 *
 *   <div class="tabs" role="tablist">
 *     <button class="tab is-active" role="tab" aria-selected="true" aria-controls="p-1" id="t-1" type="button">Overview</button>
 *     <button class="tab" role="tab" aria-selected="false" aria-controls="p-2" id="t-2" type="button">Activity</button>
 *   </div>
 *   <div role="tabpanel" id="p-1" aria-labelledby="t-1">…</div>
 *   <div role="tabpanel" id="p-2" aria-labelledby="t-2" hidden>…</div>
 */
.tabs {
  display: flex;
  gap: var(--spacing-8);
  border-bottom: 1px solid var(--color-border);
}
.tab {
  background: transparent;
  border: 0;
  border-bottom: 2px solid transparent;
  padding: 0 0 var(--spacing-1);
  margin-bottom: -1px;
  cursor: pointer;
  font: var(--font-weight-semibold) var(--text-sm)/1.25 var(--font-sans);
  color: var(--color-text-muted);
  /* No link underline when a tab is rendered as an <a> (cross-page tab). */
  text-decoration: none;
  white-space: nowrap;
  transition: color var(--duration-fast) var(--ease),
              border-color var(--duration-fast) var(--ease);
}
.tab:hover { color: var(--color-text); }
.tab.is-active {
  color: var(--color-text);
  border-bottom-color: var(--color-accent);
}
.tab:focus-visible {
  outline: 2px solid var(--color-border-focus);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
}

/* Overflow — when the tab strip is wider than its container it scrolls
 * horizontally; JS (initTabScrollers) wraps it in .tabs-scroller and toggles
 * .can-left / .can-right, which reveal an edge fade + chevron affordance. */
.tabs-scroller { position: relative; }
.tabs-scroller > .tabs {
  overflow-x: auto;
  scrollbar-width: none;          /* Firefox */
  -ms-overflow-style: none;       /* old Edge */
  scroll-behavior: smooth;
}
.tabs-scroller > .tabs::-webkit-scrollbar { display: none; }
/* Grab-to-scroll (mouse/pen; touch uses native momentum scrolling). */
.tabs-scroller.can-left > .tabs,
.tabs-scroller.can-right > .tabs { cursor: grab; }
.tabs.is-dragging { cursor: grabbing; scroll-behavior: auto; user-select: none; }
.tabs-more {
  position: absolute;
  top: 0;
  bottom: 1px;                    /* clear the hairline border */
  width: 44px;
  display: none;
  align-items: center;
  border: 0;
  padding: 0;
  cursor: pointer; font: inherit;
  color: var(--color-text-muted);
  z-index: 1;
}
.tabs-more:hover { color: var(--color-text); }
.tabs-more .icon { width: 16px; height: 16px; }
/* Fade blurs the tabs into the surface behind the strip. */
.tabs-more-right {
  right: 0;
  justify-content: flex-end;
  background: linear-gradient(to right, transparent, var(--color-surface) 55%);
}
.tabs-more-left {
  left: 0;
  justify-content: flex-start;
  background: linear-gradient(to left, transparent, var(--color-surface) 55%);
}
.tabs-more-right .icon { transform: scaleX(-1); } /* flip the left chevron */
.tabs-scroller.can-right > .tabs-more-right,
.tabs-scroller.can-left  > .tabs-more-left { display: flex; }

/* ---------- Stepper ----------
 * Horizontal step indicator for wizards / multi-step flows. Numbered 24px
 * circles + labels, joined by caret separators. The current step's circle is
 * filled with the accent; all others are outlined.
 *
 *   <ol class="stepper">
 *     <li class="stepper-step is-current"><span class="stepper-num">1</span><span class="stepper-label">Details</span></li>
 *     <li class="stepper-sep"><svg class="icon"><use href="#i-caret-right"/></svg></li>
 *     <li class="stepper-step"><span class="stepper-num">2</span><span class="stepper-label">Review</span></li>
 *   </ol>
 */
.stepper {
  display: flex;
  align-items: center;
  gap: var(--spacing-1);
  flex-wrap: wrap;
  list-style: none;
  margin: 0;
  padding: 0;
}
.stepper-step {
  display: inline-flex;
  align-items: center;
  gap: var(--spacing-2);
}
.stepper-num {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 24px;
  flex-shrink: 0;
  border-radius: var(--radius-full);
  border: 1px solid var(--color-border-strong);
  background: var(--color-surface);
  color: var(--color-graphite-700);
  font: var(--font-weight-semibold) var(--text-xxs)/1 var(--font-sans);
}
/* The check/number icon takes the circle's colour (white on the filled states). */
.stepper-num .icon { color: inherit; }
.stepper-label {
  font: var(--font-weight-semibold) var(--text-2xs)/1.3 var(--font-sans);
  color: var(--color-graphite-700);
  white-space: nowrap;
}
/* Current step — filled accent circle, white number */
.stepper-step.is-current .stepper-num {
  background: var(--color-accent);
  border-color: var(--color-accent);
  color: var(--color-text-inverse);
}
/* Completed step — green fill with a check instead of a number (NB-50) */
.stepper-step.is-complete .stepper-num {
  background: var(--color-success);
  border-color: var(--color-success);
  color: var(--color-text-inverse);
}
.stepper-sep {
  display: inline-flex;
  align-items: center;
  flex-shrink: 0;
  color: var(--color-text-subtle);
}
.stepper-sep svg { font-size: 16px; }

/* Label density variants.
 * .stepper-current-only — numbers throughout, only the active step keeps its
 *   label (a compact progress read that still names where you are).
 * .stepper-compact — numbers only, no labels at all. */
.stepper-current-only .stepper-label { display: none; }
.stepper-current-only .stepper-step.is-current .stepper-label { display: inline; }
.stepper-compact .stepper-label { display: none; }

/* Responsive — on small screens collapse a full stepper to the current-only
 * read (numbers throughout, label on the active step) so it fits without
 * wrapping. Explicit .stepper-compact keeps its numbers-only form. */
@media (max-width: 640px) {
  .stepper:not(.stepper-compact) .stepper-label { display: none; }
  .stepper:not(.stepper-compact) .stepper-step.is-current .stepper-label { display: inline; }
}

/* ---------- Tooltip ----------
 * CSS-only tooltip on any element via [data-tooltip="…"]. Default placement
 * is top; override with [data-placement="bottom"|"left"|"right"].
 *
 * Two styles. The dark pill does not wrap, so anything that reads as a
 * sentence belongs in the regular one — a long string in the compact pill
 * runs off as a single line.
 *   Compact (default) — dark pill, caption text, single line. Reserved for
 *     one-word labels on icon buttons: Copy, Delete, Filter.
 *   Regular — add [data-tooltip-style="regular"]. White surface, 13/20 body
 *     text that wraps (max 240px), soft shadow, caret pointing at the
 *     trigger. Everything that explains rather than names.
 *
 *   <button class="btn" data-tooltip="Copied!" data-placement="bottom">Copy</button>
 *   <button class="btn" data-tooltip="Longer explanation…" data-tooltip-style="regular">Help</button>
 *
 * Renders via ::after (+ ::before for the regular caret) so no extra DOM.
 * Reveals on :hover and :focus-visible.
 */
[data-tooltip] { position: relative; }
[data-tooltip]::after {
  content: attr(data-tooltip);
  position: absolute;
  background: var(--color-graphite-900);
  color: var(--color-text-inverse);
  padding: var(--spacing-1) var(--spacing-2);
  border-radius: var(--radius-sm);
  font: var(--type-caption);
  line-height: 1.3;
  white-space: nowrap;
  pointer-events: none;
  opacity: 0;
  z-index: var(--z-snackbar);
  transition: opacity var(--duration-fast) var(--ease) 80ms;
  /* Default placement: top */
  bottom: calc(100% + 6px);
  left: 50%;
  transform: translateX(-50%);
}
[data-tooltip]:hover::after,
[data-tooltip]:focus-visible::after { opacity: 1; }

[data-tooltip][data-placement="bottom"]::after {
  bottom: auto;
  top: calc(100% + 6px);
}
[data-tooltip][data-placement="left"]::after {
  bottom: auto;
  top: 50%;
  right: calc(100% + 6px);
  left: auto;
  transform: translateY(-50%);
}
[data-tooltip][data-placement="right"]::after {
  bottom: auto;
  top: 50%;
  left: calc(100% + 6px);
  transform: translateY(-50%);
}

/* Regular style — white surface, wrapping body text, caret.
 * Shadow matches Figma "Shadows/Level 4" (two centered layers). */
[data-tooltip][data-tooltip-style="regular"]::after {
  background: var(--color-surface);
  color: var(--color-graphite-700);
  font: var(--type-body-sm);
  padding: var(--spacing-4);
  border-radius: var(--radius-sm);
  white-space: normal;
  width: max-content;
  max-width: 240px;
  text-align: left;
  box-shadow: 0 0 4px rgba(0, 0, 0, 0.24), 0 0 32px rgba(0, 0, 0, 0.12);
  bottom: calc(100% + 12px);
}
/* Caret — rotated square; its shadowed half pokes out from under the bubble
 * (::after paints above ::before, hiding the inner half). */
[data-tooltip][data-tooltip-style="regular"]::before {
  content: '';
  position: absolute;
  width: 10px;
  height: 10px;
  background: var(--color-surface);
  box-shadow: 0 0 4px rgba(0, 0, 0, 0.24);
  pointer-events: none;
  opacity: 0;
  z-index: var(--z-snackbar);
  transition: opacity var(--duration-fast) var(--ease) 80ms;
  /* Default placement: top */
  bottom: calc(100% + 8px);
  left: 50%;
  transform: translateX(-50%) rotate(45deg);
}
[data-tooltip][data-tooltip-style="regular"]:hover::before,
[data-tooltip][data-tooltip-style="regular"]:focus-visible::before { opacity: 1; }

[data-tooltip][data-tooltip-style="regular"][data-placement="bottom"]::after {
  bottom: auto;
  top: calc(100% + 12px);
}
[data-tooltip][data-tooltip-style="regular"][data-placement="bottom"]::before {
  bottom: auto;
  top: calc(100% + 8px);
}
[data-tooltip][data-tooltip-style="regular"][data-placement="left"]::after {
  bottom: auto;
  top: 50%;
  right: calc(100% + 12px);
  left: auto;
  transform: translateY(-50%);
}
[data-tooltip][data-tooltip-style="regular"][data-placement="left"]::before {
  bottom: auto;
  top: 50%;
  right: calc(100% + 8px);
  left: auto;
  transform: translateY(-50%) rotate(45deg);
}
[data-tooltip][data-tooltip-style="regular"][data-placement="right"]::after {
  bottom: auto;
  top: 50%;
  left: calc(100% + 12px);
  transform: translateY(-50%);
}
[data-tooltip][data-tooltip-style="regular"][data-placement="right"]::before {
  bottom: auto;
  top: 50%;
  left: calc(100% + 8px);
  transform: translateY(-50%) rotate(45deg);
}

/* ---------- Dropzone (file upload) ----------
 * A dashed drop target that doubles as a click-to-browse control. Structure:
 *   <label class="dropzone"> wraps a focusable <input type="file" class="dropzone-input">
 *   so the whole area is clickable and keyboard-reachable; the JS helper
 *   (initDropzones) wires drag-over highlighting and simulated upload progress.
 * States: idle · .is-dragover (blue) · .is-disabled (muted) · .is-error (red).
 * Uploading / error feedback lives in a sibling .dropzone-status row. */
.dropzone-field { display: flex; flex-direction: column; gap: var(--spacing-3); }

.dropzone {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--spacing-1);
  padding: var(--spacing-6) var(--spacing-4);
  min-height: 126px;
  text-align: center;
  background: var(--color-bg); /* gray-100 */
  border: 1px dashed var(--color-border-strong);
  border-radius: var(--radius-md);
  color: var(--color-text);
  cursor: pointer;
  transition: border-color var(--duration-fast) var(--ease),
              background var(--duration-fast) var(--ease),
              box-shadow var(--duration-fast) var(--ease);
}
.dropzone:hover { border-color: var(--color-border-focus); }

.dropzone-icon  { color: var(--color-icon); margin-bottom: var(--spacing-1); }
.dropzone-title { font: var(--type-body-semibold); margin: 0; }
.dropzone-hint  { font: var(--type-body-xxs); color: var(--color-text-muted); margin: 0; }

/* Focusable input, visually hidden but reachable by keyboard/AT. */
.dropzone-input {
  position: absolute; inset: 0; width: 100%; height: 100%;
  opacity: 0; cursor: pointer;
}
.dropzone-input:disabled { cursor: not-allowed; }

/* Drag-over / keyboard focus — blue dashed border + soft ring. */
.dropzone.is-dragover,
.dropzone:focus-within {
  border-color: var(--color-accent);
  background: var(--color-accent-subtle);
  box-shadow: 0 0 0 3px var(--color-accent-subtle);
}

/* Disabled — muted content, no pointer. */
.dropzone.is-disabled {
  cursor: not-allowed;
  background: var(--color-surface-muted);
  box-shadow: none;
}
.dropzone.is-disabled .dropzone-icon,
.dropzone.is-disabled .dropzone-title,
.dropzone.is-disabled .dropzone-hint { color: var(--color-text-subtle); }

/* Error — red dashed border; pair with a .dropzone-status.is-error row. */
.dropzone.is-error { border-color: var(--color-danger); }

/* Status row under the box — uploading progress or an error message. */
.dropzone-status {
  display: flex;
  align-items: center;
  gap: var(--spacing-3);
  font: var(--type-body-sm);
  color: var(--color-text);
}
.dropzone-status-label { flex: 1; min-width: 0; }
.dropzone-status.is-error { color: var(--color-danger); }

.dropzone-progress {
  flex-shrink: 0;
  width: 96px;
  height: 6px;
  border-radius: var(--radius-full);
  background: var(--color-surface-sunken);
  overflow: hidden;
}
.dropzone-progress-bar {
  height: 100%;
  width: 0;
  border-radius: inherit;
  background: var(--color-accent);
  transition: width var(--duration-base) var(--ease);
}

.dropzone-status-dismiss {
  flex-shrink: 0;
  display: inline-flex;
  padding: 0;
  background: transparent;
  border: 0;
  cursor: pointer; font: inherit;
  color: var(--color-danger);
}

/* ---------- Loaders ----------
 * Chase spinner — the Operationalize logo mark (24 segments) fading in
 * sequence. Copy the <svg class="chase …" viewBox="0 0 22 32"> block from
 * example.html#loaders; per-segment delays are computed by the small JS
 * snippet in the script block (i/n stagger), so markup carries no timing.
 *
 *   <svg class="chase size-md" viewBox="0 0 22 32">…24 paths…</svg>      counter-clockwise, blue
 *   <svg class="chase-cw size-md" viewBox="0 0 22 32">…same paths…</svg> clockwise, graphite + blue flash
 *
 * Sizes: .size-sm 24px · .size-md 32px · .size-lg 48px
 */
.chase, .chase-cw { display: block; height: auto; }
.chase path, .chase-cw path { fill: currentColor; }
.chase { color: var(--color-accent); }
.chase path { animation: chase-fade 1.1s linear infinite; }
.chase-cw { color: var(--color-graphite-300); }
.chase-cw path { animation: chase-fade-cw 1.1s linear infinite; }
.chase.size-sm, .chase-cw.size-sm { width: 24px; }
.chase.size-md, .chase-cw.size-md { width: 32px; }
.chase.size-lg, .chase-cw.size-lg { width: 48px; }
@keyframes chase-fade { 0%, 100% { opacity: 0.15; } 12% { opacity: 1; } }
@keyframes chase-fade-cw { 0%, 100% { opacity: 0.15; } 12% { opacity: 1; color: var(--color-accent); } }
@media (prefers-reduced-motion: reduce) {
  .chase path, .chase-cw path { animation: none; opacity: 0.55; }
}

/* ---------- Toast ----------
 * Floating notification anchored to the top-right corner. Spawn via the
 * global `toast(...)` helper (see example.html). Three behaviors —
 *   persistent → no auto-dismiss, shows close button
 *   timed      → auto-dismisses after `timeout` ms (default 5000)
 *   action     → shows an action button + close button
 *
 * Five color variants:
 *   .toast-neutral · .toast-error · .toast-warning · .toast-success · .toast-info
 *
 *   <div class="toast-region" aria-live="polite"></div>     ← one per page
 *   <div class="toast toast-success">
 *     <svg class="icon toast-icon"><use href="#i-check-circle"/></svg>
 *     <p class="toast-message">Saved.</p>
 *     <button class="btn btn-xs btn-secondary toast-action">Undo</button>
 *     <button class="toast-close" aria-label="Close"><svg class="icon"><use href="#i-x"/></svg></button>
 *   </div>
 */
.toast-region {
  position: fixed;
  top: var(--spacing-4);
  right: var(--spacing-4);
  z-index: var(--z-snackbar);
  display: flex;
  flex-direction: column;
  gap: var(--spacing-2);
  max-width: 380px;
  pointer-events: none;
}
.toast {
  --toast-accent: var(--color-border-strong);
  display: flex;
  align-items: center;
  gap: var(--spacing-3);
  padding: var(--spacing-3) var(--spacing-4);
  border-radius: var(--radius-md);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  color: var(--color-text);
  font: var(--type-body-sm);
  box-shadow: var(--shadow-3);
  pointer-events: auto;
  min-width: 280px;
  max-width: 380px;
  transition: opacity var(--duration-base) var(--ease),
              transform var(--duration-base) var(--ease);
}
.toast.is-entering { opacity: 0; transform: translateX(20%); }
.toast.is-leaving  { opacity: 0; transform: translateX(20%); }

/* .toast .toast-icon (0,2,0) so the accent colour wins over the generic
 * `.toast .icon { color: inherit }` rule; per-variant --toast-accent drives it. */
.toast .toast-icon { font-size: 16px; flex-shrink: 0; color: var(--toast-accent); }
.toast-message { flex: 1; min-width: 0; margin: 0; line-height: 1.4; }
.toast-action { flex-shrink: 0; align-self: center; }
/* Dismiss button — styled by the icon-only ghost button component in the
 * markup (.btn.btn-icon-only.btn-ghost.btn-xs); this class only handles layout. */
.toast-close { flex-shrink: 0; align-self: center; }

/* Color variants (NB-56) — set --toast-accent (icon colour), a {hue}-150 border,
 * and a subtle tinted background. Icon colours: error red-500, warning yellow-500,
 * success green-600, info blue-500. Borders: {hue}-150 strokes. */
/* Neutral = classic dark toast: graphite-900 surface, inverse (white) text. */
.toast-neutral {
  --toast-accent: var(--color-text-inverse);
  background: rgba(38, 45, 61, 0.9); /* graphite-800 @ 90% */
  border-color: rgba(255, 255, 255, 0.12);
  color: var(--color-text-inverse);
}
.toast-neutral .toast-icon,
.toast-neutral .toast-close { color: var(--color-text-inverse); }
.toast-error   { --toast-accent: var(--color-danger);            background: var(--color-danger-subtle);  border-color: var(--color-red-150); }
.toast-warning { --toast-accent: var(--color-warning);           background: var(--color-warning-subtle); border-color: var(--color-yellow-150); }
.toast-success { --toast-accent: var(--color-green-600);     background: var(--color-success-subtle); border-color: var(--color-green-150); }
.toast-info    { --toast-accent: var(--color-accent);            background: var(--color-accent-subtle);  border-color: var(--color-blue-150); }

/* ---------- Top bar ----------
 * Dark application chrome. 56px tall, graphite-800 background.
 * Brand on left, search in middle, avatar on right.
 */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--spacing-6);
  height: var(--header-height);
  padding: 0 var(--spacing-6);
  background: var(--color-graphite-800);
  color: var(--color-white);
  /* Query container so the bar can collapse to a mobile layout based on its own
   * width (works full-width in real use and inside the sized playground frame). */
  container-type: inline-size;
}
/* Hamburger + page title + primary action — the collapsed mobile layout.
 * The hamburger is the icon-button component (.btn.btn-icon-only.btn-ghost);
 * this marker only controls when it shows (hidden on the wide bar, revealed by
 * the container query below). */
.topbar-menu { display: none; flex-shrink: 0; }
.topbar-title {
  display: none;
  flex: 1; min-width: 0;
  font: var(--font-weight-semibold) var(--text-lg)/1 var(--font-sans);
  color: inherit;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.topbar-cta { display: none; flex-shrink: 0; }
.topbar-brand {
  display: inline-flex;
  align-items: center;
  gap: var(--spacing-2);
  text-decoration: none;
  color: inherit;
  font: var(--font-weight-semibold) var(--text-lg)/1 var(--font-sans);
  flex-shrink: 0;
}
.topbar-logo {
  width: 20px; height: 20px;
  border-radius: var(--radius-full);
  border: 1.5px solid currentColor;
  display: inline-block;
  flex-shrink: 0;
}
.topbar-brand-logo {
  height: 22px;
  width: auto;
  display: block;
}
.topbar-actions {
  display: flex;
  align-items: center;
  gap: var(--spacing-4);
  flex-shrink: 0;
}

.topbar-search {
  position: relative;
  width: 360px;
}
.topbar-search .search-icon {
  position: absolute;
  left: var(--spacing-3);
  top: 50%;
  transform: translateY(-50%);
  width: 16px; height: 16px;
  color: rgba(255, 255, 255, 0.55);
  pointer-events: none;
}
.topbar-search-input {
  width: 100%;
  height: 36px;
  padding: 0 var(--spacing-4) 0 36px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.10);
  border-radius: var(--radius-sm);
  color: var(--color-white);
  font: var(--type-body);
  transition: background var(--duration-fast) var(--ease),
              border-color var(--duration-fast) var(--ease);
}
.topbar-search-input::placeholder { color: rgba(255, 255, 255, 0.55); }
.topbar-search-input:hover { background: rgba(255, 255, 255, 0.12); }
.topbar-search-input:focus {
  outline: none;
  background: rgba(255, 255, 255, 0.14);
  border-color: rgba(255, 255, 255, 0.30);
}

/* The account button is the avatar component (.avatar.avatar-md) — it already
 * covers the button reset, hover dim and focus ring. */

@media (max-width: 720px) {
  .topbar-search { width: 200px; }
}

/* Collapsed bar (≤1024px, Picasso lg edge): light surface, hamburger + page
 * title on the left, a primary action on the right; the brand logo, search and
 * account menu drop.
 *
 * It collapses at the SAME edge as the side nav (see "Side nav — tablet and
 * below"), and that is not a coincidence — below 1024px the rail is off-canvas
 * and the hamburger in this bar is the only way to reach it. Move one edge and
 * you must move the other, or there is a band of widths with a hidden nav and
 * no control that opens it.
 *
 * Two queries, saying the same thing, because neither covers both cases:
 *
 *   @media     — a real prototype, where .topbar spans the viewport. This is
 *                the one that matters for a feature screen.
 *   @container — the kit's playground, where .topbar is narrow inside a wide
 *                window, so the viewport says nothing useful about it. Its
 *                edge stays at 768px: that is a measurement of the BAR, and a
 *                bar 768px wide is cramped whatever the window is doing.
 *
 * The bar's own background cannot live in the @container block: .topbar
 * carries container-type itself, and a container query styles a container's
 * descendants, never the container. So the media query sets it in the
 * prototype case and the @container block repeats it for the playground. */
@media (max-width: 1024px) {
  .topbar { background: var(--color-surface); color: var(--color-text); gap: var(--spacing-3); }
  .topbar .topbar-menu  { display: inline-flex; }
  .topbar .topbar-title { display: block; font: var(--type-h2); }
  .topbar .topbar-cta   { display: inline-flex; }
  .topbar .topbar-brand,
  .topbar .topbar-search,
  .topbar .topbar-account { display: none; }
}

@container (max-width: 768px) {
  /* Collapsed bar flips to a light surface with a dark H2 title. */
  .topbar { background: var(--color-surface); color: var(--color-text); gap: var(--spacing-3); }
  .topbar .topbar-menu  { display: inline-flex; }
  .topbar .topbar-title { display: block; font: var(--type-h2); }
  .topbar .topbar-cta   { display: inline-flex; }
  .topbar .topbar-brand,
  .topbar .topbar-search,
  .topbar .topbar-account { display: none; }
}

/* ---------- Dropdown menu ----------
 * The OPEN menu panel — paired with a trigger (input/button) elsewhere.
 * Items compose: icon, label, description, avatar, selected check, removable chip.
 *
 * Usage:
 *   <div class="dropdown-menu">
 *     <button class="dropdown-item">
 *       <svg class="dropdown-item-icon"><use href="#i-bell"/></svg>
 *       <div class="dropdown-item-text">
 *         <span class="dropdown-item-label">Label</span>
 *         <span class="dropdown-item-description">Optional sub-line</span>
 *       </div>
 *     </button>
 *   </div>
 */
.dropdown-menu {
  display: flex;
  flex-direction: column;
  gap: 2px;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-5);
  padding: var(--spacing-2);
  min-width: 200px;
}

.dropdown-item {
  display: flex;
  align-items: center;
  gap: var(--spacing-3);
  width: 100%;
  padding: var(--spacing-2) var(--spacing-3);
  border: 0;
  background: transparent;
  border-radius: var(--radius-sm);
  font: var(--type-body);
  color: var(--color-text);
  text-align: left;
  text-decoration: none;      /* dropdown items render as <a> or <button> */
  cursor: pointer;
  transition: background var(--duration-fast) var(--ease);
}
.dropdown-item:hover  { background: var(--color-accent-subtle); text-decoration: none; }
.dropdown-item:disabled,
.dropdown-item[aria-disabled="true"] { opacity: 0.5; cursor: not-allowed; }

/* Hairline divider inside a menu — render as <hr class="dropdown-divider"> */
.dropdown-divider {
  height: 1px;
  margin: var(--spacing-1) 0;
  background: var(--color-border);
  border: 0;
}

/* Optional pieces inside an item */
.dropdown-item-icon {
  width: 16px;
  height: 16px;
  font-size: 16px; /* .icon is 1em, so font-size is still the sizing lever */
  flex-shrink: 0;
  color: var(--color-text-muted);
}
/* The dropdown item avatar is the .avatar component (.avatar.avatar-md) — size,
 * background, image fit and the cut corner all come from there. Only the flex
 * reset is specific to sitting in a dropdown row. */
.dropdown-item-avatar { flex-shrink: 0; }
.dropdown-item-text {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
  flex: 1;
}
.dropdown-item-label {
  font: var(--type-body);
  color: var(--color-text);
  line-height: 1.3;
}
.dropdown-item-description {
  font: var(--type-body-sm);
  color: var(--color-text-muted);
  line-height: 1.3;
}

/* Profile card at the top of an account menu — avatar + name + role.
 *   <div class="dropdown-header">
 *     <span class="avatar avatar-md">…</span>
 *     <div class="dropdown-item-text">
 *       <span class="dropdown-item-label">Name</span>
 *       <span class="dropdown-item-description">Role</span>
 *     </div>
 *   </div>
 */
.dropdown-header {
  display: flex;
  align-items: center;
  gap: var(--spacing-3);
  padding: var(--spacing-2) var(--spacing-3) var(--spacing-3);
}
.dropdown-header .dropdown-item-label { font-weight: var(--font-weight-semibold); white-space: nowrap; }
/* A name and a role are identity, not content: they belong on one line each, so
 * a long role ellipses rather than growing the menu or stacking three lines.
 * Scoped to the header — an item's own description still wraps, which is what
 * explanatory rows need. .dropdown-item-text already carries min-width: 0, so
 * the flex child can shrink far enough for the ellipsis to show. */
.dropdown-header .dropdown-item-label,
.dropdown-header .dropdown-item-description {
  overflow: hidden;
  text-overflow: ellipsis;
}
.dropdown-header .dropdown-item-description { white-space: nowrap; }
/* nowrap alone only stops the wrap: the menu has a min-width and no max, so a
 * long role widens the whole panel instead of ellipsing. Capping the header's
 * text block is what makes the ellipsis appear, and it bounds only the identity
 * row — items still size to their own content. */
.dropdown-header .dropdown-item-text { max-width: 220px; }

/* Trailing count/badge inside a dropdown item — pushed to the right edge */
.dropdown-item-count { margin-left: auto; flex-shrink: 0; }

/* Selected state — leading check + semibold label.
 * Put .dropdown-item-check on EVERY item, not just the selected one: it is
 * opacity:0 until .is-selected, and it is what reserves the leading slot. On
 * the selected item alone it indents that one label and shows no check. */
.dropdown-item-check {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
  color: var(--color-text);
  opacity: 0; /* placeholder slot keeps labels aligned across selected/unselected */
}
.dropdown-item.is-selected .dropdown-item-check  { opacity: 1; }
.dropdown-item.is-selected .dropdown-item-label,
.dropdown-item.is-selected                        { font-weight: var(--font-weight-semibold); }

/* Multi-select chip list inside a dropdown panel (layout only — chips live in .chip) */
.dropdown-chips {
  display: flex;
  flex-wrap: wrap;
  gap: var(--spacing-2);
  padding: var(--spacing-1);
}

/* ---------- Chip ----------
 * Removable interactive pill. Reused in: dropdown multi-select, .input-tags, anywhere
 * a user-added/removable token belongs.
 *
 *   <span class="chip">React
 *     <button class="chip-remove" aria-label="Remove"><svg><use href="#i-x"/></svg></button>
 *   </span>
 */
.chip {
  display: inline-flex;
  align-items: center;
  gap: var(--spacing-1);
  height: 28px;
  padding: 0 var(--spacing-3);
  border-radius: var(--radius-full);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  font: var(--font-weight-semibold) var(--text-xxs)/1 var(--font-sans);
  color: var(--color-text);
}
/* Tight right padding when a remove button is present */
.chip:has(.chip-remove) { padding-right: 2px; }
.chip-remove {
  width: 22px;
  height: 22px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 0;
  padding: 0;
  background: transparent;
  border-radius: var(--radius-full);
  cursor: pointer; font: inherit;
  color: var(--color-text-muted);
  transition: background var(--duration-fast) var(--ease),
              color var(--duration-fast) var(--ease);
}
.chip-remove:hover { background: var(--color-surface-muted); color: var(--color-text); }
.chip-remove svg   { width: 12px; height: 12px; }

.dropdown-menu-label {
  font: var(--type-caption);
  color: var(--color-text-muted);
  padding: var(--spacing-1) var(--spacing-2);
}

/* Search-in-menu — a filter field pinned above a scrollable item list. Put the
 * items in a .dropdown-list (scrolls independently) and a .dropdown-empty row
 * for the no-results state. Filtering is wired by the [data-dropdown-search]
 * handler in example.html. */
.dropdown-search { padding: var(--spacing-1); }
.dropdown-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
  overflow-y: auto;
  max-height: 240px;
}
.dropdown-empty {
  margin: 0;
  padding: var(--spacing-3);
  text-align: center;
  font: var(--type-body-sm);
  color: var(--color-text-muted);
}

/* ---------- Date picker ----------
 * Calendar popover on a date field. The field is the usual .input-icon
 * (calendar glyph left); the panel is built and wired by the [data-datepicker]
 * handler in example.html — header (‹ Month Year ›), weekday row, a 6×7 day
 * grid, and a Today / Clear footer.
 *
 *   <div class="datepicker" data-datepicker>
 *     <div class="input-icon input-icon-left">
 *       <svg class="icon input-icon-glyph"><use href="#i-calendar-blank"/></svg>
 *       <input class="input datepicker-input" type="text" placeholder="Select date" autocomplete="off" />
 *     </div>
 *   </div>
 *
 * Options (attributes on .datepicker):
 *   data-min="2026-10-01"      earliest pickable day (ISO)
 *   data-min-from="#start-id"  earliest = the date in another date field (ranges)
 *   data-align="end"           right-align the panel to the field
 * Picking a day writes "Oct 12, 2026" into the input and fires input + change,
 * so form logic listening to the field reacts as if it were typed.
 * States: day .is-today · .is-selected · .is-outside (other month) · :disabled.
 */
.datepicker { position: relative; }
.datepicker > .input-icon,
.datepicker .datepicker-input { width: 100%; }
.datepicker-panel {
  position: absolute;
  top: calc(100% + var(--spacing-1));
  left: 0;
  z-index: var(--z-dropdown);
  width: 280px;
  padding: var(--spacing-3);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-5);
  display: flex;
  flex-direction: column;
  gap: var(--spacing-2);
}
.datepicker-panel[hidden] { display: none; }
.datepicker[data-align="end"] .datepicker-panel { left: auto; right: 0; }
.datepicker-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--spacing-2);
}
.datepicker-month {
  font: var(--type-body-sm-semibold);
  color: var(--color-text);
}
/* Next arrow is the left chevron flipped — the sprite has no chevron-right. */
.datepicker-next .icon { transform: scaleX(-1); }
.datepicker-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
}
.datepicker-dow {
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  font: var(--type-caption);
  color: var(--color-text-subtle);
}
.datepicker-day {
  height: 32px;
  border: 0;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--color-text);
  font: var(--type-body-sm);
  font-variant-numeric: tabular-nums;
  cursor: pointer;
  transition: background var(--duration-fast) var(--ease);
}
.datepicker-day:hover { background: var(--color-surface-muted); }
.datepicker-day:focus-visible { outline: 2px solid var(--color-border-focus); outline-offset: -2px; }
.datepicker-day.is-outside { color: var(--color-text-subtle); }
/* Today is marked with a dot under the date rather than a ring around it: the
   ring read as a selection, which is the one thing today is not. */
.datepicker-day.is-today { font-weight: var(--font-weight-semibold); position: relative; }
.datepicker-day.is-today::after {
  content: '';
  position: absolute;
  left: 50%;
  bottom: 4px;
  transform: translateX(-50%);
  width: 4px;
  height: 4px;
  border-radius: var(--radius-full);
  background: var(--color-accent);
}
/* On the selected day the accent becomes the background, so the dot flips */
.datepicker-day.is-today.is-selected::after { background: var(--color-text-inverse); }
.datepicker-day.is-selected,
.datepicker-day.is-selected:hover { background: var(--color-accent); color: var(--color-text-inverse); box-shadow: none; }
.datepicker-day:disabled { color: var(--color-text-subtle); opacity: 0.4; cursor: not-allowed; background: transparent; }
.datepicker-foot {
  display: flex;
  justify-content: space-between;
  border-top: 1px solid var(--color-border);
  padding-top: var(--spacing-2);
}

/* Generic dropdown wrapper — pairs a `.dropdown-trigger` with a `.dropdown-menu` */
.dropdown {
  position: relative;
  display: inline-flex;
}
.dropdown-menu-end {
  position: absolute;
  top: calc(100% + var(--spacing-1));
  right: 0;
  z-index: var(--z-dropdown);
  min-width: 180px;
}
.dropdown-menu-start {
  position: absolute;
  top: calc(100% + var(--spacing-1));
  left: 0;
  z-index: var(--z-dropdown);
  min-width: 180px;
}
.dropdown .dropdown-menu[hidden] { display: none; }

/* Destructive item variant */
.dropdown-item-danger              { color: var(--color-danger); }
.dropdown-item-danger:hover        { background: var(--color-danger-subtle); }
.dropdown-item-danger .dropdown-item-icon { color: var(--color-danger); }

/* ---------- Type helpers ---------- */
.h1 { font: var(--type-h1); margin: 0; color: var(--color-text); }
.h2 { font: var(--type-h2); margin: 0; color: var(--color-text); }
.h3 { font: var(--type-h3); margin: 0; color: var(--color-text); }
.h4 { font: var(--type-h4); margin: 0; color: var(--color-text); }
.body-lg  { font: var(--type-body-lg);  color: var(--color-text); }
.body     { font: var(--type-body);     color: var(--color-text); }
.body-sm  { font: var(--type-body-sm);  color: var(--color-text-muted); }
.body-xs  { font: var(--type-body-xs);  color: var(--color-text-muted); }
.body-xxs { font: var(--type-body-xxs); color: var(--color-text-subtle); }
/* Semibold body variants (NB-55) — same sizes, weight 600 */
.body-lg-semibold  { font: var(--type-body-lg-semibold);  color: var(--color-text); }
.body-semibold     { font: var(--type-body-semibold);     color: var(--color-text); }
.body-sm-semibold  { font: var(--type-body-sm-semibold);  color: var(--color-text); }
.body-xs-semibold  { font: var(--type-body-xs-semibold);  color: var(--color-text); }
.body-xxs-semibold { font: var(--type-body-xxs-semibold); color: var(--color-text); }
.caption  { font: var(--type-caption);  color: var(--color-text-subtle); }

/* ---------- Layout helpers ----------
 * Tiny flex/grid primitives used across prototypes. `.page` lives in
 * semantic.css (it's the content max-width wrapper). The three below are
 * the everyday building blocks for stacking content vertically (`.stack`),
 * placing items in a wrapping row (`.row`), or an even grid that collapses on
 * narrow viewports (`.grid-2`, `.grid-4`). `.grid-4` steps down to two columns
 * before it goes to one, because four metric tiles stacked in a single column
 * push everything below them off the first screen.
 */
.stack  { display: flex; flex-direction: column; gap: var(--spacing-4); }
.row    { display: flex; gap: var(--spacing-3); align-items: center; flex-wrap: wrap; }
.row-end { justify-content: flex-end; }   /* actions pushed to the trailing edge */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--spacing-6); }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--spacing-4); }

@media (max-width: 1024px) {
  .grid-4 { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 720px) {
  .grid-2 { grid-template-columns: 1fr; }
  .grid-4 { grid-template-columns: 1fr; }
}

/* ---------- Drawer parts ----------
 * Mirrors the .modal-header/.modal-body/.modal-footer pattern, since drawers
 * use the same three-section layout. (The drawer container itself lives above
 * in the Modal/Drawer section.)
 */
.drawer-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--spacing-3);
  padding: var(--spacing-6);
  border-bottom: 1px solid var(--color-border);
  flex-shrink: 0;
}
.drawer-body {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: var(--spacing-6);
  font: var(--type-body);
  color: var(--color-text);
}
.drawer-footer {
  display: flex;
  justify-content: flex-end;
  gap: var(--spacing-2);
  padding: var(--spacing-4) var(--spacing-6);
  border-top: 1px solid var(--color-border);
  flex-shrink: 0;
}

/* devtools.css — author/dev tooling only.

 * This file is auto-inlined into every prototype alongside the three-layer
 * design system (tokens.css → semantic.css → components.css), but it is
 * explicitly NOT part of that layer chain — nothing here is a user-facing
 * UI primitive. Everything is dormant until the matching trigger fires
 * (e.g. the map overlay's toggle).
 *
 * Rules of thumb:
 * - Reach for this file when adding something authors/devs use to *build*
 *   prototypes (debug overlays, grid toggles, coachmark editors,

 *   in components.css.

/* ============================================================

.is-map-mode [data-picasso-radius]:hover,

.is-map-mode [data-picasso-color],
.is-map-mode [data-picasso-font],
.is-map-mode [data-picasso-radius],
.is-map-mode [data-picasso-icon],

/* Nav toggle turns pink while the inspector is on. */
.map-toggle.is-active,

.map-pop {
  position: fixed;
