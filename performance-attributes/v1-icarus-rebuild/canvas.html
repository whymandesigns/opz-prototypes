<script>
/* From the original artifact's canvas.json: order, positions, sizes, titles and row notes. */
const BOARDS = [
  ['main',             0,    0,    1440, 900, '01 · OKRs page · what’s new: Performance attributes button, attribute filter, icons on objectives and key results'],
  ['prototype',        1520, 0,    1440, 900, '02 · Clickable prototype · try the button, the icons, the menus and the filter', true],
  ['catalog',          3040, 0,    1440, 900, '03 · Performance attributes · the list, with how many objectives and key results support each'],
  ['detail',           4560, 0,    1440, 900, '04 · One attribute · what supports it this year, by level; a row opens that OKR (searched and highlighted, like global search)'],
  ['detail-empty',     6080, 0,    1440, 900, '05 · One attribute · nothing supports it yet (2027)'],
  ['kr-menu-add',      0,    1300, 1440, 900, '06 · Key result menu · Add performance attribute'],
  ['picker-add',       1520, 1300, 1440, 900, '07 · Add performance attribute · one per key result'],
  ['toast',            3040, 1300, 1440, 900, '08 · Added · the icon leads the key result’s pill, so the counters stay aligned'],
  ['kr-menu-pa',       4560, 1300, 1440, 900, '09 · Key result menu · one item, Change performance attribute, when one is set'],
  ['picker-change',    6080, 1300, 1440, 900, '10 · Change performance attribute · current one marked; Remove attribute lives here'],
  ['card-menu',        0,    2600, 1440, 900, '11 · Objective menu · Change performance attribute'],
  ['picker-objective', 1520, 2600, 1440, 900, '12 · Change performance attribute · for the objective'],
  ['obj-tip',          3040, 2600, 1440, 900, '13 · Objective · icon with its tooltip, next to Draft / Signed Off'],
  ['pa-tip',           0,    3900, 1440, 900, '14 · Key result · icon with its tooltip; click opens that attribute'],
  ['filter-menu',      1520, 3900, 1440, 900, '15 · Filter · All attributes, with icons'],
  ['filtered',         3040, 3900, 1440, 900, '16 · Filtered by Speed · OKRs whose objective or any key result supports it'],
  ['read-only',        4560, 3900, 1440, 900, '17 · Read-only OKRs (here: company level) · icons show and open, no menu'],
  ['icons',            0,    5200, 1180, 720, '18 · The eight icons · all from the Picasso icon set, for approval'],
];
const NOTES = [
  [0, -300, 'See and learn the performance attributes'],
  [0, 1000, 'Add, change or remove a key result’s attribute'],
  [0, 2300, 'The same for an objective'],
  [0, 3600, 'Read and filter'],
  [0, 4900, 'Icons'],
];
const ROWS = [[0, 5], [5, 10], [10, 13], [13, 17], [17, 18]];

const world = document.getElementById('pa-cv-world'), view = document.getElementById('pa-cv-view');
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
world.innerHTML = NOTES.map(([x, y, t]) => `<div class="pa-cv-note" style="left:${x}px;top:${y}px">${esc(t)}</div>`).join('') +
  BOARDS.map(([key, x, y, w, h, title, live]) => `<div class="pa-cv-board${live ? ' is-live' : ''}" id="board-${key}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">
    <div class="pa-cv-head"><span class="pa-cv-title" title="${esc(title)}">${esc(title)}</span><a class="btn btn-secondary" href="index.html?states=1&amp;state=${key}" target="_blank" rel="noopener">Open</a></div>
    <div class="pa-cv-frame"><iframe title="${esc(title)}" src="index.html?state=${key}&amp;embed=1"></iframe><div class="pa-cv-shield" data-focus="${key}"></div></div>
  </div>`).join('');

/* pan + zoom */
let z = 0.1, px = 40, py = 120;
const apply = () => { world.style.transform = `translate(${px}px, ${py}px) scale(${z})`; document.getElementById('pa-cv-zoom').textContent = Math.round(z * 100) + '%'; };
const zoomAt = (nz, cx, cy) => { nz = Math.min(1.5, Math.max(0.04, nz)); px = cx - (cx - px) * nz / z; py = cy - (cy - py) * nz / z; z = nz; apply(); };
function fit(x0 = -40, y0 = -400, x1 = 7560, y1 = 5960) {
  const r = view.getBoundingClientRect(); z = Math.min(r.width / (x1 - x0), r.height / (y1 - y0)) * 0.96;
  px = (r.width - (x1 - x0) * z) / 2 - x0 * z; py = (r.height - (y1 - y0) * z) / 2 - y0 * z; apply();
}
function focusBoard(key) {
  const b = BOARDS.find(x => x[0] === key); if (!b) return;
  document.querySelectorAll('.pa-cv-board.is-focus').forEach(el => el.classList.remove('is-focus'));
  document.getElementById('board-' + key).classList.add('is-focus');
  fit(b[1] - 80, b[2] - 200, b[1] + b[3] + 80, b[2] + b[4] + 80);
}
view.addEventListener('wheel', e => {
  e.preventDefault();
  const r = view.getBoundingClientRect();
  if (e.ctrlKey || e.metaKey) zoomAt(z * Math.exp(-e.deltaY * 0.01), e.clientX - r.left, e.clientY - r.top);
  else { px -= e.deltaX; py -= e.deltaY; apply(); }
}, { passive: false });
let drag = null;
view.addEventListener('pointerdown', e => { if (e.target.closest('a, button, iframe')) return; drag = { x: e.clientX, y: e.clientY, px, py, moved: false }; view.setPointerCapture(e.pointerId); view.classList.add('is-panning'); });
view.addEventListener('pointermove', e => { if (!drag) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y; if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true; px = drag.px + dx; py = drag.py + dy; apply(); });
view.addEventListener('pointerup', e => {
  const d = drag; drag = null; view.classList.remove('is-panning');
  if (d && !d.moved) { const s = document.elementFromPoint(e.clientX, e.clientY); const f = s && s.closest('[data-focus]'); if (f) focusBoard(f.dataset.focus); }
});
document.querySelectorAll('[data-zoom]').forEach(b => b.addEventListener('click', () => {
  const r = view.getBoundingClientRect();
  if (b.dataset.zoom === 'fit') { document.querySelectorAll('.pa-cv-board.is-focus').forEach(el => el.classList.remove('is-focus')); fit(); }
  else zoomAt(z * (b.dataset.zoom === 'in' ? 1.25 : 0.8), r.width / 2, r.height / 2);
}));
window.addEventListener('resize', () => fit());
fit();

/* Review bar adapter: comments on the canvas are filed against the board under the pin. */
window.REVIEW = { screen: () => ({ id: 'canvas', name: 'Performance attributes · canvas' }), roots: '.pa-cv-bar, .pa-cv-board' };

/* State switcher (?states=1): picking a state zooms to its screen. */
(function () {
  const params = new URLSearchParams(location.search);
  const groups = ['See and learn the attributes', 'A key result’s attribute', 'An objective’s attribute', 'Read and filter', 'Icons'];
  document.getElementById('pa-switcher-body').innerHTML = ROWS.map(([a, b], i) => `<div class="pa-switcher-group"><span>${groups[i]}</span>${BOARDS.slice(a, b).map(x => `<button type="button" data-state="${x[0]}">${esc(x[5].split(' · ').slice(0, 2).join(' · '))}</button>`).join('')}</div>`).join('');
  const current = params.get('state');
  if (current) focusBoard(current);
  if (params.get('states') !== '1') return;
  const sw = document.getElementById('pa-switcher'); sw.hidden = false;
  sw.querySelectorAll('[data-state]').forEach(b => {
    b.classList.toggle('is-current', b.dataset.state === current);
    b.addEventListener('click', () => {
      sw.querySelectorAll('[data-state]').forEach(x => x.classList.toggle('is-current', x === b));
      focusBoard(b.dataset.state);
      history.replaceState(null, '', `?states=1&state=${b.dataset.state}`);
    });
  });
  const toggle = sw.querySelector('.pa-switcher-toggle');
  toggle.addEventListener('click', () => { const on = !sw.classList.contains('is-collapsed'); sw.classList.toggle('is-collapsed', on); toggle.textContent = on ? '+' : '–'; });
})();
</script>

<style>
/* review.css — the review bar (author/reviewer tooling).
 *
 * Auto-inlined into every prototype by inline.py together with review.js, but
 * NOT part of the three-layer design system chain. It is dormant until the
 * prototype is opened with `?review=1` (the choice is remembered per page;
 * `?review=0` turns it off again).

 * What it gives reviewers, from a bar at the bottom of the page:

.rv-hidden{display:none !important;}

/* Floating toggle — bottom right of every page, even when the bar is off */
.rv-toggle{position:fixed;right:20px;bottom:20px;z-index:2200;width:44px;height:44px;border-radius:50%;border:1px solid #d8d9dc;background:#fff;color:#1d2433;

/* Bar */
.rv-bar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:2000;display:flex;align-items:center;gap:0;

.rv-bar button{height:32px;border:none;border-radius:16px;background:none;color:#cfd4de;padding:0 10px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:13px;cursor:pointer;}

body.rv-edit .rv-bar *,body.rv-comment .rv-bar *,body.rv-spotmode .rv-bar *,body.rv-edit .rv-side *,body.rv-comment .rv-side *,body.rv-spotmode .rv-side *,.rv-pin{cursor:pointer !important;}

.rv-editing{outline:2px solid var(--rv-blue);outline-offset:2px;border-radius:2px;background:rgba(32,78,207,.08);white-space:pre-wrap;min-width:8px;display:inline-block;}

/* Pins */
.rv-pins{position:fixed;inset:0;pointer-events:none;z-index:1800;}

<style>
/* plugins.css — the plugin launcher (author/reviewer tooling). Pairs with plugins.js.
 *
 * One floating button, bottom right, that owns every author plugin on the page:
 * the review bar, the states switcher and the component map. Before this, each
 * plugin had its own trigger in its own corner (or none at all), which is what
 * made them feel like clutter rather than tools.
 *
 * Self-contained on purpose: colours are literal, not tokens, so the launcher
 * looks the same on a prototype that does not load the design system — the same
 * rule review.css follows. Nothing here is a user-facing UI primitive.
 */

.pg-fab, .pg-panel, .pg-panel * { box-sizing: border-box; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }

/* ── The button ───────────────────────────────────────────────────── */
.pg-fab {
  position: fixed; right: 20px; bottom: 20px; z-index: 2300;
  width: 44px; height: 44px; border-radius: 50%;
  border: 1px solid #d8d9dc; background: #fff; color: #1d2433;
  display: grid; place-items: center; cursor: pointer;
  box-shadow: 0 4px 14px rgba(0,0,0,.18);
  transition: transform .15s ease, background .15s ease, border-color .15s ease;
}
.pg-fab:hover { transform: scale(1.06); }
.pg-fab.on    { background: #1d2433; border-color: #1d2433; color: #fff; }

/* How many plugins are running right now — only when at least one is */
.pg-fab .pg-count {
  position: absolute; top: -2px; right: -2px;
  min-width: 18px; height: 18px; padding: 0 5px;
  background: #ff8a3d; color: #fff;
  border: 2px solid #fff; border-radius: 9px;
  font: 700 10px/14px ui-sans-serif, system-ui, sans-serif;
  display: grid; place-items: center;
}

/* The bar and the switcher get out of the way of the launcher */
body.pg-open .pg-fab { background: #1d2433; border-color: #1d2433; color: #fff; }

/* ── The panel ────────────────────────────────────────────────────── */
.pg-panel {
  position: fixed; right: 20px; bottom: 74px; z-index: 2300;
  width: 290px; background: #fff; color: #1d2433;
  border: 1px solid #d8d9dc; border-radius: 12px;
  box-shadow: 0 12px 40px rgba(0,0,0,.22);
  overflow: hidden;
  font-size: 13px; line-height: 19px;
  animation: pgin .16s ease-out;
}
@keyframes pgin { from { opacity: 0; transform: translateY(6px); } }

.pg-panel .pg-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 12px; background: #1d2433; color: #fff;
  font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
}
.pg-panel .pg-head button {
  border: 0; background: transparent; color: inherit; cursor: pointer;
  font-size: 15px; line-height: 1; padding: 2px 4px;
}

.pg-panel .pg-list { padding: 6px; display: flex; flex-direction: column; gap: 2px; }

/* One plugin */
.pg-item {
  display: grid; grid-template-columns: 1fr auto; align-items: center;
  gap: 10px; padding: 9px 10px; border-radius: 8px;
  background: transparent; border: 0; width: 100%; text-align: left;
  color: inherit; font: inherit; cursor: pointer;
}
.pg-item:hover:not(:disabled) { background: #f4f5f6; }
.pg-item:disabled { cursor: default; opacity: .5; }
.pg-item .pg-name { font-weight: 600; }
.pg-item .pg-why  { display: block; margin-top: 1px; font-size: 11px; line-height: 15px; color: #6b7280; font-weight: 400; }

/* The switch — a plain one so it never depends on components.css */
.pg-switch {
  width: 34px; height: 20px; border-radius: 10px;
  background: #d8d9dc; position: relative; flex-shrink: 0;
  transition: background .15s ease;
}

  content: ''; position: absolute; top: 2px; left: 2px;
  width: 16px; height: 16px; border-radius: 50%; background: #fff;
  box-shadow: 0 1px 3px rgba(0,0,0,.3);
  transition: transform .15s ease;
}
.pg-item.is-on .pg-switch { background: #204ecf; }
.pg-item.is-on .pg-switch::after { transform: translateX(14px); }

.pg-panel .pg-foot {
  padding: 8px 12px 10px; border-top: 1px solid #ebecef;
  font-size: 11px; line-height: 16px; color: #6b7280;
}

/* review.js mounts its own circle button; the launcher owns that corner now.
   Kept as a rule rather than deleted in review.js so an older inlined bar that
   has not been refreshed yet still gets tidied up. */
.pg-has-launcher .rv-toggle { display: none !important; }

/* The review bar's own corner cases.

   The bar runs along the bottom, so the button sits above it — keyed to the bar
   being on screen, never to which mode it is in. The modes do not move the bar,
   so anything mode-dependent here just makes the button jump about as you switch
   between them. It has to clear the bar in every mode, too: the bar is centred
   and grows with its buttons, and on a narrow viewport it runs the full width
   and would sit under the button even in View. */
body:has(#rvBar) .pg-fab { bottom: 76px; }
body:has(#rvBar) .pg-panel { bottom: 130px; }

/* The drawer covers this corner completely. review.css hides its own toggle
   then, and the launcher does the same rather than float over the comments. */
body.rv-side-open .pg-fab, body.rv-side-open .pg-panel { display: none; }

/* Same courtesy for the states switcher, which sits bottom-left and is tall:
   with the bar on, its last few states ended up behind it. The rule lives here
   rather than in each prototype because the switcher is hand-copied with a
   different prefix every time, and this file already reaches all of them. */
body:has(#rvBar) [id$="-switcher"] { bottom: 76px; }

@media (max-width: 520px) {
  .pg-panel { right: 12px; left: 12px; width: auto; }
  .pg-fab { right: 12px; bottom: 12px; }
}

<script>
/* review.js — the review bar (author/reviewer tooling). Pairs with review.css.
 *
 * Auto-inlined into every prototype by inline.py. Dormant until turned on
 * with the floating circle button (bottom right of every page) or by opening
 * the page with `?review=1`; the choice is remembered per page in
 * localStorage, `?review=0` or the same button turns it off again.
 *
 * Modes (bottom bar, keyboard letters in brackets):
 *   View [V]       use the prototype normally
 *   Edit text [E]  click any text and retype it — edits persist and are reapplied after re-renders
 *   Comment  [C]   click any element, leave a note; numbered pins + a side panel (open / resolved)
 *   Spotlight [S]  drag a rectangle; everything outside it is dimmed
 *
 * Storage: everything goes to `/api/feedback` as small operations and the
 * page polls it, so comments and edits are shared by everyone who opens the
 * same prototype. Locally that API is tools/serve.mjs (writes feedback.json
 * next to the prototype); deployed it is api/feedback.js in the prototypes
 * repository, on Neon Postgres. Without either, the bar keeps everything in
 * this browser only and says "Local only". Reviewers are asked for a name the
 * first time they post. "Copy comments as prompt" turns the open comments into
 * a prompt for a coding agent.
 *
 * Optional host adapter — a prototype may define `window.REVIEW` with:
 *   api:    '/api/feedback'        where the store lives (default shown)
 *   screen: () => ({ id, name })   name of the screen a comment is left on
 *   goto:   id => void             navigate to that screen ("Go to" button)
 *   roots:  'css selector'         stable containers used to address elements
 *                                  (default: direct children of <body>)
 *   key:    el => string           stable name for such a container (default:
 *                                  data-rv-root, id, data-layer/-pop/-view, tag.class)
 * Elements are addressed by root + child-index path, so a prototype that
 * re-renders its DOM keeps its pins and edits as long as the structure holds.
 */
(() => {
  /* ── Enable / disable ─────────────────────────────────────────────── */
  const KEY = 'rv:' + location.pathname.replace(/index\.html$/, '');
  const PKEY = KEY + ':pending';          // ops waiting to reach the store
  const q = new URLSearchParams(location.search).get('review');
  try { if (q === '1' || q === '') localStorage.setItem(KEY + ':on', '1'); if (q === '0') localStorage.removeItem(KEY + ':on'); } catch {}
  let on = false; try { on = localStorage.getItem(KEY + ':on') === '1'; } catch {}

  window.__icarusReview = true;          // the launcher looks for this when listing plugins

  /* Floating toggle — the fallback trigger. plugins.js owns this corner when it
     is present (it hides this button via .pg-has-launcher), so the bar keeps its
     own switch for pages that carry the bar alone. */
  const ICON = '<svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5.5A2.5 2.5 0 0 1 5.5 3h9A2.5 2.5 0 0 1 17 5.5v6a2.5 2.5 0 0 1-2.5 2.5H9l-3.6 3v-3H5.5A2.5 2.5 0 0 1 3 11.5z"/><path d="M7 7.5h6M7 10.5h3.5"/></svg>';
  const mountToggle = () => {
    document.body.insertAdjacentHTML('beforeend', `<button type="button" id="rvToggle" class="rv-toggle${on ? ' on' : ''}" title="${on ? 'Turn the review bar off' : 'Review this page: comment, edit text, spotlight'}" aria-label="Review bar">${ICON}</button>`);
    document.getElementById('rvToggle').addEventListener('click', () => {
      try { on ? localStorage.removeItem(KEY + ':on') : localStorage.setItem(KEY + ':on', '1'); } catch {}
      const u = new URL(location.href); u.searchParams.delete('review'); location.replace(u.href);
    });
  };
  if (document.body) mountToggle(); else document.addEventListener('DOMContentLoaded', mountToggle);
  if (!on) return;

  const HOST = () => window.REVIEW || {};
  // Author tooling the bar must never treat as page content — its own
  // furniture plus the plugin launcher, which shares the screen with it.
  const REVIEW_UI = '.rv-bar,.rv-side,.rv-pins,.rv-hover,.rv-spot,.rv-toggle,.pg-fab,.pg-panel';
  let FB = {edits:{}, comments:[]};
  let mode = 'interact';                 // interact | edit | comment | spot
  let sideOpen = false, draft = null, selId = null, filter = 'open', saveState = '', online = false;
  let sideShown = false;                 // panel already on screen — re-render without replaying the entrance
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  /* ── Mount the UI ─────────────────────────────────────────────────── */
  document.body.insertAdjacentHTML('beforeend',
    `<div id="rvPins" class="rv-pins"></div><div id="rvHover" class="rv-hover rv-hidden"><span class="lb"></span></div>` +
    `<div id="rvSpot" class="rv-spot rv-hidden"></div><div id="rvBar" class="rv-bar"></div><div id="rvSide"></div>`);

  /* ── Store: shared through /api/feedback (ops in, merged document out), localStorage fallback ── */
  const API = HOST().api || '/api/feedback';
  const PATH = location.pathname.replace(/index\.html$/, '');
  const fetchFB = async () => { const r = await fetch(`${API}?p=${encodeURIComponent(PATH)}`, {cache:'no-store'}); if (!r.ok) throw 0; return r.json(); };
  /* Optional write token — only when the store is configured with one (it answers
     401). Reads are always open; the token is kept in this browser. */
  const token = () => { try { return localStorage.getItem('rv:token') || ''; } catch { return ''; } };
  const askToken = () => { const t = (prompt('This prototype needs a review token to post changes:') || '').trim(); try { if (t) localStorage.setItem('rv:token', t); } catch {} return t; };
  const remember = () => { try { localStorage.setItem(KEY, JSON.stringify(FB)); } catch {} };
  const sig = d => JSON.stringify([d.updated, d.comments.map(c => [c.id, c.text, c.resolved, c.resolution]), d.edits]);
  function adopt(doc) {
    doc.edits ||= {}; doc.comments ||= [];
    const changed = sig(doc) !== sig(FB); FB = doc; remember();
    if (changed) { quiet = 0; refresh(); renderSide(); renderBar(); } else quiet++;
  }
  async function load() {
    try { pending = JSON.parse(localStorage.getItem(PKEY)) || []; } catch { pending = []; }
    try { adopt(await fetchFB()); saveState = 'Shared'; online = true; }
    catch { try { FB = JSON.parse(localStorage.getItem(KEY)) || FB; } catch {} saveState = 'Local only'; }
    FB.edits ||= {}; FB.comments ||= [];
    restoreSession(); refresh(); renderBar(); renderSide();
    schedulePoll();                            // always — lets an offline start recover on its own
    if (pending.length) flush();               // replay anything queued while the store was away
  }
  /* Polling is the only steady load this puts on the store, so it backs off:
     4s while something is happening, stretching to 30s once the page has been
     quiet, and nothing at all while the tab is in the background. Returning to
     the tab checks immediately. */
  let pollT = null, quiet = 0;
  function schedulePoll() {
    clearTimeout(pollT);
    const delay = document.hidden ? 30000 : quiet > 6 ? 30000 : 4000;
    pollT = setTimeout(async () => { if (!document.hidden) await poll(); schedulePoll(); }, delay);
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { quiet = 0; poll().then(schedulePoll); } });
  let pending = [], saveT = null, inflight = false;
  // The queue outlives the page: ops made while the store is unreachable are
  // replayed on the next load, so "Local only" work is never stranded.
  const rememberPending = () => { try { pending.length ? localStorage.setItem(PKEY, JSON.stringify(pending)) : localStorage.removeItem(PKEY); } catch {} };
  function save(...ops) {                      // local state is already updated; ship the ops
    remember(); pending.push(...ops); rememberPending(); quiet = 0; schedulePoll();
    clearTimeout(saveT); saveState = online ? 'Saving…' : 'Local only'; renderBar();
    saveT = setTimeout(flush, 150);
  }
  async function flush() {
    if (inflight || !pending.length) return;
    const ops = pending; pending = []; rememberPending(); inflight = true;
    try {
      let r = await fetch(API, {method:'POST', headers:{'Content-Type':'application/json', ...(token() ? {'x-review-token':token()} : {})}, body:JSON.stringify({p:PATH, ops})});
      if (r.status === 401 && askToken())      // the store wants a token — ask once, then retry
        r = await fetch(API, {method:'POST', headers:{'Content-Type':'application/json', 'x-review-token':token()}, body:JSON.stringify({p:PATH, ops})});
      if (!r.ok) throw 0;
      const doc = await r.json(); online = true; saveState = 'Shared';
      if (!pending.length) adopt(doc);
    } catch { pending = ops.concat(pending); rememberPending(); saveState = online ? 'Save failed — retrying' : 'Local only'; }
    inflight = false; renderBar();
    if (pending.length) saveT = setTimeout(flush, online ? 150 : 5000);
  }
  async function poll() {
    if (inflight || document.querySelector('.rv-editing')) return;
    if (pending.length) return flush();        // drain queued ops before reading
    let doc; try { doc = await fetchFB(); } catch { return; }
    if (!online) { online = true; saveState = 'Shared'; renderSide(); }   // the store came back
    adopt(doc); renderBar();
  }
  /* Who is commenting — asked once, kept in this browser */
  function who(ask) {
    let n = ''; try { n = localStorage.getItem('rv:author') || ''; } catch {}
    if (!n && ask) { n = (prompt('Your name, so others know who left this:') || '').trim().slice(0, 60); try { if (n) localStorage.setItem('rv:author', n); } catch {} }
    return n;
  }
  const screen = () => { try { return HOST().screen?.() || null; } catch { return null; } };
  function restoreSession() {
    let s; try { s = JSON.parse(sessionStorage.getItem('rv-session')); sessionStorage.removeItem('rv-session'); } catch {}
    if (!s) return;
    sideOpen = !!s.sideOpen; selId = s.selId; filter = s.filter || filter;
    if (s.mode) setMode(s.mode);
  }

  /* ── Stable addressing: root key + child-index path ───────────────── */
  function roots() {
    const sel = HOST().roots;
    const list = sel ? [...document.querySelectorAll(sel)] : [...document.body.children];
    return list.filter(r => !r.matches(REVIEW_UI));
  }
  function rootKey(r) {
    try { const k = HOST().key?.(r); if (k) return String(k); } catch {}
    if (r.dataset.rvRoot) return r.dataset.rvRoot;
    if (r.id) return '#' + r.id;
    for (const a of ['layer', 'pop', 'view', 'panel', 'screen']) if (r.dataset[a]) return a + ':' + r.dataset[a];
    const tag = r.tagName.toLowerCase(), cls = [...r.classList].filter(c => !c.startsWith('rv-')).slice(0, 2).join('.');
    return tag + (cls ? '.' + cls : '');
  }
  function rootOf(el) { for (const r of roots()) if (r === el || r.contains(el)) return {el:r, key:rootKey(r)}; return null; }
  function pathOf(el) {
    const root = rootOf(el); if (!root) return null; const idx = [];
    for (let n = el; n && n !== root.el; n = n.parentElement) idx.unshift([...n.parentElement.children].indexOf(n));
    return root.key + '/' + idx.join('.');
  }
  function resolve(path) {
    if (!path) return null;
    const i = path.indexOf('/'); const key = path.slice(0, i), rest = path.slice(i + 1);
    const root = roots().find(r => rootKey(r) === key); if (!root) return null;
    let n = root;
    for (const j of (rest ? rest.split('.') : [])) { n = n.children[Number(j)]; if (!n) return null; }
    return n;
  }
  const textNodes = el => [...el.childNodes].filter(n => n.nodeType === 3 && n.data.trim());
  function label(el) {
    const tag = el.tagName.toLowerCase();
    const txt = (el.getAttribute('aria-label') || el.getAttribute('alt') || el.getAttribute('title') || el.textContent || '').replace(/\s+/g, ' ').trim();
    const cls = [...el.classList].filter(c => !c.startsWith('rv-')).slice(0, 2).join('.');
    return `${tag}${cls ? '.' + cls : ''}${txt ? ` "${txt.slice(0, 48)}${txt.length > 48 ? '…' : ''}"` : ''}`;
  }

  /* ── Keep edits and pins in place when the prototype re-renders ───── */
  let applying = false;
  const applied = new Map();                   // key → {tn, orig, text}: what we changed, so we can undo it
  function applyEdits() {
    applying = true;
    for (const [k, a] of applied) {            // undo edits that were removed or changed elsewhere
      const e = FB.edits[k];
      if (e && e.text === a.text) continue;
      if (a.tn.isConnected && a.tn.data.trim() === a.text) a.tn.data = a.tn.data.replace(a.text, a.orig);
      applied.delete(k);
    }
    for (const [k, e] of Object.entries(FB.edits)) {
      if (!e || typeof e.orig !== 'string' || typeof e.text !== 'string') continue;
      const [p, ti] = k.split('#'); const el = resolve(p); if (!el) continue;
      const tn = textNodes(el)[Number(ti)];
      if (tn && tn.data.trim() === e.orig.trim()) { const lead = tn.data.match(/^\s*/)[0], trail = tn.data.match(/\s*$/)[0]; tn.data = lead + e.text + trail; applied.set(k, {tn, orig:e.orig, text:e.text}); }
      else if (tn && tn.data.trim() === e.text && !applied.has(k)) applied.set(k, {tn, orig:e.orig, text:e.text});   // already showing the edit (e.g. just typed)
    }
    applying = false;
  }
  const refresh = () => { applyEdits(); placePins(); };
  let refreshT = null;
  new MutationObserver(muts => {
    if (applying || refreshT) return;
    if (!muts.some(m => !m.target.closest?.(REVIEW_UI) && !m.target.parentElement?.closest?.(REVIEW_UI))) return;
    refreshT = setTimeout(() => { refreshT = null; refresh(); }, 0);
  }).observe(document.body, {childList:true, subtree:true, characterData:true});
  window.reviewRefresh = refresh;

  /* ── Text editing ─────────────────────────────────────────────────── */
  function textNodeAt(x, y) {
    let node = null;
    if (document.caretRangeFromPoint) node = document.caretRangeFromPoint(x, y)?.startContainer;
    else if (document.caretPositionFromPoint) node = document.caretPositionFromPoint(x, y)?.offsetNode;
    if (!node || node.nodeType !== 3 || !node.data.trim()) return null;
    const r = document.createRange(); r.selectNodeContents(node);
    const hit = [...r.getClientRects()].some(b => x >= b.left - 2 && x <= b.right + 2 && y >= b.top - 2 && y <= b.bottom + 2);
    return hit && !node.parentElement.closest(REVIEW_UI + ',input,textarea,select,[contenteditable=true]') ? node : null;
  }
  function startEdit(tn) {
    const parent = tn.parentElement; const ti = textNodes(parent).indexOf(tn);
    const p = pathOf(parent); if (!p) return; const key = p + '#' + ti;
    const orig = FB.edits[key]?.orig ?? tn.data.trim();
    const lead = tn.data.match(/^\s*/)[0], trail = tn.data.match(/\s*$/)[0];
    const span = document.createElement('span');
    span.className = 'rv-editing'; span.contentEditable = 'plaintext-only'; span.textContent = tn.data.trim();
    applying = true; tn.replaceWith(document.createTextNode(lead), span, document.createTextNode(trail)); applying = false;
    span.focus(); const sel = getSelection(); const r = document.createRange(); r.selectNodeContents(span); sel.removeAllRanges(); sel.addRange(r);
    let done = false;
    const finish = commit => {
      if (done) return; done = true;
      const val = commit ? span.textContent.replace(/\s+/g, ' ').trim() : (FB.edits[key]?.text ?? orig);
      const out = document.createTextNode(lead + (val || orig) + trail);
      applying = true; span.previousSibling?.remove(); span.nextSibling?.remove(); span.replaceWith(out); applying = false;
      if (commit) {
        applied.delete(key);
        if (!val || val === orig) { delete FB.edits[key]; save({t:'edit', k:key, v:null}); }
        else { const v = {orig, text:val, screen:screen()?.name, author:who(true) || undefined}; FB.edits[key] = v; applied.set(key, {tn:out, orig, text:val}); save({t:'edit', k:key, v}); }
      }
    };
    span.addEventListener('blur', () => finish(true));
    span.addEventListener('keydown', e => {
      e.stopPropagation();
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); finish(true); }
      if (e.key === 'Escape') { e.preventDefault(); finish(false); }
    });
    ['click','mousedown','keyup','input'].forEach(t => span.addEventListener(t, e => e.stopPropagation()));
  }

  /* ── Hover highlight ──────────────────────────────────────────────── */
  function pickTarget(el) {
    if (!el || el.closest(REVIEW_UI)) return null;
    if (el.closest('svg')) el = el.closest('svg').parentElement || el;
    if (el === document.body || el === document.documentElement || !rootOf(el)) return null;
    return el;
  }
  function showHover(el, cls, text) {
    const h = $('#rvHover'); if (!el) { h.classList.add('rv-hidden'); return; }
    const b = el.getBoundingClientRect(); h.className = 'rv-hover ' + cls;
    Object.assign(h.style, {left:b.left - 2 + 'px', top:b.top - 2 + 'px', width:b.width + 4 + 'px', height:b.height + 4 + 'px'});
    h.querySelector('.lb').textContent = text;
  }
  document.addEventListener('mousemove', e => {
    if (mode === 'interact') return;
    if (mode === 'spot') return showHover(null);
    if (mode === 'edit') {
      const tn = textNodeAt(e.clientX, e.clientY);
      if (!tn) return showHover(null);
      const r = document.createRange(); r.selectNodeContents(tn); const b = r.getBoundingClientRect();
      const h = $('#rvHover'); h.className = 'rv-hover';
      Object.assign(h.style, {left:b.left - 3 + 'px', top:b.top - 2 + 'px', width:b.width + 6 + 'px', height:b.height + 4 + 'px'});
      h.querySelector('.lb').textContent = 'Click to edit text';
    } else {
      const el = pickTarget(e.target); showHover(el, 'c', el ? label(el) : '');
    }
  }, true);

  /* ── Spotlight: drag a rectangle; everything outside it is dimmed ─── */
  let spot = null, spotDrag = null;
  function drawSpot() {
    const el = $('#rvSpot'); const r = spotDrag || spot;
    if (!r) { el.classList.add('rv-hidden'); return; }
    const x = Math.min(r.x0, r.x1), y = Math.min(r.y0, r.y1);
    Object.assign(el.style, {left:x + 'px', top:y + 'px', width:Math.abs(r.x1 - r.x0) + 'px', height:Math.abs(r.y1 - r.y0) + 'px'});
    el.classList.remove('rv-hidden'); el.classList.toggle('drawing', !!spotDrag);
  }
  const clearSpot = () => { spot = spotDrag = null; drawSpot(); renderBar(); };
  window.addEventListener('pointerdown', e => {
    if (mode !== 'spot' || e.button !== 0 || e.target.closest?.(REVIEW_UI)) return;
    e.stopPropagation(); e.preventDefault();
    spotDrag = {x0:e.clientX, y0:e.clientY, x1:e.clientX, y1:e.clientY}; drawSpot();
  }, true);
  window.addEventListener('pointermove', e => { if (!spotDrag) return; spotDrag.x1 = e.clientX; spotDrag.y1 = e.clientY; drawSpot(); }, true);
  window.addEventListener('pointerup', () => {
    if (!spotDrag) return;
    const r = spotDrag; spotDrag = null;
    spot = Math.abs(r.x1 - r.x0) > 6 && Math.abs(r.y1 - r.y0) > 6 ? r : null;   // a plain click clears it
    drawSpot(); renderBar();
  }, true);

  /* ── Swallow clicks in edit/comment/spot mode so the prototype doesn't react ── */
  const swallow = e => {
    if (mode === 'interact' || e.target.closest?.(REVIEW_UI) || e.target.closest?.('.rv-editing')) return;
    if (mode === 'edit' && e.target.closest?.('input,textarea,select,[contenteditable=true]')) return;
    e.stopPropagation(); e.preventDefault();
  };
  ['mousedown','mouseup','pointerdown','dblclick'].forEach(t => window.addEventListener(t, swallow, true));
  window.addEventListener('click', e => {
    if (mode === 'interact' || e.target.closest?.(REVIEW_UI) || e.target.closest?.('.rv-editing')) return;
    if (mode === 'edit' && e.target.closest?.('input,textarea,select,[contenteditable=true]')) return;
    e.stopPropagation(); e.preventDefault();
    if (mode === 'spot') return;
    if (mode === 'edit') { const tn = textNodeAt(e.clientX, e.clientY); if (tn) { showHover(null); startEdit(tn); } return; }
    const el = pickTarget(e.target); if (!el) return;
    const b = el.getBoundingClientRect(), sc = screen();
    draft = {path:pathOf(el), el:label(el), html:el.outerHTML.replace(/\s+/g, ' ').slice(0, 600),
      screenId:sc?.id ?? null, screen:sc?.name || document.title || location.pathname, url:location.pathname + location.hash,
      rect:{x:Math.round(b.left), y:Math.round(b.top), w:Math.round(b.width), h:Math.round(b.height)}};
    sideOpen = true; selId = null; renderSide(); placePins(); renderBar();
    $('#rvDraft')?.focus();
  }, true);

  /* ── Pins ─────────────────────────────────────────────────────────── */
  function placePins() {
    const host = $('#rvPins'); if (!host) return;
    let html = '';
    const outline = b => `<div class="rv-outline" style="left:${b.left - 3}px;top:${b.top - 3}px;width:${b.width + 6}px;height:${b.height + 6}px"></div>`;
    FB.comments.filter(c => filter === 'all' || (filter === 'open' ? !c.resolved : c.resolved)).forEach(c => {
      const el = resolve(c.path); if (!el) return;
      const b = el.getBoundingClientRect(); if (!b.width && !b.height) return;
      html += `<div class="rv-pin ${c.resolved ? 'done' : ''} ${c.id === selId ? 'sel' : ''}" data-pin="${esc(c.id)}" style="left:${b.right}px;top:${b.top}px">${esc(c.n)}</div>`;
      if (c.id === selId) html += outline(b);
    });
    if (draft) { const el = resolve(draft.path); if (el) html += outline(el.getBoundingClientRect()); }
    applying = true; host.innerHTML = html; applying = false;
  }
  let pinT = null; const schedulePins = () => { if (!pinT) pinT = setTimeout(() => { pinT = null; placePins(); }, 16); };
  document.addEventListener('scroll', schedulePins, true); window.addEventListener('resize', schedulePins);
  document.addEventListener('click', e => { const p = e.target.closest('[data-pin]'); if (p) { selId = p.dataset.pin; sideOpen = true; draft = null; renderSide(); placePins(); [...document.querySelectorAll('[data-cid]')].find(n => n.dataset.cid === selId)?.scrollIntoView({block:'nearest'}); } });

  /* ── Bar ──────────────────────────────────────────────────────────── */
  // Entering comment mode leaves the drawer alone — it is opened by "Show
  // comments", by picking an element to comment on, or by clicking a pin.
  function setMode(m) {
    mode = m; document.body.classList.toggle('rv-edit', m === 'edit'); document.body.classList.toggle('rv-comment', m === 'comment'); document.body.classList.toggle('rv-spotmode', m === 'spot');
    showHover(null); renderBar(); renderSide();
  }
  // The status at the right end only appears when it has something to say:
  // "Shared" is the steady state, so it is left out; Local only, Saving… and
  // Save failed — retrying still show.
  function renderBar() {
    const open = FB.comments.filter(c => !c.resolved).length, edits = Object.keys(FB.edits).length;
    $('#rvBar').innerHTML = `
      <button class="${mode === 'interact' ? 'on' : ''}" data-rv-mode="interact">View <span class="k">V</span></button>
      <button class="${mode === 'edit' ? 'on' : ''}" data-rv-mode="edit">Edit text <span class="k">E</span></button>
      <button class="${mode === 'comment' ? 'on' : ''}" data-rv-mode="comment">Comment <span class="k">C</span>${open ? `<span class="n">${open}</span>` : ''}</button>
      <button class="${mode === 'spot' ? 'on' : ''}" data-rv-mode="spot">Spotlight <span class="k">S</span></button>
      ${spot ? `<button data-rv="clear-spot" title="Remove the spotlight">✕ Clear spotlight</button>` : ''}
      <button data-rv="side">${sideOpen ? 'Hide' : 'Show'} comments</button>
      ${edits ? `<button data-rv="reset" title="Undo all text edits">↺ ${edits} edit${edits > 1 ? 's' : ''}</button>` : ''}
      ${saveState && saveState !== 'Shared' ? `<span class="st">${saveState}</span>` : ''}`;
  }
  document.addEventListener('click', e => {
    const m = e.target.closest('[data-rv-mode]'); if (m) return setMode(m.dataset.rvMode);
    const a = e.target.closest('[data-rv]'); if (!a) return;
    const act = a.dataset.rv, c = a.dataset.id && FB.comments.find(c => c.id === a.dataset.id);
    if (act === 'side') { sideOpen = !sideOpen; if (!sideOpen) draft = null; renderBar(); renderSide(); placePins(); }
    if (act === 'reset' && confirm('Undo all inline text edits, for everyone?')) { FB.edits = {}; save({t:'edits:clear'}); refresh(); renderBar(); }
    if (act === 'close') { sideOpen = false; draft = null; selId = null; if (mode === 'comment') setMode('interact'); renderBar(); renderSide(); placePins(); }
    if (act === 'cancel') { draft = null; renderSide(); placePins(); }
    if (act === 'post') postDraft();
    if (act === 'clear-spot') clearSpot();
    if (act === 'filter') { filter = a.dataset.v; renderSide(); placePins(); }
    if (act === 'del' && c) { e.stopPropagation(); FB.comments = FB.comments.filter(x => x !== c); save({t:'del', id:c.id}); renderSide(); placePins(); renderBar(); }
    if (act === 'resolve' && c) { e.stopPropagation(); c.resolved = !c.resolved; if (!c.resolved) delete c.resolution; save({t:'comment', c}); renderSide(); placePins(); renderBar(); }
    if (act === 'who') { try { localStorage.removeItem('rv:author'); } catch {} who(true); renderSide(); }
    if (act === 'goto' && c) { e.stopPropagation(); try { HOST().goto?.(c.screenId); } catch {} selId = c.id; renderSide(); placePins(); }
    if (act === 'copy') {
      const open = FB.comments.filter(c => !c.resolved);
      const file = location.pathname.replace(/^\//, '').replace(/\/$/, '/index.html') || 'index.html';
      const txt = `Apply these prototype comments in ${file}:\n\n` + open.map(c => `#${c.n} [${c.screen}]${c.author ? ' ' + c.author + ':' : ''} ${c.el}\n   → ${c.text}`).join('\n\n');
      navigator.clipboard?.writeText(txt).then(() => { a.textContent = 'Copied ✓'; setTimeout(() => renderSide(), 1200); });
    }
  });
  document.addEventListener('click', e => { const c = e.target.closest('[data-cid]'); if (c && !e.target.closest('button')) { selId = c.dataset.cid; renderSide(); placePins(); resolve(FB.comments.find(x => x.id === selId)?.path)?.scrollIntoView?.({block:'center', behavior:'smooth'}); } });

  function postDraft() {
    const t = $('#rvDraft')?.value.trim(); if (!t || !draft) return;
    const author = who(true);
    const n = FB.comments.reduce((m, c) => Math.max(m, c.n || 0), 0) + 1;
    const c = {id:'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), n, ...draft, text:t, author:author || undefined, created:new Date().toISOString(), resolved:false};
    FB.comments.push(c); draft = null; selId = c.id; save({t:'comment', c}); renderSide(); placePins(); renderBar();
  }

  /* ── Side panel ───────────────────────────────────────────────────── */
  function renderSide() {
    document.body.classList.toggle('rv-side-open', sideOpen);
    if (!sideOpen) { $('#rvSide').innerHTML = ''; sideShown = false; return; }
    // Every render rebuilds the panel, so switching tabs would otherwise replay
    // the slide-in and throw the list back to the top. Animate only the first
    // render after opening, and put the scroll position back afterwards.
    const entering = !sideShown;
    const keepScroll = entering ? 0 : ($('#rvSide .body')?.scrollTop || 0);
    const list = FB.comments.filter(c => filter === 'all' || (filter === 'open' ? !c.resolved : c.resolved)).slice().reverse();
    const counts = {open:FB.comments.filter(c => !c.resolved).length, resolved:FB.comments.filter(c => c.resolved).length, all:FB.comments.length};
    const when = c => new Date(c.created).toLocaleString([], {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'});
    $('#rvSide').innerHTML = `<div class="rv-side${entering ? ' rv-side-enter' : ''}">
      <div class="h"><b>Comments</b><button class="x" data-rv="close" title="Close">×</button></div>
      <div class="tabs2">${['open','resolved','all'].map(f => `<button class="${filter === f ? 'on' : ''}" data-rv="filter" data-v="${f}">${f[0].toUpperCase() + f.slice(1)} ${counts[f]}</button>`).join('')}</div>
      <div class="body">
        ${draft ? `<div class="rv-compose"><div style="font-weight:600;margin-bottom:6px">New comment · ${esc(draft.screen)}</div>
          <div class="rv-target">${esc(draft.el)}</div>
          <textarea id="rvDraft" placeholder="What should change here?"></textarea>
          <div class="f"><span class="hint">⌘↵ to post</span><button class="btn" data-rv="cancel">Cancel</button><button class="btn primary" data-rv="post">Comment</button></div></div>`
        : mode === 'comment' ? `<div class="rv-empty" style="padding:12px 8px 20px">Click any element in the prototype to leave a comment on it.</div>` : ''}
        ${list.length ? list.map(c => `<div class="rv-c ${c.resolved ? 'done' : ''} ${c.id === selId ? 'sel' : ''}" data-cid="${esc(c.id)}">
            <div class="t"><span class="num">${esc(c.n)}</span><span class="el" title="${esc(c.el)}">${esc(c.el)}</span></div>
            <div class="msg">${esc(c.text)}</div>
            ${c.resolution ? `<div class="res">✓ ${esc(c.resolution)}</div>` : ''}
            <div class="meta2"><span>${c.author ? `<b>${esc(c.author)}</b> · ` : ''}${esc(c.screen || '')} · ${when(c)}</span><span style="flex:1"></span>
              ${c.screenId != null && HOST().goto ? `<button data-rv="goto" data-id="${esc(c.id)}">Go to</button>` : ''}<button data-rv="resolve" data-id="${esc(c.id)}">${c.resolved ? 'Reopen' : 'Resolve'}</button><button class="del" data-rv="del" data-id="${esc(c.id)}">Delete</button></div>
          </div>`).join('') : (!draft ? `<div class="rv-empty">No ${filter === 'all' ? '' : filter + ' '}comments yet.</div>` : '')}
      </div>
      <div class="foot">${online ? `Shared with everyone who opens this prototype. Commenting as <b>${esc(who() || 'anonymous')}</b> · <button data-rv="who">change</button>` : `Not connected to a shared store — kept in this browser only.`}
        <div><button class="btn" data-rv="copy">Copy comments as prompt</button></div></div>
    </div>`;
    sideShown = true;
    if (keepScroll) { const b = $('#rvSide .body'); if (b) b.scrollTop = keepScroll; }
    const ta = $('#rvDraft');
    ta?.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) postDraft(); if (e.key === 'Escape') { draft = null; renderSide(); placePins(); } });
  }

  /* ── Shortcuts ────────────────────────────────────────────────────── */
  document.addEventListener('keydown', e => {
    if (e.target.closest('input,textarea,[contenteditable],select') || e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k === 'e') setMode(mode === 'edit' ? 'interact' : 'edit');
    if (k === 'c') setMode(mode === 'comment' ? 'interact' : 'comment');
    if (k === 'v' || k === 'i') setMode('interact');   // I kept working for muscle memory
    if (k === 's') setMode(mode === 'spot' ? 'interact' : 'spot');
    if (e.key === 'Escape' && spot) { e.stopImmediatePropagation(); clearSpot(); return; }   // spotlight first, then the mode
    if (e.key === 'Escape' && mode !== 'interact') { e.stopImmediatePropagation(); draft = null; setMode('interact'); placePins(); }
  }, true);

  renderBar(); load();
})();
</script>
<script>
/* versions.js — the Versions + Changes plugins. Pairs with versions.css.
 *
 * For a feature that is prototyped in several versions (variants) side by
 * side, e.g.
 *
 *   features/<feature>/versions.json
 *   features/<feature>/v1-<name>/index.html
 *   features/<feature>/v2-<name>/index.html …
 *
 * Each version declares the family in its <head>:
 *
 *   <meta name="icarus-versions" content="../versions.json" />
 *
 * Without that tag this file does nothing, and the plugin launcher greys both
 * plugins out — they only exist on features that have versions.
 *
 *   Versions  ?versions=1  a panel, shaped like the States switcher: every
 *                          version in the family, the current one marked;
 *                          click one or use Alt+← / Alt+→ to move.
 *                          Switching keeps the query and hash, so the same
 *                          state (?states=1&state=…) opens in the other version.
 *   Changes   ?changes=1   outlines what is new / moved / changed in this
 *                          version compared with the one it is basedOn. The
 *                          markup carries the markers:
 *                            data-change="new|moved|changed"
 *                            data-change-note="Short reason"
 *
 * versions.json:
 *   { "family": "…", "versions": [
 *       { "folder": "v1-drawer", "label": "v1 · Drawer", "date": "2026-10-01",
 *         "note": "One line on what it is", "basedOn": null },
 *       { "folder": "v2-full-screen", …, "basedOn": "v1-drawer" } ] }
 *
 * Like the other plugins, toggling reloads (the launcher sets the parameter);
 * the page always boots into a known state. See versions.html.
 */
(() => {
  if (window.__icarusVersions) return;
  window.__icarusVersions = true;

  const meta = document.querySelector('meta[name="icarus-versions"]');
  if (!meta) return;

  const params = new URLSearchParams(location.search);
  const barOn = params.get('versions') === '1';
  const changesOn = params.get('changes') === '1';
  const manifestUrl = new URL(meta.getAttribute('content') || '../versions.json', location.href);
  const here = location.pathname.replace(/index\.html$/, '').split('/').filter(Boolean).pop();
  const esc = v => String(v ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // Outline the markers straight away; the legend fills in once the manifest is read.
  if (changesOn) document.documentElement.classList.add('vr-changes');
  if (!barOn && !changesOn) return;

  const href = v => new URL(`${v.folder}/`, manifestUrl).pathname + location.search + location.hash;
  const setParam = (key, on) => {
    const p = new URLSearchParams(location.search);
    p.set(key, on ? '1' : '0');
    location.search = p.toString();
  };

  fetch(manifestUrl, { cache: 'no-store' }).then(r => r.json()).then(({ family, versions = [] }) => {
    const i = versions.findIndex(v => v.folder === here);
    const cur = versions[i];
    const base = cur?.basedOn ? versions.find(v => v.folder === cur.basedOn) : null;
    // Count distinct changes — the same marker can appear in create and view mode.
    const marks = new Set([...document.querySelectorAll('[data-change]')].map(el => `${el.dataset.change}:${el.dataset.changeNote || ''}`)).size;

    // One panel, shaped like the States switcher: dark title bar, white body,
    // a group per concern. The version list is the body's first group; the
    // changes toggle and legend follow it.
    let body = '';
    if (barOn) {
      body += `<div class="vr-group"><span>Versions</span>
        ${versions.map(v => `<a class="vr-item${v.folder === here ? ' is-current' : ''}" href="${esc(href(v))}"${v.folder === here ? ' aria-current="page"' : ''}>${esc(v.label)}${v.note ? `<small>${esc(v.note)}</small>` : ''}</a>`).join('')}
      </div>`;
      if (marks) body += `<div class="vr-group"><span>Changes</span>
        <button type="button" class="vr-changes-toggle${changesOn ? ' is-on' : ''}" data-vr-changes>${changesOn ? 'Hide' : 'Show'} changes</button>
      </div>`;
    }
    if (changesOn) {
      body += marks
        ? `<div class="vr-legend"><strong>${marks} change${marks === 1 ? '' : 's'}</strong>${base ? `vs ${esc(base.label)}` : ''}
        <span><i class="vr-new"></i>New</span><span><i class="vr-moved"></i>Moved</span><span><i class="vr-changed"></i>Changed</span></div>`
        : `<div class="vr-legend">No changes marked in this version${base ? ` (vs ${esc(base.label)})` : ''}</div>`;
    }
    document.body.insertAdjacentHTML('beforeend', `<div class="vr-dock" role="navigation" aria-label="${esc(family || 'Versions')}">
      <div class="vr-head"><span>${esc(family || 'Versions')}</span><button type="button" class="vr-collapse" aria-label="Collapse">\u2013</button></div>
      <div class="vr-body">${body}</div>
    </div>`);

    // Collapse to the title bar, remembered for the session like the switcher
    const dock = document.querySelector('.vr-dock');
    const CKEY = 'vr:collapsed';
    try { if (sessionStorage.getItem(CKEY) === '1') dock.classList.add('is-collapsed'); } catch {}
    const cbtn = dock.querySelector('.vr-collapse');
    const paintCollapse = () => {
      const on = dock.classList.contains('is-collapsed');
      cbtn.textContent = on ? '+' : '\u2013';
      cbtn.setAttribute('aria-label', on ? 'Expand' : 'Collapse');
    };
    paintCollapse();
    cbtn.addEventListener('click', () => {
      dock.classList.toggle('is-collapsed');
      try { sessionStorage.setItem(CKEY, dock.classList.contains('is-collapsed') ? '1' : '0'); } catch {}
      paintCollapse();
    });


    const step = d => { const v = versions[i + d]; if (v) location.href = href(v); };
    document.addEventListener('click', e => {
      if (e.target.closest('[data-vr-changes]')) setParam('changes', !changesOn);
    });
    if (barOn) document.addEventListener('keydown', e => {
      if (!e.altKey || (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight')) return;
      e.preventDefault();
      step(e.key === 'ArrowRight' ? 1 : -1);
    });
  }).catch(() => {});
})();
</script>
<script>
/* plugins.js — the plugin launcher. Pairs with plugins.css.
 *
 * One floating button that turns the author plugins on and off:
 *
 *   Review bar      ?review=1   comment, retype copy, spotlight          (review.js)
 *   States switcher ?states=1   jump between a prototype's designed states
 *   Component map   ?map=1      cross-reference components to Picasso
 *   Versions        ?versions=1 flip between a feature's versions      (versions.js)
 *   Changes         ?changes=1  outline what changed vs the version before (versions.js)
 *
 * Each plugin still owns its own behaviour and its own URL parameter; this only
 * gathers the switches into one place, so a prototype shows one unobtrusive
 * button instead of a button bottom-right, a panel bottom-left and nothing at
 * all for the third.
 *
 * Toggling always reloads. Every one of these plugins decides what to do at
 * boot — stamp the page, replay a state, render a bar — so flipping them live
 * would mean three teardown paths that only ever run in author tooling. A
 * reload is one path, and the page always starts in a known state.
 *
 * A plugin appears in the panel only if it is actually on the page; the rest
 * are listed greyed out, so the launcher tells the truth about what this page
 * carries rather than offering a switch that does nothing.
 */
(() => {
  if (window.__icarusLauncher) return;            // never mount twice
  window.__icarusLauncher = true;
  document.documentElement.classList.add('pg-has-launcher');   // review.js hides its own button

  const P = () => new URLSearchParams(location.search);
  const isOn = key => P().get(key) === '1';

  /* ── What this page actually carries ──────────────────────────────
     Detection is deliberately structural rather than a flag each plugin
     has to set, so a prototype that was built before the launcher existed
     still lights up correctly. */
  const DETECT = {
    // review.js announces itself; fall back to the bar/toggle it leaves behind
    review: () => !!(window.__icarusReview || document.querySelector('.rv-toggle, #rvBar')),
    // switchers are hand-copied with a per-prototype prefix (in-, ws-, pr-, …),
    // so the stable hook is the id suffix rather than a class. The [data-state]
    // check keeps an unrelated "…-switcher" (a theme toggle, say) from
    // masquerading as one.
    states: () => !!document.querySelector('[id$="-switcher"] [data-state]'),
    // the kit's goggles button, or a page that ships the registry
    map:    () => !!document.querySelector('.map-toggle') || !!window.__icarusComponentMap,
    // Versions / Changes exist only on features prototyped in versions — a
    // version declares its family with <meta name="icarus-versions">.
    versions: () => !!document.querySelector('meta[name="icarus-versions"]'),
    changes:  () => !!document.querySelector('meta[name="icarus-versions"]') && !!document.querySelector('[data-change]'),
  };

  const PLUGINS = [
    { key: 'review', name: 'Review bar',      on: 'Comment, retype copy, spotlight a region.',
      off: 'Not on this page — inline.py adds it.' },
    { key: 'states', name: 'States switcher', on: "Jump between this prototype's designed states.",
      off: 'This prototype has no states defined.' },
    { key: 'map',    name: 'Component map',   on: 'Cross-reference components to React / Storybook.',
      off: 'Only on the component kit for now.' },
    { key: 'versions', name: 'Versions',      on: "Flip between this feature's versions (Alt+← / Alt+→).",
      off: 'Only on features prototyped in versions.' },
    { key: 'changes',  name: 'Changes',       on: 'Outline what is new, moved or changed vs the previous version.',
      off: 'Only on a version that marks its changes.' },
  ];

  const ICON = '<svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 3h-3A1.5 1.5 0 0 0 3 4.5v3A1.5 1.5 0 0 0 4.5 9h3A1.5 1.5 0 0 0 9 7.5v-3A1.5 1.5 0 0 0 7.5 3Z"/><path d="M15.5 3h-3A1.5 1.5 0 0 0 11 4.5v3A1.5 1.5 0 0 0 12.5 9h3A1.5 1.5 0 0 0 17 7.5v-3A1.5 1.5 0 0 0 15.5 3Z"/><path d="M7.5 11h-3A1.5 1.5 0 0 0 3 12.5v3A1.5 1.5 0 0 0 4.5 17h3A1.5 1.5 0 0 0 9 15.5v-3A1.5 1.5 0 0 0 7.5 11Z"/><path d="M14 11.5v5M11.5 14h5"/></svg>';

  let open = false;

  /* Flipping a plugin: the parameter is set explicitly either way rather than
     deleted, because the plugins disagree about what a missing parameter means
     — the review bar remembers its last state in localStorage, so it needs a
     literal review=0 to be told to stop. */
  function toggle(key) {
    const p = P();
    p.set(key, isOn(key) ? '0' : '1');
    location.search = p.toString();
  }

  function render() {
    document.getElementById('pgPanel')?.remove();
    document.body.classList.toggle('pg-open', open);

    const live = PLUGINS.filter(x => DETECT[x.key]() && isOn(x.key)).length;
    const fab = document.getElementById('pgFab');
    fab.classList.toggle('on', live > 0);
    fab.setAttribute('aria-expanded', String(open));
    fab.innerHTML = ICON + (live ? `<span class="pg-count">${live}</span>` : '');

    if (!open) return;

    const rows = PLUGINS.map(x => {
      const here = DETECT[x.key]();
      const on = here && isOn(x.key);
      return `<button class="pg-item${on ? ' is-on' : ''}" type="button" data-pg="${x.key}"${here ? '' : ' disabled'}>
          <span><span class="pg-name">${x.name}</span><span class="pg-why">${here ? x.on : x.off}</span></span>
          <span class="pg-switch"></span>
        </button>`;
    }).join('');

    document.body.insertAdjacentHTML('beforeend', `
      <div class="pg-panel" id="pgPanel" role="dialog" aria-label="Plugins">
        <div class="pg-head">Plugins<button type="button" data-pg-close aria-label="Close">×</button></div>
        <div class="pg-list">${rows}</div>
        <div class="pg-foot">Switching one reloads the page, so it starts clean.</div>
      </div>`);
    document.querySelector('.pg-item:not(:disabled)')?.focus();
  }

  function mount() {
    document.body.insertAdjacentHTML('beforeend',
      `<button type="button" id="pgFab" class="pg-fab" aria-label="Plugins" aria-expanded="false" aria-controls="pgPanel" title="Plugins — review bar, states, component map, versions">${ICON}</button>`);
    render();
  }

  document.addEventListener('click', e => {
    if (e.target.closest('#pgFab'))        { open = !open; return render(); }
    if (e.target.closest('[data-pg-close]')) { open = false; return render(); }
    const row = e.target.closest('[data-pg]');
    if (row && !row.disabled) return toggle(row.dataset.pg);
    if (open && !e.target.closest('#pgPanel')) { open = false; render(); }
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && open) { open = false; render(); document.getElementById('pgFab')?.focus(); }
  });

  if (document.body) mount();
  else document.addEventListener('DOMContentLoaded', mount);
})();
</script>
<!-- === /review.js === -->
</body>
</html>
