   * no Picasso equivalent. Nothing referenced it once --color-info moved to

  /* --color-purple-600: #5019A8;  unreferenced extension */

  /* --color-purple-800: #280D5C;  unreferenced extension */
  /* --color-purple-900: #1A0840;  unreferenced extension */
  /* ---- Typography — Picasso's names and values, verbatim ----
   * Picasso's stack is `proxima-nova, Arial, sans-serif`, where proxima-nova is
   * the Adobe Fonts kit id. designmd self-hosts the licensed .woff2 under the
   * family name 'Proxima Nova', so that comes first and Picasso's kit id follows
   * — same typeface either way, and the prototype renders without the kit.
   */
  --font-sans: 'Proxima Nova', proxima-nova, Arial, sans-serif;/* picasso + self-hosted */
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace; /* picasso */
  /* --font-display: var(--font-sans);  retired — a pure alias to --font-sans that
   * nothing ever referenced. */

  /* Size scale. Picasso pairs every size with a line-height; Tailwind v4 writes
   * that as --text-{size}--line-height, so the pair travels together. */
  --text-2xs: 0.688rem;             /* picasso - 11px */
  --text-2xs--line-height: 1rem;    /* picasso */
  --text-xxs: 0.75rem;              /* picasso - 12px */
  --text-xxs--line-height: 1.125rem; /* picasso */
  --text-sm: 0.8125rem;             /* picasso - 13px */
  --text-sm--line-height: 1.25rem;  /* picasso */
  --text-md: 0.875rem;              /* picasso - 14px, default body */
  --text-md--line-height: 1.375rem; /* picasso */
  --text-lg: 1rem;                  /* picasso - 16px */
  --text-lg--line-height: 1.5rem;   /* picasso */
  --text-xl: 1.25rem;               /* picasso - 20px */
  --text-xl--line-height: 1.875rem; /* picasso */
  --text-2xl: 1.75rem;              /* picasso - 28px */
  --text-2xl--line-height: 2.625rem; /* picasso */
  --text-xxl: 1.75rem;              /* picasso - 28px, same as 2xl */
  --text-xxl--line-height: 2.625rem; /* picasso */
  --text-button-small: 12px;        /* picasso */
  --text-button-small--line-height: 15px;  /* picasso */
  --text-button-medium: 13px;       /* picasso */
  --text-button-medium--line-height: 16px; /* picasso */
  --text-button-large: 15px;        /* picasso */
  --text-button-large--line-height: 18px;  /* picasso */
  /* --text-18: 1.125rem;  18px — retired. Unreferenced, and the two uses its own
   * comment claimed were both untrue: avatar initials run 2xs/xxs/sm/md/2xl plus a
   * literal 42px, and .card-title is --type-h3 at 16px. Picasso has no 18px. */

  /* Unitless line-heights. Picasso has none of these; base-tailwind adds only
   * lineHeight.5 = 1.25rem, which is already --text-sm--line-height. */
  /* --leading-tight:   1.2;  unreferenced extension */
  /* --leading-normal:  1.5;  unreferenced extension */
  /* --leading-relaxed: 1.75;  unreferenced extension */
  /* Weights. Picasso ships four, and the self-hosted Proxima only carries
   * Regular and Semibold — the @font-face ranges above fold 500 into 400 and
   * 700 into 600. designmd's old `medium` (500) and `bold` (700) therefore
   * already rendered as regular and semibold, and are gone. */
  --font-weight-inherit: inherit;   /* picasso - unused here, kept deliberately: unlike
                                     * thin and light it always renders, and Picasso's
                                     * Typography exposes it alongside regular and
                                     * semibold. Do not retire as dead. */
  /* --font-weight-thin: 100;   and  --font-weight-light: 300;  are REMOVED, and this
   * is the one place designmd deliberately does not mirror Picasso's preset. Both are
   * keys there, so the classes generate — but no Picasso component uses either
   * (Typography exposes regular, semibold and inherit only), and Proxima ships no face
   * at 100 or 300, so a browser synthesises them. A token that cannot render what it
   * promises is worse than a missing one. Uncomment if Proxima ever licenses the faces. */
  --font-weight-regular: 400;       /* picasso */
  --font-weight-semibold: 600;      /* picasso */

  /* Interaction states for the three action colours. Picasso's Button hardcodes
   * these as arbitrary hex rather than palette shades, so there is no Picasso
   * token to point at — but the VALUES are Picasso's, read from
   * Button/src/Button/styles.ts. Note the direction: hover goes LIGHTER,
   * active goes darker. designmd used to darken on hover, which is backwards
   * from what the product does. */
  --color-blue-500-hover: #4269D6;  /* extension - picasso Button primary hover */
  --color-blue-500-active: #1A41AB; /* extension - picasso Button primary active */
  --color-green-500-hover: #27D496; /* extension - picasso Button positive hover */
  --color-green-500-active: #00A96C;/* extension - picasso Button positive active */
  --color-red-500-hover: #DB466B;   /* extension - picasso Button negative hover */
  --color-red-500-active: #B01F43;  /* extension - picasso Button negative active */

  /* ---- Spacing — Picasso's scale, names and values verbatim ----
   * The number IS the value: n x 0.25rem, the Tailwind convention, so
   * --spacing-4 is what a developer writes as p-4. designmd's old scale was
   * index-based (sequential steps), which collided above step 4: the old
   * step 8 was 48px where Picasso's 8 is 32px. Every prototype that
   * handed a spacing number to a developer above step 4 was mistranslated.
   *
   * Picasso source: toptal/picasso packages/picasso-tailwind @ bcaacbb8ec3b
   */
  --spacing-0: 0;                   /* picasso */
  --spacing-1: 0.25rem;             /* picasso - 4px */
  --spacing-2: 0.5rem;              /* picasso - 8px */
  --spacing-3: 0.75rem;             /* picasso - 12px */
  --spacing-4: 1rem;                /* picasso - 16px */
  --spacing-6: 1.5rem;              /* picasso - 24px */
  --spacing-8: 2rem;                /* picasso - 32px */
  --spacing-10: 2.5rem;             /* picasso - 40px */
  --spacing-12: 3rem;               /* picasso - 48px */
  /* Extensions. Picasso's scale stops at 12 (48px); page-level layout needs
   * more. Numbered on Tailwind's own n x 0.25rem rule, so p-16 in code is
   * still 4rem — consistent with Picasso even though Picasso omits them. */
  /* --spacing-16: 4rem;  64px — retired. Its only use was .page-toc's offset, which
   * was really the topbar height plus a gap; that now says so with --header-height. */
  /* --spacing-20: 5rem;   80px  — unused, and in neither config. */
  /* --spacing-32: 8rem;  128px  — unused, and in neither config. */

  /* ---- Sizing — Picasso's minWidth / maxWidth / minHeight / maxHeight ----
   * All four start from the spacing scale (`...theme('spacing')`), so min-w-4 is
   * --spacing-4 and needs no token of its own. Only the values Picasso adds on
   * top are declared here.
   */
  --header-height: 3.5rem;          /* picasso - 56px. Picasso's own custom property:
                                     * PageTopBar is h-[var(--header-height,3.5rem)]
                                     * and constants.ts sets headerHeight 3.5rem. */

  --min-width-14: 3.5rem;           /* picasso - 56px, min-w-14 */
  --min-width-16: 4rem;             /* picasso - 64px, min-w-16 */
  --min-width-24: 6rem;             /* picasso - 96px, min-w-24 */

  /* Twelfths — Picasso's 12-column grid, maxWidth only. The class is written
   * max-w-1/12; a slash cannot appear in a custom property name, so the token
   * spells it out. */
  --max-width-1-12: 8.333333%;      /* picasso - max-w-1/12 */
  --max-width-2-12: 16.666667%;     /* picasso - max-w-2/12 */
  --max-width-3-12: 25%;            /* picasso - max-w-3/12 */
  --max-width-4-12: 33.333333%;     /* picasso - max-w-4/12 */
  --max-width-5-12: 41.666667%;     /* picasso - max-w-5/12 */
  --max-width-6-12: 50%;            /* picasso - max-w-6/12 */
  --max-width-7-12: 58.333333%;     /* picasso - max-w-7/12 */
  --max-width-8-12: 66.666667%;     /* picasso - max-w-8/12 */
  --max-width-9-12: 75%;            /* picasso - max-w-9/12 */
  --max-width-10-12: 83.333333%;    /* picasso - max-w-10/12 */
  --max-width-11-12: 91.666667%;    /* picasso - max-w-11/12 */

  /* ---- Radii ---- */
  --radius-none: 0;                 /* picasso */
  --radius-sm: 4px;                 /* picasso */
  --radius-md: 8px;                 /* picasso */
  /* No extensions. The scale is Picasso's four, exactly.
   * --radius-lg (12px), -xl (16px) and -2xl (24px) are gone: lg's ten uses —
   * .card and nine bits of showcase chrome — now take --radius-md, which is
   * what Picasso's Container applies, and xl/2xl were never referenced. */
  --radius-full: 9999px;            /* picasso */
  /* Numeric aliases — reach for these by px value */

  /* ---- Shadows — Picasso's values, verbatim ----
   * Picasso's shadows are ROLES, not a size ramp, and its own source names
   * them. designmd used to carry an xs..xl ramp of its own invention; each
   * call site is now mapped to the role Picasso documents, so a prototype
   * casts the same shadow the product does.
   * Picasso also defines 6-24 (Material UI v4 elevations) which its source
   * marks for deprecation — deliberately not carried here.
   */
  --shadow-0: none;                                                 /* picasso */
  --shadow-1: 0 0 8px 0 rgba(0,0,0, 0.08);                          /* picasso - notification center, paper */
  --shadow-2: 0 4px 8px 0 rgba(0,0,0, 0.08);                        /* picasso - modal */
  --shadow-3: 0 0 0 1px rgba(0, 0, 0, 0.04), 0 0 8px 0 rgba(0, 0, 0, 0.16);  /* picasso - notification growl */
  --shadow-4: 0 0 4px 0 rgba(0,0,0, 0.24), 0 0 32px 0 rgba(0,0,0, 0.12);     /* picasso - tooltip */
  --shadow-5: 0 0 0 1px rgba(0, 0, 0, 0.04), 0 8px 12px -3px rgba(0, 0, 0, 0.08), 0 4px 8px -2px rgba(0, 0, 0, 0.04); /* picasso - scroll menu */

  /* ---- Z-index — Picasso's four, verbatim; the rest are extensions ----
   * designmd's modal was 900 and its toast 1000. Picasso puts modal at 1300
   * and snackbar at 1400, so anything written against the old numbers sat in
   * the wrong layer once it reached production. */
  --z-drawer: 1200;                 /* picasso */
  --z-modal: 1300;                  /* picasso */
  --z-tooltip: 1300;                /* picasso */
  --z-snackbar: 1400;               /* picasso */
  /* --z-base: 0;  unreferenced extension */
  /* These three are designmd's own, and they stay that way for a reason rather
   * than for want of a Picasso number. Picasso's four come from Material UI v4
   * (drawer 1200, modal 1300, snackbar 1400 are MUI's exactly; tooltip is pulled
   * from 1500 down to 1300) and nothing in either scale sits below 1000.
   *
   * The gap is a rendering difference, not an oversight. Picasso's Dropdown and
   * Menu carry no z-index at all — they render through Popper, which portals to
   * the body and stacks at z-modal. designmd's dropdowns are positioned in flow,
   * so they only need to beat their siblings; 1300 would wrongly lift them over
   * drawers. Same for the sticky sidenav toggle and the sheet popover. */
  --z-dropdown: 100;                /* extension - .dropdown-menu, .datepicker-panel */
  --z-sticky: 200;                  /* extension - .sidenav-toggle, the showcase TOC */
  --z-overlay: 800;                 /* extension - .sheet-pop */

  /* ---- Breakpoints — Picasso's screens, verbatim ---- */
  --breakpoint-xs: 0px;             /* picasso */
  --breakpoint-sm: 480px;           /* picasso */
  --breakpoint-md: 768px;           /* picasso */
  --breakpoint-lg: 1024px;          /* picasso */
  --breakpoint-xl: 1440px;          /* picasso */

  /* ---- Borders ---- */
  --border-width: 1px;              /* picasso - Tailwind DEFAULT */
  --border-width-0: 0px;            /* picasso */

  /* ---- Component tokens — Picasso sizes its inputs with these ---- */
  --width-input: 18.75rem;          /* picasso - 300px */
  --height-input: 2rem;             /* picasso - 32px */
  --padding-input: 0.5rem;          /* picasso - 8px */

  /* ---- Motion ----
   * Picasso adds one duration (350ms) and no easings; the rest are extensions. */
  --duration-350: 350ms;            /* picasso */
  --duration-fast: 120ms;           /* extension */
  --duration-base: 200ms;           /* extension */
  /* --duration-slow: 320ms;  retired — only the Motion gallery used it. */
  --ease: cubic-bezier(0.2, 0, 0, 1);      /* extension */
  /* --ease-out: cubic-bezier(0, 0, 0.2, 1);   retired — gallery-only. */
  /* --ease-in: cubic-bezier(0.4, 0, 1, 1);    retired — gallery-only.
   * These two are the standard complement to --ease. If a prototype needs an
   * accelerate or decelerate curve, UNCOMMENT them — do not write a literal
   * cubic-bezier, which is how the drift this file just cleaned up started. */

  /* ---- Animation ----
   * Tailwind v4 names an animation --animate-{name}; the keyframes it points at
   * are defined below this block. Picasso contributes circle-spin; the other
   * four come from the Operationalize Tailwind config, which is the only place
   * the product extends Picasso. The duration and easing tokens above stay —
   * they are what hand-written transitions use.
   */
  --animate-circle-spin: stroke-dash 1.4s ease-in-out infinite;  /* picasso */
  --animate-highlight: highlight 3s ease-in-out;                 /* operationalize */
  --animate-fade-in: fadeIn ease-in 1s;                          /* operationalize */
  --animate-slider-progress: sliderProgress linear 10s forwards; /* operationalize */
  --animate-card-land: cardLand 250ms ease-out;                  /* operationalize */

  /* ---- Layout — extensions. Picasso has breakpoints, not container widths. */
  /* --container-sm: 640px;  unreferenced extension */
  /* --container-md: 768px;  unreferenced extension */
  --container-lg: 1024px;           /* extension - .page max-width. Picasso has breakpoints, not containers */
  /* --container-xl: 1280px;  unreferenced extension */
}

/* Keyframes behind the --animate-* tokens. Names and values are verbatim from
 * the Picasso and Operationalize Tailwind configs, so an animation a prototype
 * uses is the same one the product ships. */
@keyframes stroke-dash {
  0%   { stroke-dasharray: 1px, 200px;   stroke-dashoffset: 0px; }
  50%  { stroke-dasharray: 100px, 200px; stroke-dashoffset: -15px; }
  100% { stroke-dasharray: 100px, 200px; stroke-dashoffset: -125px; }
}
/* rgba(37,169,239,.5) is blue-400 at 50% — written out as the config has it */
@keyframes highlight { 50% { background-color: rgba(37, 169, 239, 50%); } }
@keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
@keyframes sliderProgress { from { width: 0px; } to { width: 100%; } }
@keyframes cardLand {
  0%   { transform: scale(1.04); filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.2)); }
  100% { transform: scale(1);    filter: drop-shadow(0 0 0 rgba(0, 0, 0, 0)); }
}

/* Motion is functional. Anything decorative respects a user who asked for less. */
@media (prefers-reduced-motion: reduce) {
  :root {
    --animate-circle-spin: none;
    --animate-highlight: none;
    --animate-fade-in: none;
    --animate-slider-progress: none;
    --animate-card-land: none;
  }
}

    /* === semantic.css === */
/* semantic.css — intent-named aliases over Icarus primitives.
 * Prototypes and components reference these, NOT raw palette tokens.
 * Swap a brand or theme by re-pointing aliases here — primitives never change.
 */

:root {
  /* ---- Surfaces ---- */
  --color-bg:             var(--color-gray-50);   /* page background */
  --color-surface:        var(--color-white);      /* cards, panels */
  --color-surface-muted:  var(--color-gray-100);   /* hover, subtle fills */
  --color-surface-sunken: var(--color-gray-200);   /* wells, inset areas */

  /* ---- Borders ---- */
  --color-border:         var(--color-gray-200);
  --color-border-strong:  var(--color-gray-300);
  --color-border-focus:   var(--color-blue-500);

  /* ---- Text ---- */
  --color-text:           var(--color-graphite-900);
  --color-text-muted:     var(--color-gray-700);   /* extension on purpose: Picasso's darkest text grey is gray-600 at 3.56:1 on white, below AA for body. gray-700 is 6.04:1. */
  --color-text-subtle:    var(--color-gray-500);
  --color-text-inverse:   var(--color-white);
  --color-text-link:      var(--color-blue-500);
  --color-icon:           var(--color-graphite-750);   /* designmd's own: Picasso icons carry no colour, they inherit currentColor (fill-current / text-inherit). Nearest Picasso name is graphite-700 (Typography 'dark-grey'). */

  /* ---- Brand / primary action ---- */
  --color-brand:          var(--color-green-500);
  --color-brand-hover:    var(--color-green-500-hover);   /* picasso lightens on hover */
  --color-brand-active:   var(--color-green-500-active);
  --color-brand-subtle:   var(--color-green-100);

  /* ---- Accent (interactive secondary, links) ---- */
  --color-accent:         var(--color-blue-500);
  --color-accent-hover:   var(--color-blue-500-hover);
  --color-accent-active:  var(--color-blue-500-active);
  --color-accent-subtle:  var(--color-blue-100);

  /* ---- Status ---- */
  --color-success:        var(--color-green-500);
  --color-success-subtle: var(--color-green-100);
  --color-warning:        var(--color-yellow-500);
  --color-warning-subtle: var(--color-yellow-100);
  --color-danger:         var(--color-red-500);
  --color-danger-hover:   var(--color-red-500-hover);
  --color-danger-active:  var(--color-red-500-active);
  --color-danger-subtle:  var(--color-red-100);
  --color-info:           var(--color-blue-400);
  /* --color-info-subtle is en route to blue. cyan-100 was retired in the
     palette cleanup; backed by blue-100 until --color-info itself moves
     to blue, at which point the cyan-500 reference above also goes. */
  --color-info-subtle:    var(--color-blue-100);

  /* ---- Overlays ---- */
  --color-overlay:        rgba(38, 45, 61, 0.5); /* graphite-900 @ 50% — for modal scrims */

  /* ---- Type roles (size + line height paired) ---- */
  --type-h1: var(--font-weight-semibold) var(--text-2xl)/var(--text-2xl--line-height) var(--font-sans);
  --type-h2: var(--font-weight-semibold) var(--text-xl)/var(--text-xl--line-height) var(--font-sans);
  --type-h3: var(--font-weight-semibold) var(--text-lg)/var(--text-lg--line-height) var(--font-sans);
  --type-h4: var(--font-weight-semibold) var(--text-md)/var(--text-md--line-height) var(--font-sans);
  --type-body-lg:  var(--font-weight-regular) var(--text-lg)/var(--text-lg--line-height) var(--font-sans);
  --type-body:     var(--font-weight-regular) var(--text-md)/var(--text-md--line-height) var(--font-sans);
  --type-body-sm:  var(--font-weight-regular) var(--text-sm)/var(--text-sm--line-height) var(--font-sans);
  --type-body-xs:  var(--font-weight-regular) var(--text-xxs)/var(--text-xxs--line-height) var(--font-sans);   /* Body Xsmall 12/18 */
  --type-body-xxs: var(--font-weight-regular) var(--text-2xs)/var(--text-2xs--line-height) var(--font-sans); /* Body Xxsmall 11/16 */
  /* Semibold body variants (same sizes, weight 600) */
  --type-body-lg-semibold:  var(--font-weight-semibold) var(--text-lg)/var(--text-lg--line-height) var(--font-sans);
  --type-body-semibold:     var(--font-weight-semibold) var(--text-md)/var(--text-md--line-height) var(--font-sans);
  --type-body-sm-semibold:  var(--font-weight-semibold) var(--text-sm)/var(--text-sm--line-height) var(--font-sans);
  --type-body-xs-semibold:  var(--font-weight-semibold) var(--text-xxs)/var(--text-xxs--line-height) var(--font-sans);
  --type-body-xxs-semibold: var(--font-weight-semibold) var(--text-2xs)/var(--text-2xs--line-height) var(--font-sans);
  --type-caption:  var(--font-weight-regular) var(--text-xxs)/var(--text-xxs--line-height) var(--font-sans);
  --type-mono:     var(--font-weight-regular) var(--text-sm)/var(--text-sm--line-height) var(--font-mono);
}

/* ---- Dark theme override ---- */
[data-theme="dark"] {
  --color-bg:             var(--color-zinc-900);
  --color-surface:        var(--color-zinc-800);
  --color-surface-muted:  var(--color-zinc-700);
  --color-surface-sunken: var(--color-zinc-900);

  --color-border:         var(--color-zinc-600);
  --color-border-strong:  var(--color-zinc-500);

  --color-text:           var(--color-gray-50);
  --color-text-muted:     var(--color-gray-400);
  --color-text-subtle:    var(--color-gray-600);
  --color-text-inverse:   var(--color-zinc-900);
  --color-icon:           var(--color-graphite-300);   /* lighter graphite for dark mode */

  --color-brand:          var(--color-green-400);
  --color-brand-hover:    var(--color-green-300);
  --color-brand-active:   var(--color-green-200);
  --color-brand-subtle:   var(--color-green-800);
}

/* ---- Reset + base ---- */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--color-bg);
  color: var(--color-text);
  font: var(--type-body);
  -webkit-font-smoothing: antialiased;
}
.page {
  max-width: var(--container-lg);
  margin: 0 auto;
  padding: var(--spacing-12) var(--spacing-6);
}

    /* === components.css === */
/* components.css — built on semantic aliases (semantic.css), never raw palette. */

/* ---------- Button ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--spacing-2);
  height: 32px; /* default — sm */
  padding: 0 var(--spacing-3);
  /* SM (default) solid buttons — Body Small Semibold 13/600 (NB-52) */
  font: var(--font-weight-semibold) var(--text-sm)/1 var(--font-sans);
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  cursor: pointer;
  /* No link underline when a button is rendered as an <a>. The deliberate
   * .btn-ghost:hover underline below still wins on hover. */
  text-decoration: none;
  transition: background var(--duration-fast) var(--ease),
              transform var(--duration-fast) var(--ease),
              box-shadow var(--duration-fast) var(--ease);
}
.btn-xs {
  height: 24px;
  padding: 0 var(--spacing-2);
  /* XS solid buttons — Body Xsmall Semibold 12/600 (NB-54) */
  font: var(--font-weight-semibold) var(--text-xxs)/1 var(--font-sans);
}

/* Icons inside buttons. Place an <svg class="btn-icon" /> as a child. */
.btn-icon { width: 1em; height: 1em; flex-shrink: 0; }
/* Generic icon — <svg class="icon"><use href="#i-{name}"></svg> from the custom
 * Figma icon sprite (designmd/icons.svg). Sized in em so font-size scales it,
 * matching the icons' old font-based sizing; colour follows currentColor. */
/* fill:none so stroke-based icons render as outlines; filled icons carry their
 * own fill="currentColor" on the paths. Colour rides on currentColor. */
.icon { width: 1em; height: 1em; flex-shrink: 0; display: inline-block; vertical-align: -0.125em; fill: none; color: var(--color-icon); }
/* The pack ships two sizes only — 16 and 24 (see DESIGN.md §9). */
.icon-16 { width: 16px; height: 16px; }
.icon-24 { width: 24px; height: 24px; }
/* Interactive / colour-carrying contexts keep the icon on the context colour
 * (primary buttons = white, links = blue, badges/tags/toasts = their own). */
.btn .icon, a .icon, .badge .icon, .tag .icon, .toast .icon, .editor-toolbar-btn .icon { color: inherit; }
/* .btn-xs .btn-icon — not needed: .btn-icon is 1em and .btn-xs is --text-xxs (12px). */

/* Icon-only button (no text) — fully rounded "pill" shape. */
.btn-icon-only            { width: 32px; padding: 0; border-radius: var(--radius-full); }
.btn-icon-only.btn-xs     { width: 24px; }

/* Ghost as icon-only: muted graphite icon on transparent bg, gray-150
 * surface on hover. Distinct from text `.btn-ghost` which uses brand-blue;
 * icon-only ghosts (kebabs, X buttons) stay quiet and neutral. */
.btn-icon-only.btn-ghost {
  color: var(--color-graphite-700);
}
.btn-icon-only.btn-ghost:hover {
  background: var(--color-surface-muted);
  color: var(--color-graphite-700);
}

/* Danger as icon-only: red icon on transparent bg, no fill. Reads as a
 * destructive affordance without screaming "delete" in red until clicked. */
.btn-icon-only.btn-danger {
  background: transparent;
  color: var(--color-danger);
}
.btn-icon-only.btn-danger:hover  { background: var(--color-danger-subtle); }
.btn-icon-only.btn-danger:active { background: var(--color-danger-subtle); }

/* Secondary as icon-only: graphite-700 icon on the outlined surface. A shade
 * darker than the ghost's graphite-500 — reads as a bordered, resting control. */
.btn-icon-only.btn-secondary {
  color: var(--color-graphite-750);
}
.btn:active { transform: translateY(1px); }
/* Disabled — reduced-opacity + not-allowed cursor across every variant.
 * `aria-disabled` mirrors the treatment for elements that stay focusable
 * but shouldn't be actionable. */
.btn:disabled,
.btn[aria-disabled="true"] {
  opacity: 0.5;
  cursor: not-allowed;
}
.btn:disabled:hover,
.btn[aria-disabled="true"]:hover { filter: none; }
.btn:disabled:active,
.btn[aria-disabled="true"]:active { transform: none; }
.btn:focus-visible {
  outline: 2px solid var(--color-border-focus);
  outline-offset: 2px;
}
.btn-primary {
  background: var(--color-brand);
  color: var(--color-text-inverse);
}
.btn-primary:hover  { background: var(--color-brand-hover); }
.btn-primary:active { background: var(--color-brand-active); }

.btn-secondary {
  background: var(--color-surface);
  color: var(--color-text);
  border-color: var(--color-border);
}
.btn-secondary:hover { background: var(--color-surface-muted); }

.btn-ghost {
  background: transparent;
  color: var(--color-accent);
  /* Ghost buttons run one size larger than solid: SM ghost 14px semibold (NB-53) */
  font-size: var(--text-md);
}
/* XS ghost — 13px semibold (NB-53) */
.btn-xs.btn-ghost { font-size: var(--text-sm); }
/* Hover keeps the background transparent (clickable area unchanged) and
 * signals interactivity with an underline instead. */
.btn-ghost:hover { text-decoration: underline; text-underline-offset: 3px; }

.btn-danger {
  background: var(--color-danger);
  color: var(--color-text-inverse);
}
.btn-danger:hover  { background: var(--color-danger-hover); }

/* ---------- Field + Input ---------- */
.field { display: flex; flex-direction: column; gap: var(--spacing-2); }
.field-label {
  font: var(--type-caption);
  color: var(--color-text-muted);
}
.field-hint {
  font: var(--type-caption);
  color: var(--color-text-subtle);
}
.field-hint.is-error { color: var(--color-danger); }
.input {
  height: 32px; /* default — sm */
  padding: 0 var(--spacing-3);
  font: var(--type-body-sm);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  color: var(--color-text);
  transition: border-color var(--duration-fast) var(--ease),
              box-shadow var(--duration-fast) var(--ease);
}
.input-xs {
  height: 24px;
  padding: 0 var(--spacing-2);
  font: var(--font-weight-regular) var(--text-xxs)/var(--text-sm--line-height) var(--font-sans);
}

/* Input with an inset icon (left or right). The icon is decorative
 * (pointer-events pass through to the field); the input gets extra padding
 * on that side to make room.
 *
 *   <div class="input-icon input-icon-left">
 *     <svg class="icon input-icon-glyph"><use href="#i-calendar-blank"/></svg>
 *     <input class="input" type="text" />
 *   </div>
 *   <div class="input-icon input-icon-right">
 *     <input class="input" type="search" />
 *     <svg class="icon input-icon-glyph"><use href="#i-magnifying-glass"/></svg>
 *   </div>
 */
.input-icon { position: relative; }
.input-icon > .input { display: block; width: 100%; }
.input-icon-glyph {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  font-size: 16px;
  line-height: 1;
  color: var(--color-text-muted);
  pointer-events: none;
}
.input-icon-left  .input-icon-glyph { left: var(--spacing-3); }
.input-icon-left  .input { padding-left: calc(var(--spacing-3) + 16px + var(--spacing-2)); }
.input-icon-right .input-icon-glyph { right: var(--spacing-3); }
.input-icon-right .input { padding-right: calc(var(--spacing-3) + 16px + var(--spacing-2)); }
/* Match glyph inset to the tighter padding on the xs size */
.input-icon-left  .input-xs.input,
.input-icon-left  .input-xs { padding-left: calc(var(--spacing-2) + 16px + var(--spacing-1)); }
.input-icon-left:has(.input-xs) .input-icon-glyph { left: var(--spacing-2); }
.input-icon-right .input-xs { padding-right: calc(var(--spacing-2) + 16px + var(--spacing-1)); }
.input-icon-right:has(.input-xs) .input-icon-glyph { right: var(--spacing-2); }

/* Textarea variant of .input */
textarea.input {
  height: auto;
  min-height: 80px;
  padding: var(--spacing-3) var(--spacing-4);
  line-height: 1.5;
  resize: vertical;
}

/* Right-aligned hint — used for character counters */
.field-hint-end {
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.field-hint-row {
  display: flex;
  justify-content: space-between;
  gap: var(--spacing-3);
}

/* ---------- Select (dropdown input) ----------
 * Trigger styled like .input, paired with a .dropdown-menu via JS toggle.
 *
 *   <div class="input-select">
 *     <button class="input-select-trigger" aria-expanded="false">
 *       <span class="input-select-value input-select-placeholder">Choose…</span>
 *       <svg class="btn-icon"><use href="#i-chevron-down"/></svg>
 *     </button>
 *     <div class="dropdown-menu" hidden>...</div>
 *   </div>
 */
.input-select {
  position: relative;
  width: 100%;
}
.input-select-trigger {
  display: inline-flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--spacing-2);
  width: 100%;
  height: 32px;
  padding: 0 var(--spacing-2) 0 var(--spacing-3);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  font: var(--type-body-sm);
  color: var(--color-text);
  text-align: left;
  cursor: pointer;
  transition: border-color var(--duration-fast) var(--ease),
              box-shadow var(--duration-fast) var(--ease);
}
.input-select-trigger:hover               { border-color: var(--color-border-strong); }
.input-select-trigger:focus-visible,
.input-select-trigger[aria-expanded="true"] {
  outline: none;
  border-color: var(--color-border-focus);
  box-shadow: 0 0 0 3px var(--color-accent-subtle);
}
.input-select-trigger > .btn-icon {
  color: var(--color-text-muted);
  transition: transform var(--duration-fast) var(--ease);
}
.input-select-trigger[aria-expanded="true"] > .btn-icon { transform: rotate(180deg); }
.input-select-placeholder { color: var(--color-text-subtle); }
.input-select-value {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.input-select .dropdown-menu {
  position: absolute;
  top: calc(100% + var(--spacing-1));
  left: 0;
  right: 0;
  z-index: var(--z-dropdown);
}
.input-select .dropdown-menu[hidden] { display: none; }

/* ---------- Tag input ----------
 * Container behaves like .input; chips + a free-text input live inside.
 * On Enter the typed text becomes a chip; Backspace on empty removes the last chip.
 *
 *   <div class="input-tags">
 *     <span class="chip">React<button class="chip-remove">…</button></span>
 *     <input class="input-tags-input" placeholder="Add tag…" />
 *   </div>
 */
.input-tags {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--spacing-1);
  min-height: 32px;
  padding: 2px var(--spacing-2);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  cursor: text;
  transition: border-color var(--duration-fast) var(--ease),
              box-shadow var(--duration-fast) var(--ease);
}
/* Chips inside the tag input shrink to fit the 32px row */
.input-tags .chip { height: 24px; }
.input-tags:focus-within {
  border-color: var(--color-border-focus);
  box-shadow: 0 0 0 3px var(--color-accent-subtle);
}
.input-tags-input {
  flex: 1;
  min-width: 80px;
  height: 24px;
  padding: 0 var(--spacing-1);
  border: 0;
  outline: 0;
  background: transparent;
  font: var(--type-body-sm);
  color: var(--color-text);
}
.input-tags-input::placeholder { color: var(--color-text-subtle); }

/* ---------- Segmented control ----------
 * Bordered group of mutually-exclusive options; the active segment is filled
 * dark. Use for view / period switchers. Icon-only segments via .segmented-icon.
 *
 *   <div class="segmented" role="tablist">
 *     <button class="segmented-item is-active" type="button">Schedule</button>
 *     <button class="segmented-item" type="button">Week</button>
 *   </div>
 */
.segmented {
  display: inline-flex;
  height: 32px;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  flex-shrink: 0;
  /* Scrolls rather than clips. `overflow: hidden` rounds the end segments
   * against the border, but it also means a control wider than its container
   * loses its last segments with no way to reach them — on a phone the
   * feature directory's "On hold" filter was simply gone. overflow-x: auto
   * still clips to the radius and keeps them reachable, by touch, trackpad
   * or Tab. The scrollbar is suppressed because a half-cut segment is the
   * affordance, and a 32px control has no room for a bar under it. */
  max-width: 100%;
  overflow-x: auto;
  overflow-y: hidden;
  scrollbar-width: none;
}
.segmented::-webkit-scrollbar { display: none; }
.segmented-item {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--spacing-2);
  height: 100%;
  padding: 0 var(--spacing-4);
  /* Hold the label on one line and keep the intrinsic width: the control
   * scrolls when it runs out of room (see .segmented), and an item that
   * shrinks instead wraps its label and breaks the 32px row. */
  flex: 0 0 auto;
  white-space: nowrap;
  border: 0;
  border-right: 1px solid var(--color-border);
  background: var(--color-surface);
  color: var(--color-text-muted);
  font: var(--type-body-sm);
  cursor: pointer;
  transition: background var(--duration-fast) var(--ease),
              color var(--duration-fast) var(--ease);
}
.segmented-item:last-child { border-right: 0; }
.segmented-item:hover { background: var(--color-surface-muted); color: var(--color-text); }
/* Active segment — graphite-700 fill, white label + icon (NB-60). Icons
 * inherit the item's colour so the active one flips to white instead of
 * staying graphite-700 (invisible on the dark fill). */
.segmented-item.is-active,
.segmented-item.is-active:hover { background: var(--color-graphite-750); color: var(--color-text-inverse); }
.segmented-item .icon { color: inherit; }
.segmented-item .btn-icon { width: 16px; height: 16px; }
.segmented-item.segmented-icon { padding: 0; width: 34px; }

/* ---------- Toolbar ----------
 * Horizontal control strip above a table/list. Composes existing parts —
 * .input-icon search, .input-select quick-filters, .btn actions, .segmented
 * view switcher, .checkbox. Left cluster grows; .toolbar-end pins controls right.
 *
 *   <div class="toolbar">
 *     <div class="input-icon input-icon-left toolbar-search">
 *       <svg class="icon input-icon-glyph"><use href="#i-magnifying-glass"/></svg>
 *       <input class="input" placeholder="Search…">
 *     </div>
 *     <button class="btn btn-secondary"><svg class="icon"><use href="#i-funnel"/></svg>Filters</button>
 *     <div class="toolbar-end"> … .input-select.is-auto … .segmented … </div>
 *   </div>
 */
.toolbar { display: flex; align-items: center; gap: var(--spacing-2); flex-wrap: wrap; }
.toolbar-search { flex: 1 1 240px; min-width: 160px; }
.toolbar-search > .input { width: 100%; }
/* min-width: 0 so a scrollable child can actually be capped. A flex item
 * defaults to min-width: auto and refuses to go below its content, so a
 * .segmented inside with max-width: 100% measures 100% of an already
 * overflowing parent and the row runs off the screen. */
.toolbar-end { margin-left: auto; display: inline-flex; align-items: center; gap: var(--spacing-2); flex-wrap: wrap; min-width: 0; }
.toolbar-spacer { flex: 1 1 auto; }
/* Quick-filter select sized to its content instead of filling the row */
.input-select.is-auto { width: auto; }
.input-select.is-auto .input-select-trigger { width: auto; min-width: 130px; }

/* ---------- Pictogram ----------
 * Detailed 64x64 line-art illustration for empty / error / success / info
 * states — a richer counterpart to the plain icon set. Blue (accent)
 * strokes over light (accent-subtle) fills; recolour via the `color` property.
 *
 *   <span class="pictogram"><svg viewBox="0 0 64 64">…</svg></span>
 *
 * Inside the svg: stroke="currentColor" for outlines, class="pg-fill" for the
 * soft tint, class="pg-solid" for filled dots, class="pg-bg" for knockouts.
 */
.pictogram {
  display: inline-flex;
  width: 64px;
  height: 64px;
  color: var(--color-accent);
  flex-shrink: 0;
}
.pictogram svg {
  display: block;
  width: 100%;
  height: 100%;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.pictogram .pg-fill  { fill: var(--color-accent-subtle); stroke: currentColor; }
.pictogram .pg-bg    { fill: var(--color-surface); stroke: currentColor; }
.pictogram .pg-solid { fill: currentColor; stroke: none; }
/* Exact SVG exports mix filled outlines and 1px stroked paths; let each path's
 * own fill/stroke attribute drive and just supply a default stroke width. */
.pictogram.is-filled svg { fill: none; stroke: none; stroke-width: 1.5; }
/* Muted / disabled variant — matches the gray pictogram states in Figma */
.pictogram.is-muted { color: var(--color-text-subtle); }
.pictogram.is-muted .pg-fill { fill: var(--color-surface-muted); }

/* ---------- Rich text editor ----------
 * Toolbar + contenteditable body. Compose with .field for label + counter + error.
 *
 *   <div class="editor">
 *     <div class="editor-toolbar">…buttons…</div>
 *     <div class="editor-content" contenteditable="true" data-placeholder="…"></div>
 *   </div>
 */
.editor {
  display: flex;
  flex-direction: column;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  transition: border-color var(--duration-fast) var(--ease),
              box-shadow var(--duration-fast) var(--ease);
}
.editor:focus-within {
  border-color: var(--color-border-focus);
  box-shadow: 0 0 0 3px var(--color-accent-subtle);
}
.editor.is-error                { border-color: var(--color-danger); }
.editor.is-error:focus-within   { box-shadow: 0 0 0 3px var(--color-danger-subtle); }
.editor.is-disabled             { opacity: 0.5; pointer-events: none; }

.editor-toolbar {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 2px;
  padding: var(--spacing-1) var(--spacing-2);
  border-bottom: 1px solid var(--color-border);
}
.editor-toolbar-divider {
  width: 1px;
  height: 16px;
  background: var(--color-border);
  margin: 0 var(--spacing-1);
}

/* Toolbar select (e.g. "Normal Text" heading picker) — slimmer than .input-select */
.editor-toolbar-select { width: auto; }
.editor-toolbar-select .input-select-trigger {
  height: 32px;
  min-width: 120px;
  padding: 0 var(--spacing-2);
  border: 0;
  background: transparent;
  font: var(--type-body-sm);
  gap: var(--spacing-2);
}
.editor-toolbar-select .input-select-trigger:hover {
  background: var(--color-surface-muted);
}
.editor-toolbar-select .input-select-trigger:focus-visible,
.editor-toolbar-select .input-select-trigger[aria-expanded="true"] {
  box-shadow: none;
  background: var(--color-surface-muted);
}

.editor-toolbar-btn {
  width: 32px;
  height: 32px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  border: 0;
  background: transparent;
  border-radius: var(--radius-sm);
  color: var(--color-text);
  cursor: pointer; font: inherit;
  transition: background var(--duration-fast) var(--ease),
              color var(--duration-fast) var(--ease);
}
.editor-toolbar-btn:hover               { background: var(--color-surface-muted); }
.editor-toolbar-btn.is-active           { background: var(--color-surface-muted); color: var(--color-brand); }

.editor-content {
  min-height: 160px;
  padding: var(--spacing-4);
  font: var(--type-body);
  color: var(--color-text);
  outline: 0;
  line-height: 1.5;
  overflow-y: auto;
}
.editor-content:empty::before {
  content: attr(data-placeholder);
  color: var(--color-text-subtle);
  pointer-events: none;
}
.editor-content > :first-child { margin-top: 0; }
.editor-content > :last-child  { margin-bottom: 0; }
.editor-content ul,
.editor-content ol {
  margin: var(--spacing-2) 0;
  padding-left: var(--spacing-6);
}
.editor-content code {
  font: var(--type-mono);
  background: var(--color-surface-muted);
  padding: 1px var(--spacing-1);
  border-radius: var(--radius-sm);
}
.editor-content a { color: var(--color-text-link); }

/* Footer pattern — char count + validation tick, lives in .field-hint-row */
.editor-counter {
  display: inline-flex;
  align-items: center;
  gap: var(--spacing-1);
}
.editor-counter-ok {
  width: 14px;
  height: 14px;
  color: var(--color-success);
}
.input::placeholder { color: var(--color-text-subtle); }
.input:focus {
  outline: none;
  border-color: var(--color-border-focus);
  box-shadow: 0 0 0 3px var(--color-accent-subtle);
}
/* Invalid state — matches .editor.is-error: red border + red focus ring. */
.input.is-error                { border-color: var(--color-danger); }
.input.is-error:focus          { border-color: var(--color-danger); box-shadow: 0 0 0 3px var(--color-danger-subtle); }

/* ---------- Card ----------
 * `hidden` has to be stated. A card is often an <a> or a <div> that the page
 * gives its own `display`, and any such rule beats the browser's
 * `[hidden] { display: none }` — so the attribute silently stops working and
 * a card meant to be out of the list is in it. .card[hidden] outranks both
 * `.card` and `a.card` on specificity, so no !important is needed. (The kit
 * carried this once and lost it; the feature directory's hidden admin card
 * came back when it was re-baked.) */
.card[hidden] { display: none; }

.card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--spacing-6);
}
.card-title { font: var(--type-h3); margin: 0 0 var(--spacing-2); color: var(--color-text); }
.card-body  { font: var(--type-body); color: var(--color-text-muted); margin: 0; }

/* ---------- Table ----------
 * Base: semantic <table>/<thead>/<tbody>/<tr>/<th>/<td>. Left-aligned, no grid lines,
 * subtle bottom border on the header row.
 *
 *   <table class="table table-wide">
 *     <thead><tr>
 *       <th><button class="th-sort">Name<svg .../></button></th>
 *       <th>Status</th>
 *     </tr></thead>
 *     <tbody>
 *       <tr><td>…</td><td>…</td></tr>
 *     </tbody>
 *   </table>
 *
 * Modifier:
 *   .table-wide — tall rows (80px) + zebra striping; for content-heavy lists.
 *
 * Cell-content helpers (compose inside <td>):
 *   .cell-title  — title + small subtype label
 *   .cell-user   — avatar + name + role
 *   .cell-meta   — small title + caption row (optional icon)
 *   .cell-actions— right-aligned action buttons (kebab etc.)
 */
.table {
  width: 100%;
  border-collapse: collapse;
  font: var(--type-body-sm);
  color: var(--color-text);
  text-align: left;
}
.table thead th {
  padding: var(--spacing-3) var(--spacing-4);
  /* Semibold column heads (NB-58) */
  font: var(--font-weight-semibold) var(--text-sm)/1 var(--font-sans);
  color: var(--color-text-muted);
  border-bottom: 1px solid var(--color-border);
  vertical-align: middle;
  white-space: nowrap;
}
.table tbody td {
  padding: var(--spacing-3) var(--spacing-4);
  vertical-align: middle;
  white-space: nowrap;
}

/* Wide variant — fixed 80px rows with zebra striping. Every row is the same
 * height whether its cells are one- or two-line; vertical-align:middle centers
 * the content, so the trimmed vertical padding just guards tall content. */
.table-wide tbody tr { height: 80px; }
.table-wide tbody td { padding: var(--spacing-4) var(--spacing-4); }
.table-wide tbody tr:nth-child(even) td { background: var(--color-surface-muted); }

/* Scroll container — wraps a .table to enable both axes of scrolling.
 * Sticky header keeps column labels visible while scrolling vertically. */
.table-scroll {
  overflow: auto;
  max-height: 480px;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
}
.table-scroll .table thead th {
  position: sticky;
  top: 0;
  background: var(--color-surface);
  z-index: 1;
}

/* Sortable header — button-styled span with an arrow icon */
.th-sort {
  display: inline-flex;
  align-items: center;
  gap: var(--spacing-1);
  background: transparent;
  border: 0;
  padding: 0;
  cursor: pointer;
  font: inherit;
  color: inherit;
}
.th-sort svg { font-size: 1em; color: var(--color-text-subtle); }
.th-sort:hover { color: var(--color-text); }
.th-sort:hover svg { color: var(--color-text-muted); }

/* Right-aligned utility for action cells */
.cell-actions { display: flex; align-items: center; justify-content: flex-end; gap: var(--spacing-2); }

/* Title + sub-label stack — bold title, small muted type below.
 * Wrap with .cell-title-row to add an expand/collapse toggle for tree tables. */
.cell-title { display: flex; flex-direction: column; gap: var(--spacing-1); min-width: 0; }
.cell-title-text { font: var(--font-weight-regular) var(--text-md)/1.3 var(--font-sans); color: var(--color-text); }
.cell-title-sub  { font: var(--font-weight-regular) var(--text-xxs)/1.2 var(--font-sans); color: var(--color-text-muted); }
.cell-title-row  { display: flex; align-items: center; gap: var(--spacing-2); }

/* Nested row hierarchy — drive indentation off data-level on the <tr>. */
.table tbody tr[data-level="1"] .cell-title-row { padding-left: var(--spacing-6); }
.table tbody tr[data-level="2"] .cell-title-row { padding-left: calc(var(--spacing-6) * 2); }

/* Expand/collapse caret + a same-sized spacer for leaf rows so titles align across levels. */
.row-toggle {
  width: 20px;
  height: 20px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 0;
  padding: 0;
  cursor: pointer; font: inherit;
  color: var(--color-text-muted);
  border-radius: var(--radius-sm);
  flex-shrink: 0;
  transition: background var(--duration-fast) var(--ease), color var(--duration-fast) var(--ease);
}
.row-toggle:hover { background: var(--color-surface-muted); color: var(--color-text); }
.row-toggle svg { font-size: 1em; transition: transform var(--duration-fast) var(--ease); }
.row-toggle[aria-expanded="true"] svg { transform: rotate(90deg); }
.row-toggle-spacer { display: inline-block; width: 20px; height: 20px; flex-shrink: 0; }

/* User cell — circular avatar + name + role */
.cell-user { display: flex; align-items: center; gap: var(--spacing-3); min-width: 0; }
/* People in table cells use the avatar component — `.avatar.avatar-md` inside
 * `.cell-user`. There is no separate cell avatar: it drifted from the component
 * (a round 32px badge) once avatars became square with a cut corner. */
.cell-user-meta { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.cell-user-name { font: var(--font-weight-regular) var(--text-sm)/1.2 var(--font-sans); color: var(--color-text); }
.cell-user-role { font: var(--type-caption); color: var(--color-text-muted); }

/* Meta cell — body text with optional caption row underneath */
.cell-meta { display: flex; flex-direction: column; gap: var(--spacing-1); }
.cell-meta-title { font: var(--type-body-sm); color: var(--color-text); }
.cell-meta-sub   { font: var(--type-caption); color: var(--color-text-muted); display: inline-flex; align-items: center; gap: var(--spacing-1); }
.cell-meta-sub svg { font-size: 1em; color: var(--color-text-subtle); }

/* Health dot — small colored circle used inline in a cell */
.cell-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: var(--radius-full);
  background: var(--color-success);
}
.cell-dot.is-warning { background: var(--color-warning); }
.cell-dot.is-danger  { background: var(--color-danger); }

/* ---------- Table · Sheet variant ----------
 * Airtable/Linear-style editable spreadsheet. Grid lines on every cell,
 * sticky header + sticky "#" gutter, compact rows, and a generic per-cell
 * state machine reused by six cell primitives. Toggle against .table-wide:
 * both are <table class="table …"> so a prototype can swap the modifier.
 *
 *   <div class="table-scroll">
 *     <table class="table table-sheet" data-sheet>
 *       <thead><tr>
 *         <th class="sheet-gutter">#</th>
 *         <th class="sheet-col" data-col="name"><button class="th-sort">Name</button><span class="th-tools">…</span></th>
 *         …
 *       </tr></thead>
 *       <tbody>
 *         <tr data-level="0">
 *           <td class="sheet-gutter"><span class="sheet-rownum">1</span></td>
 *           <td class="sheet-cell" data-type="text" data-variant="name" tabindex="-1"> … </td>
 *           …
 *         </tr>
 *       </tbody>
 *     </table>
 *   </div>
 *
 * Cell state = classes on the <td class="sheet-cell">:
 *   (default) · .is-empty · :hover · .is-selected · .is-editing ·
 *   .is-saving · .is-saved · .is-error · .is-readonly · .is-skeleton
 * Behaviour (select / edit / commit / cancel / arrow-nav / save sim) is
 * driven by the [data-sheet] JS module; see DESIGN.md §Sheet.
 */
.table-sheet {
  border-collapse: separate;
  border-spacing: 0;
  font: var(--type-body-sm);
  table-layout: fixed;
}
.table-sheet thead th {
  padding: 0;
  border-bottom: 1px solid var(--color-border);
  border-right: 1px solid var(--color-border);
  background: var(--color-surface);
  font: var(--font-weight-regular) var(--text-sm)/1 var(--font-sans);
  color: var(--color-text-muted);
  vertical-align: middle;
  position: sticky;
  top: 0;
  z-index: 2;
}
.table-sheet thead th:last-child { border-right: 0; }
.table-sheet tbody td {
  padding: 0;
  height: 28px;
  border-bottom: 1px solid var(--color-border);
  border-right: 1px solid var(--color-border);
  vertical-align: middle;
  white-space: nowrap;
  background: var(--color-surface);
}
.table-sheet tbody td:last-child { border-right: 0; }
.table-sheet tbody tr:last-child td { border-bottom: 0; }

/* Header cell inner — label + hover tools (menu, resize) */
.sheet-col-inner {
  display: flex;
  align-items: center;
  gap: var(--spacing-2);
  padding: 0 var(--spacing-3);
  height: 34px;
  position: relative;
}
.sheet-col .th-sort { flex: 1; min-width: 0; }
.sheet-col .th-tools {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  opacity: 0;
  transition: opacity var(--duration-fast) var(--ease);
}
.sheet-col:hover .th-tools,
.sheet-col.is-sorted .th-tools,
.sheet-col.is-filtered .th-tools { opacity: 1; }
.th-menu {
  width: 20px; height: 20px;
  display: inline-flex; align-items: center; justify-content: center;
  background: transparent; border: 0; padding: 0; cursor: pointer; font: inherit;
  color: var(--color-text-subtle); border-radius: var(--radius-sm);
}
.th-menu:hover { background: var(--color-surface-muted); color: var(--color-text); }
.th-menu svg { font-size: 1em; }
/* Sort direction arrow */
.sheet-col .th-sort .th-arrow { font-size: var(--text-2xs); opacity: 0; }
.sheet-col.is-sorted .th-sort { color: var(--color-text); }
.sheet-col.is-sorted .th-sort .th-arrow { opacity: 1; }
.sheet-col.is-desc .th-sort .th-arrow { transform: rotate(180deg); }
/* Filtered marker */
.sheet-col.is-filtered .sheet-col-inner::after {
  content: ""; width: 6px; height: 6px; border-radius: var(--radius-full);
  background: var(--color-accent); flex-shrink: 0;
}
/* Column resize handle */
.th-resize {
  position: absolute; top: 0; right: -3px; width: 6px; height: 100%;
  cursor: col-resize; z-index: 1;
}
.th-resize::after {
  content: ""; position: absolute; top: 6px; bottom: 6px; left: 2px; width: 2px;
  background: transparent; border-radius: 1px;
}
.th-resize:hover::after, .th-resize.is-dragging::after { background: var(--color-border-focus); }

/* Sticky gutter — row number column, pinned on horizontal scroll */
.sheet-gutter {
  position: sticky;
  left: 0;
  z-index: 3;
  width: 44px;
  text-align: center;
  color: var(--color-text-subtle);
  font: var(--font-weight-regular) var(--text-xxs)/1 var(--font-sans);
  background: var(--color-surface-muted);
}
/* Keep the gutter its own gray-150 region even under row hover / selection
 * (specificity 0,3,1 beats the hover/selected row rules at 0,2,3). */
.table-scroll .table.table-sheet .sheet-gutter { background: var(--color-surface-muted); }
.table-sheet thead .sheet-gutter { z-index: 4; }
/* Stacking order inside a .table-scroll wrapper. The base rule
 * `.table-scroll .table thead th { z-index: 1 }` (specificity 0,2,2) would
 * otherwise flatten every header to z-index 1 — collapsing the header/gutter
 * layering and letting later-in-DOM headers paint over the pinned `#`. These
 * scroll-scoped rules (specificity 0,3,2) win and set the true order:
 * header `#` (5) > other headers (4) > body gutter (3) > body cells (auto). */
.table-scroll .table.table-sheet thead th { z-index: 4; }
.table-scroll .table.table-sheet thead .sheet-gutter,
.table-scroll .table.table-sheet thead .sheet-toggle { z-index: 5; }
.sheet-rownum { display: inline-block; }

/* Expand/collapse toggle column — pinned directly after the # gutter (left = its
 * 44px width). Holds a caret on parent rows and a collapse/expand-all control in
 * the header. It carries the pinned-region separator on its right edge. */
.sheet-toggle {
  position: sticky;
  left: 44px;
  z-index: 3;
  width: 30px;
  text-align: center;
  background: var(--color-surface-muted);
  box-shadow: inset -1px 0 0 var(--color-border);
}
/* Keep the toggle column gray-150 too, even under row hover / selection. */
.table-scroll .table.table-sheet .sheet-toggle { background: var(--color-surface-muted); }
.table-sheet thead .sheet-toggle { z-index: 4; }
.sheet-toggle .row-toggle { margin: 0 auto; }
/* Collapse / expand-all control — two stacked carets (⌄ over ⌃) */
.sheet-collapse-all {
  width: 20px; height: 20px; margin: 0 auto;
  display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
  background: transparent; border: 0; padding: 0; cursor: pointer; font: inherit;
  color: var(--color-text-subtle); border-radius: var(--radius-sm);
}
.sheet-collapse-all:hover { background: var(--color-surface-muted); color: var(--color-text); }
.sheet-collapse-all svg { font-size: 9px; line-height: 0.55; }

/* ---- Row states ---- */
.table-sheet tbody tr:hover td { background: var(--color-surface-muted); }
.table-sheet tbody tr.is-selected td { background: var(--color-accent-subtle); }
.table-sheet tbody tr.is-selected .sheet-gutter { color: var(--color-text); }
/* blue left rail on the first data cell of a selected row */
.table-sheet tbody tr.is-selected td.sheet-cell:first-of-type { box-shadow: inset 2px 0 0 var(--color-border-focus); }

/* Range selection (T13) — rectangular multi-cell highlight, no per-cell ring */
.table-sheet tbody td.sheet-cell.is-range { background: var(--color-accent-subtle); }
.table-sheet tbody tr.is-selected td.sheet-cell.is-range { background: var(--color-accent-subtle); }

/* ---- Generic cell wrapper + state machine ---- */
.sheet-cell {
  position: relative;
  cursor: default;
  outline: none;
  transition: box-shadow var(--duration-fast) var(--ease);
}
.sheet-cell-inner {
  display: flex;
  align-items: center;
  gap: var(--spacing-2);
  padding: 0 var(--spacing-3);
  min-height: 28px;
  overflow: hidden;
}
.sheet-cell[data-align="center"] .sheet-cell-inner { justify-content: center; }
/* Selected / focused cell — inset blue ring drawn over grid lines */
.table-sheet tbody td.sheet-cell.is-selected {
  box-shadow: inset 0 0 0 2px var(--color-border-focus);
  background: var(--color-surface);
  z-index: 1;
}
.table-sheet tbody tr.is-selected td.sheet-cell.is-selected { background: var(--color-surface); }
/* Editing — clean white field, stronger ring */
.table-sheet tbody td.sheet-cell.is-editing {
  box-shadow: inset 0 0 0 2px var(--color-border-focus);
  background: var(--color-surface);
  z-index: 2;
  white-space: normal;
}
/* Empty — faint add affordance, revealed on hover/selection */
.sheet-cell.is-empty .sheet-empty {
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--color-text-subtle);
  opacity: 0;
  transition: opacity var(--duration-fast) var(--ease);
}
.sheet-cell.is-empty:hover .sheet-empty,
.sheet-cell.is-empty.is-selected .sheet-empty { opacity: 1; }
.sheet-empty svg { font-size: 1em; }
/* Saving / saved / error affordances (top-right corner marker) */
.sheet-cell .sheet-status {
  position: absolute; top: 3px; right: 4px;
  width: 12px; height: 12px;
  display: none; align-items: center; justify-content: center;
  font-size: var(--text-2xs); line-height: 1;
}
.sheet-cell.is-saving .sheet-status,
.sheet-cell.is-saved  .sheet-status,
.sheet-cell.is-error  .sheet-status { display: inline-flex; }
.sheet-cell.is-saving .sheet-status { color: var(--color-text-subtle); }
.sheet-cell.is-saved  .sheet-status { color: var(--color-success); }
.sheet-cell.is-error  .sheet-status { color: var(--color-danger); }
.sheet-cell.is-saving .sheet-status svg { animation: sheet-spin 0.6s linear infinite; }
.table-sheet tbody td.sheet-cell.is-error {
  box-shadow: inset 0 0 0 2px var(--color-danger);
}
.sheet-cell.is-error .sheet-error-msg {
  position: absolute; left: 0; top: calc(100% - 1px); z-index: 5;
  background: var(--color-danger); color: var(--color-text-inverse);
  font: var(--font-weight-regular) var(--text-xxs)/1.3 var(--font-sans);
  padding: 2px var(--spacing-2); border-radius: 0 0 var(--radius-sm) var(--radius-sm);
  white-space: nowrap;
}
/* Read-only / disabled */
.sheet-cell.is-readonly { cursor: not-allowed; }
.sheet-cell.is-readonly .sheet-cell-inner { color: var(--color-text-subtle); }
/* Loading skeleton */
.sheet-cell.is-skeleton .sheet-cell-inner::before {
  content: ""; height: 10px; width: 60%; border-radius: var(--radius-full);
  background: linear-gradient(90deg, var(--color-surface-muted) 25%, var(--color-surface-sunken) 37%, var(--color-surface-muted) 63%);
  background-size: 400% 100%;
  animation: sheet-shimmer 1.4s ease infinite;
}
@keyframes sheet-shimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }
@keyframes sheet-spin { to { transform: rotate(360deg); } }

/* ---- Inline editors (text input + popover), injected by the JS module ---- */
.sheet-input {
  width: 100%; border: 0; outline: none; background: transparent;
  font: inherit; color: var(--color-text); padding: 0;
  resize: none; line-height: 1.4;
}
.sheet-pop {
  position: absolute; z-index: var(--z-overlay);
  min-width: 200px; max-width: 320px;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-5, 0 8px 24px rgba(0,0,0,0.12));
  padding: var(--spacing-2);
}
.sheet-pop-search {
  width: 100%; box-sizing: border-box; margin-bottom: var(--spacing-2);
  padding: var(--spacing-2) var(--spacing-3);
  border: 1px solid var(--color-border); border-radius: var(--radius-sm);
  font: var(--type-body-sm); color: var(--color-text); background: var(--color-surface);
  outline: none;
}
.sheet-pop-search:focus { border-color: var(--color-border-focus); }
.sheet-pop-list { max-height: 240px; overflow-y: auto; display: flex; flex-direction: column; gap: 1px; }
.sheet-opt {
  display: flex; align-items: center; gap: var(--spacing-2);
  width: 100%; text-align: left;
  padding: var(--spacing-2) var(--spacing-3);
  background: transparent; border: 0; border-radius: var(--radius-sm);
  font: var(--type-body-sm); color: var(--color-text); cursor: pointer;
}
.sheet-opt:hover, .sheet-opt.is-active { background: var(--color-surface-muted); }
.sheet-opt svg.sheet-opt-check { margin-left: auto; color: var(--color-accent); font-size: 1em; }
.sheet-opt.is-empty-note { color: var(--color-text-subtle); cursor: default; }
.sheet-opt.is-empty-note:hover { background: transparent; }

/* ---- Cell primitives ---- */
/* Text · Name variant — hierarchy (toggle/spacer + indent + add-child) */
.sheet-tree { display: flex; align-items: center; gap: var(--spacing-1); min-width: 0; flex: 1; }
.sheet-cell[data-level="1"] .sheet-tree { padding-left: var(--spacing-4); }
.sheet-cell[data-level="2"] .sheet-tree { padding-left: calc(var(--spacing-4) * 2); }
.sheet-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sheet-cell[data-level="0"] .sheet-name { font-weight: var(--font-weight-regular); }
.sheet-addchild {
  width: 20px; height: 20px; flex-shrink: 0; margin-left: auto;
  display: inline-flex; align-items: center; justify-content: center;
  background: transparent; border: 0; padding: 0; cursor: pointer; font: inherit;
  color: var(--color-text-subtle); border-radius: var(--radius-sm);
  opacity: 0; transition: opacity var(--duration-fast) var(--ease);
}
.sheet-cell:hover .sheet-addchild, .sheet-cell.is-selected .sheet-addchild { opacity: 1; }
.sheet-addchild:hover { background: var(--color-surface-muted); color: var(--color-text); }
.sheet-addchild svg { font-size: 1em; }
/* Text · Description variant — truncate with ellipsis */
.sheet-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--color-text); }
.sheet-cell[data-variant="muted"] .sheet-text { color: var(--color-text-muted); }

/* Person picker */
.sheet-person { display: inline-flex; align-items: center; gap: var(--spacing-2); min-width: 0; }
.sheet-avatar {
  width: 20px; height: 20px; flex-shrink: 0;
  border-radius: var(--radius-full);
  background: var(--color-surface-sunken);
  display: inline-flex; align-items: center; justify-content: center;
  font: var(--font-weight-regular) 9px/1 var(--font-sans);
  color: var(--color-text-muted); text-transform: uppercase;
}
.sheet-person-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Date · roadmap dot + rob time (reuses .cell-dot) */
.sheet-date { display: inline-flex; align-items: center; gap: var(--spacing-2); }

/* Multi-select tags */
.sheet-tags { display: inline-flex; align-items: center; gap: var(--spacing-1); min-width: 0; overflow: hidden; }
.sheet-tags-more { font: var(--font-weight-regular) var(--text-xxs)/1 var(--font-sans); color: var(--color-text-subtle); flex-shrink: 0; }

/* Link / reference */
.sheet-link {
  display: inline-flex; align-items: center; gap: var(--spacing-1); min-width: 0;
  color: var(--color-text-link); text-decoration: none;
}
.sheet-link:hover { text-decoration: underline; }
.sheet-link-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sheet-link svg { font-size: 1em; flex-shrink: 0; }

/* ---- Table-level empty + toolbar ---- */
.sheet-empty-state {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: var(--spacing-3); padding: var(--spacing-12);
  color: var(--color-text-muted); text-align: center;
}
.sheet-empty-state[hidden] { display: none; }
.sheet-empty-state svg { font-size: 32px; color: var(--color-text-subtle); }

/* ---------- Accordion ----------
 * Collapsible sections. One item = .accordion (a .accordion-summary trigger +
 * a .accordion-details collapsible region). Stack items in an .accordion-group;
 * the group's border modifier controls the horizontal rules:
 *   all borders (default — no class) · .borders-middle (only between) · .borders-none.
 *   <div class="accordion-group">
 *     <div class="accordion is-open">
 *       <button class="accordion-summary" type="button" aria-expanded="true">
 *         <span class="accordion-title">Title</span>
 *         <svg class="icon accordion-chevron"><use href="#i-chevron-down"/></svg>
 *       </button>
 *       <div class="accordion-details"><div class="accordion-content">…</div></div>
 *     </div>
 *   </div>
 * Toggling .is-open (+ aria-expanded) is handled by the delegated script.
 */
.accordion { background: var(--color-surface); }
.accordion-summary {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--spacing-3);
  padding: var(--spacing-3) var(--spacing-4);
  min-height: 48px;
  border: 0;
  background: transparent;
  cursor: pointer;
  text-align: left;
  font: var(--type-body-semibold);
  color: var(--color-text);
  transition: background var(--duration-fast) var(--ease);
}
.accordion-summary:hover { background: var(--color-bg); }
.accordion-summary:focus-visible { outline: 2px solid var(--color-border-focus); outline-offset: -2px; }
.accordion-title { min-width: 0; }
.accordion-chevron {
  flex-shrink: 0;
  color: var(--color-icon);
  transition: transform var(--duration-base) var(--ease);
}
.accordion.is-open .accordion-chevron { transform: rotate(180deg); }

/* Collapsible region — animate height via the grid-rows 0fr→1fr technique. */
.accordion-details {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows var(--duration-base) var(--ease);
}
.accordion.is-open .accordion-details { grid-template-rows: 1fr; }
.accordion-details > * { overflow: hidden; min-height: 0; }
.accordion-content {
  padding: 0 var(--spacing-4) var(--spacing-4);
  font: var(--type-body-sm);
  color: var(--color-text-muted);
}

/* Disabled */
.accordion.is-disabled .accordion-summary { color: var(--color-text-subtle); cursor: not-allowed; pointer-events: none; }
.accordion.is-disabled .accordion-chevron { color: var(--color-text-subtle); }

/* Group + border modifiers (default = all) */
.accordion-group { border-radius: var(--radius-md); overflow: hidden; }
.accordion-group .accordion { border-top: 1px solid var(--color-border); }
.accordion-group.borders-none .accordion { border-top: 0; }
.accordion-group.borders-middle .accordion:first-child { border-top: 0; }
.accordion-group:not(.borders-none):not(.borders-middle) { border: 1px solid var(--color-border); }
.accordion-group:not(.borders-none):not(.borders-middle) .accordion:first-child { border-top: 0; }

/* ---------- Alert ----------
 * Horizontal block with: icon · message · optional CTAs · optional close button.
 *
 *   <div class="alert alert-danger" role="alert">
 *     <svg class="icon alert-icon"><use href="#i-warning-octagon"/></svg>
 *     <p class="alert-message">Something went wrong.</p>
 *     <div class="alert-actions">              optional — drop if no CTAs
 *       <button class="btn btn-xs btn-primary">Retry</button>
 *       <button class="btn btn-xs btn-secondary">Dismiss</button>
 *     </div>
 *     <button class="alert-close" aria-label="Close"><svg class="icon"><use href="#i-x"/></svg></button>
 *   </div>
 *
 * Variants: .alert-danger · .alert-warning · .alert-success · .alert-info
 * Omit the .alert-close button for persistent alerts.
 */
.alert {
  display: flex;
  align-items: center;
  gap: var(--spacing-3);
  min-height: 56px;
  /* 12px vertical keeps the 24px-CTA variant within the 56px min-height
     (24 + 24 + 2px border = 50 < 56); single-line + multi-line still fit. */
  padding: var(--spacing-3) var(--spacing-4);
  border-radius: var(--radius-md);
  border: 1px solid transparent;
  background: var(--color-surface-muted);
  color: var(--color-text);
  font: var(--type-body-sm);
}
.alert-icon    { font-size: 16px; flex-shrink: 0; }
/* Tighter than body-sm's 20px leading: the loose line box let the glyphs ride
 * high above the centred icon. 1.35 hugs the text so it optically centres with
 * the 16px icon and the CTAs, and still wraps cleanly on multi-line alerts. */
.alert[hidden] { display: none; }
.alert-message { flex: 1; min-width: 0; margin: 0; line-height: 1.35; padding-top: 2px; }
.alert-actions { display: inline-flex; gap: var(--spacing-2); flex-shrink: 0; }
/* Dismiss button — styled by the icon-only ghost button component in the
 * markup (.btn.btn-icon-only.btn-ghost.btn-xs); this class only handles layout. */
.alert-close { flex-shrink: 0; }

/* Variants — soft tinted background + matching border in the variant hue. */
.alert-danger  { background: var(--color-danger-subtle);  border-color: color-mix(in srgb, var(--color-danger) 22%, transparent); }
.alert-danger  .alert-icon { color: var(--color-danger); }
.alert-warning { background: var(--color-warning-subtle); border-color: color-mix(in srgb, var(--color-warning) 32%, transparent); }
.alert-warning .alert-icon { color: var(--color-warning); }
.alert-success { background: var(--color-success-subtle); border-color: color-mix(in srgb, var(--color-success) 22%, transparent); }
.alert-success .alert-icon { color: var(--color-success); }
.alert-info    { background: var(--color-accent-subtle);  border-color: color-mix(in srgb, var(--color-accent) 22%, transparent); }
.alert-info    .alert-icon { color: var(--color-accent); }

/* ---------- Badge ----------
 * Status pill. Read-only as <span>; interactive (editable) as <button> —
 * picks up pointer cursor, hover dim, and focus ring automatically.
 * Optional parts compose inside any variant:
 *
 *   <span class="badge badge-success">Active</span>                          read-only
 *   <button class="badge badge-warning" type="button">Pending</button>       editable
 *   <span class="badge badge-info"><svg class="icon badge-icon"><use href="#i-info"/></svg>New</span>          icon left
 *   <span class="badge">Draft<button class="badge-remove" aria-label="Remove"><svg class="icon"><use href="#i-x"/></svg></button></span>   deletable
 */
.badge {
  display: inline-flex; align-items: center;
  gap: var(--spacing-1);
  font: var(--type-caption);
  padding: var(--spacing-1) var(--spacing-2);
  border-radius: var(--radius-full);
  /* Neutral: white fill on a gray-150 stroke — reads as a chip on any surface.
   * Variants below still follow the {hue}-subtle + {hue}-150 recipe. */
  background: var(--color-surface);
  color: var(--color-text-muted);
  border: 1px solid var(--color-gray-100);
}
.badge-success { background: var(--color-success-subtle); color: var(--color-green-700); border-color: var(--color-green-150); }
.badge-warning { background: var(--color-warning-subtle); color: var(--color-yellow-700); border-color: var(--color-yellow-150); }
.badge-danger  { background: var(--color-danger-subtle);  color: var(--color-danger); border-color: var(--color-red-150); }
.badge-info    { background: var(--color-info-subtle);    color: var(--color-blue-500); border-color: var(--color-blue-150); }

/* Editable — same pill rendered as a <button>. Deletable pills (those that
 * contain a .badge-remove) get the same hover so all interactive pills react. */
button.badge,
.badge:has(.badge-remove) {
  cursor: pointer;
  transition: filter var(--duration-fast) var(--ease);
}
button.badge:hover,
.badge:has(.badge-remove):hover { filter: brightness(0.96); }
button.badge:focus-visible {
  outline: 2px solid var(--color-border-focus);
  outline-offset: 1px;
}

/* Leading icon — <svg class="icon"><use href="#i-{slug}"/></svg> */
.badge-icon { width: 1em; height: 1em; flex-shrink: 0; }

/* Trailing remove × — clicking deletes the pill (delegated handler) */
.badge-remove {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 14px;
  height: 14px;
  margin-right: -2px;
  border: 0;
  padding: 0;
  background: transparent;
  color: inherit;
  cursor: pointer; font: inherit;
  border-radius: var(--radius-full);
  opacity: 0.65;
  transition: opacity var(--duration-fast) var(--ease),
              background var(--duration-fast) var(--ease);
}
.badge-remove:hover { opacity: 1; background: color-mix(in srgb, currentColor 16%, transparent); }
.badge-remove svg { font-size: 10px; }

/* ---------- Tag ----------
 * Status marker — distinct from .badge (soft pill). Two styles share one color hook (--tag-color):
 *   <span class="tag tag-positive">Label</span>           → solid filled chip + white text
 *   <span class="tag tag-indicator tag-positive">Label</span>  → colored dot + text
 */
.tag {
  --tag-color: var(--color-graphite-900);
  --tag-text:  var(--color-white);
  display: inline-flex;
  align-items: center;
  gap: var(--spacing-1);
  height: 16px;
  padding: 0 var(--spacing-2);
  border: 0;                    /* reset native button border when a tag is a <button> */
  border-radius: var(--radius-sm);
  font: var(--font-weight-semibold) var(--text-2xs)/1 var(--font-sans);
  background: var(--tag-color);
  color: var(--tag-text);
}

/* Status colors — drive both solid bg and indicator dot via --tag-color */
.tag-positive   { --tag-color: var(--color-success); }
.tag-negative   { --tag-color: var(--color-danger); }
.tag-warning    { --tag-color: var(--color-warning);          --tag-text: var(--color-graphite-900); }
.tag-dark       { --tag-color: var(--color-graphite-900); }
.tag-blue-light { --tag-color: var(--color-blue-400); }
.tag-blue       { --tag-color: var(--color-blue-500); }
.tag-blue-dark  { --tag-color: var(--color-blue-700); }
.tag-light      { --tag-color: var(--color-gray-200);    --tag-text: var(--color-text); }

/* Solid tags are interactive (click swaps status via a dropdown) — subtle
 * hover dim signals it. Indicator style has its own hover below. */
.tag:not(.tag-indicator) {
  cursor: pointer;
  transition: filter var(--duration-fast) var(--ease);
}
.tag:not(.tag-indicator):hover { filter: brightness(0.92); }

/* Indicator style — colored dot + text, ghost-button hover affordance */
.tag-indicator {
  background: transparent;
  color: var(--color-text);
  padding: var(--spacing-1) var(--spacing-2);
  height: auto;
  gap: var(--spacing-2);
  font-weight: var(--font-weight-regular);
  cursor: pointer;
  transition: background var(--duration-fast) var(--ease);
}
.tag-indicator:hover { background: var(--color-surface-muted); }
.tag-indicator::before {
  content: '';
  width: 8px;
  height: 8px;
  border-radius: var(--radius-full);
  background: var(--tag-color);
  flex-shrink: 0;
}

/* ---------- Count badge ----------
 * Circular numeric indicator (notification dot with a count).
 * Variants: primary (filled), secondary (outlined). Sizes: sm/md/lg → 12/16/20px.
 */
.count-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 16px;
  height: 16px;
  padding: 0 var(--spacing-1);
  border-radius: var(--radius-full);
  background: var(--color-danger);
  color: var(--color-white);
  font: var(--font-weight-semibold) 10px/1 var(--font-sans);
  border: 1px solid transparent;
  box-sizing: border-box;
}
.count-badge-sm {
  min-width: 12px;
  height: 12px;
  font-size: 9px;
  padding: 0 3px;
}
.count-badge-lg {
  min-width: 20px;
  height: 20px;
  font-size: var(--text-2xs);
  padding: 0 5px;
}
.count-badge-secondary {
  background: var(--color-surface);
  color: var(--color-graphite-700);
  border-color: var(--color-border-strong);
}

/* ---------- Avatar ----------
 * Squarish identity badge (4px corner radius). Three content types share
 * the same root — the markup inside decides which renders:
 *
 *   Photo:     <span class="avatar avatar-md"><img src="…" alt="Jane"></span>
 *   Initials:  <span class="avatar avatar-md">JD</span>
 *   Team/co:   <span class="avatar avatar-md avatar-team"><svg class="icon"><use href="#i-buildings"/></svg></span>
 *
 * Sizes (default = avatar-md / 32px):
 *   .avatar-xs   16px
 *   .avatar-sm   24px
 *   .avatar-md   32px (default)
 *   .avatar-lg   40px
 *   .avatar-xl   80px
 *   .avatar-2xl 120px
 *
 * Interactive: render as <button> or <a> instead of <span> — picks up
 * pointer cursor, hover dim and focus-visible ring automatically.
 */
.avatar {
  --avatar-size: 32px;
  --avatar-text: var(--text-sm);
  --avatar-icon: 16px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: var(--avatar-size);
  height: var(--avatar-size);
  border-radius: 0;
  /* Chamfered bottom-left corner (Figma Avatar Core) — a 45° cut sized at 25%
   * of the square, so it scales with every avatar size. */
  clip-path: polygon(0 0, 100% 0, 100% 100%, 25% 100%, 0 75%);
  background: var(--color-surface-muted);
  color: var(--color-text-muted);
  font: var(--font-weight-semibold) var(--avatar-text)/1 var(--font-sans);
  text-transform: uppercase;
  flex-shrink: 0;
  overflow: hidden;
  user-select: none;
}

.avatar-xs  { --avatar-size: 16px;  --avatar-text: var(--text-2xs); --avatar-icon: 10px; }
.avatar-sm  { --avatar-size: 24px;  --avatar-text: var(--text-xxs);  --avatar-icon: 14px; }
.avatar-md  { --avatar-size: 32px;  --avatar-text: var(--text-sm);  --avatar-icon: 16px; }
.avatar-lg  { --avatar-size: 40px;  --avatar-text: var(--text-md);--avatar-icon: 20px; }
.avatar-xl  { --avatar-size: 80px;  --avatar-text: var(--text-2xl); --avatar-icon: 36px; }
.avatar-2xl { --avatar-size: 120px; --avatar-text: 42px;               --avatar-icon: 56px; }

/* Photo content — image fills the avatar */
.avatar > img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* Icon content — <svg class="icon">, sized by --avatar-icon */
.avatar > svg { font-size: var(--avatar-icon); }
.avatar > svg { width: var(--avatar-icon); height: var(--avatar-icon); }

/* Team / company variant — same neutral fill as initials; icon is the
 * differentiator from people avatars. */
.avatar-team {
  background: var(--color-surface-muted);
  color: var(--color-text-muted);
}

/* Interactive — applies when rendered as <button> or <a> */
button.avatar,
a.avatar {
  border: 0;
  padding: 0;
  cursor: pointer;
  text-decoration: none;
  transition: filter var(--duration-fast) var(--ease),
              box-shadow var(--duration-fast) var(--ease);
}
button.avatar:hover,
a.avatar:hover { filter: brightness(0.95); }
button.avatar:focus-visible,
a.avatar:focus-visible {
  outline: 2px solid var(--color-border-focus);
  outline-offset: 2px;
}

/* ---------- Switch ----------
 * Usage:
 *   <label class="switch">
 *     <input type="checkbox" class="switch-input" />
 *     <span class="switch-track"></span>
 *   </label>
 */
.switch {
  display: inline-flex;
  position: relative;
  width: 40px;
  height: 24px;
  cursor: pointer;
  flex-shrink: 0;
}
.switch-input {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  margin: 0;
  opacity: 0;
  cursor: inherit;
}
.switch-track {
  position: relative;
  width: 100%;
  height: 100%;
  background: var(--color-border-strong);
  border-radius: var(--radius-full);
  transition: background var(--duration-base) var(--ease),
              box-shadow var(--duration-fast) var(--ease);
}
.switch-track::after {
  content: '';
  position: absolute;
  top: 4px;
  left: 4px;
  width: 16px;
  height: 16px;
  background: var(--color-white);
  border-radius: var(--radius-full);
  box-shadow: var(--shadow-1);
  transition: transform var(--duration-base) var(--ease);
}
.switch-input:checked ~ .switch-track             { background: var(--color-accent); }
.switch-input:checked ~ .switch-track::after      { transform: translateX(16px); }
.switch-input:focus-visible ~ .switch-track       { box-shadow: 0 0 0 3px var(--color-accent-subtle); }
.switch-input:disabled                            { cursor: not-allowed; }
.switch:has(.switch-input:disabled)               { cursor: not-allowed; }
.switch-input:disabled ~ .switch-track            { opacity: 0.5; }

/* ---------- Checkbox ----------
 * Usage:
 *   <label class="checkbox">
 *     <input type="checkbox" class="checkbox-input" />
 *     <span class="checkbox-box">
