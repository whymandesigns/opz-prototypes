<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Operationalize web app</title>
  <style>
    /* === tokens.css === */
/* Icarus Design Tokens
 * Single source of truth for color, type, space, radii, shadows, motion.
 * Pierce shadow DOM via CSS custom properties — components read these directly.
 */

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

:root {
  /* ================================================================
     COLOR — PRIMITIVE PALETTE (from Figma: Mobile-App / Color Palette)
     ================================================================ */

  /* Neutral */
  --ic-palette-white: #FFFFFF;
  --ic-palette-black: #000000;

  /* Gray */
  --ic-palette-gray-100: #FCFCFC;
  --ic-palette-gray-150: #F0F1F3;
  --ic-palette-gray-200: #E0E1E5;
  --ic-palette-gray-300: #CCCDD3;
  --ic-palette-gray-400: #B3B5BC;
  --ic-palette-gray-500: #999BA4;
  --ic-palette-gray-600: #84888E;
  --ic-palette-gray-700: #5F636A;
  --ic-palette-gray-800: #3D4149;
  --ic-palette-gray-900: #24272D;

  /* Zinc */
  --ic-palette-zinc-100: #D1D2D3;
  --ic-palette-zinc-200: #949597;
  --ic-palette-zinc-300: #636466;
  --ic-palette-zinc-400: #484A4C;
  --ic-palette-zinc-500: #343536;
  --ic-palette-zinc-600: #282829;
  --ic-palette-zinc-700: #1E1E1F;
  --ic-palette-zinc-800: #141415;
  --ic-palette-zinc-900: #0A0A0A;

  /* Graphite (Operationalize brand) */
  --ic-palette-graphite-100: #E0E3EA;
  --ic-palette-graphite-150: #CDD1DC;
  --ic-palette-graphite-200: #B3B9C8;
  --ic-palette-graphite-300: #8F96AA;
  --ic-palette-graphite-400: #6A7389;
  --ic-palette-graphite-500: #455065;
  --ic-palette-graphite-600: #3A4457;
  --ic-palette-graphite-700: #303A4A;
  --ic-palette-graphite-800: #262D3D;
  --ic-palette-graphite-900: #191E28;

  /* Red */
  --ic-palette-red-100: #FBEDF1;
  --ic-palette-red-150: #F5D8E0;
  --ic-palette-red-200: #F0B8C4;
  --ic-palette-red-300: #E5637D;
  --ic-palette-red-400: #DA3F62;
  --ic-palette-red-500: #D42551;
  --ic-palette-red-600: #A81D41;
  --ic-palette-red-700: #7D1530;
  --ic-palette-red-800: #5C0F24;
  --ic-palette-red-900: #3D0A18;

  /* Yellow */
  --ic-palette-yellow-100: #FFF5E3;
  --ic-palette-yellow-150: #F8E7C8;
  --ic-palette-yellow-200: #F2D9A6;
  --ic-palette-yellow-300: #EDCA7E;
  --ic-palette-yellow-400: #E9B340;
  --ic-palette-yellow-500: #E59C01;
  --ic-palette-yellow-600: #C08301;
  --ic-palette-yellow-700: #9A6A01;
  --ic-palette-yellow-800: #704D01;
  --ic-palette-yellow-900: #4A3301;

  /* Orange */
  --ic-palette-orange-100: #FFF0E6;
  --ic-palette-orange-150: #FFDFC7;
  --ic-palette-orange-200: #FFCBA3;
  --ic-palette-orange-300: #F5C07A;
  --ic-palette-orange-400: #F58E42;
  --ic-palette-orange-500: #F07018;
  --ic-palette-orange-600: #C05F0E;
  --ic-palette-orange-700: #964A0A;
  --ic-palette-orange-800: #6E3607;
  --ic-palette-orange-900: #482404;

  /* Green */
  --ic-palette-green-100: #EAFBF5;
  --ic-palette-green-150: #D7F3E9;
  --ic-palette-green-200: #A8E6D0;
  --ic-palette-green-300: #66D4AB;
  --ic-palette-green-400: #33D097;
  --ic-palette-green-500: #00CC83;
  --ic-palette-green-600: #03B080;
  --ic-palette-green-700: #05947C;
  --ic-palette-green-800: #046B5A;
  --ic-palette-green-900: #034539;

  /* Cyan — single shade. Pending removal: components currently using
     cyan-500 (.tag-blue-light, .badge-info text, --color-info) will
     migrate to a blue shade in the next pass, after which the ramp goes
     away entirely. */
  --ic-palette-cyan-500: #25A9EF;

  /* Blue */
  --ic-palette-blue-100: #EDF1FD;
  --ic-palette-blue-150: #D5DEFA;
  --ic-palette-blue-200: #B0C1F5;
  --ic-palette-blue-300: #7B9AEE;
  --ic-palette-blue-400: #4A6FE0;
  --ic-palette-blue-500: #204ECF;
  --ic-palette-blue-600: #183A9E;
  --ic-palette-blue-700: #0F256E;
  --ic-palette-blue-800: #0A1A50;
  --ic-palette-blue-900: #061035;

  /* Purple */
  --ic-palette-purple-100: #F1ECFD;
  --ic-palette-purple-150: #DFD3F9;
  --ic-palette-purple-200: #C9B5F4;
  --ic-palette-purple-300: #A47DE2;
  --ic-palette-purple-400: #8552D9;
  --ic-palette-purple-500: #6727CF;
  --ic-palette-purple-600: #5019A8;
  --ic-palette-purple-700: #3A1280;
  --ic-palette-purple-800: #280D5C;
  --ic-palette-purple-900: #1A0840;


  /* ---- Typography ---- */

  --ic-font-sans: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --ic-font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --ic-font-display: var(--ic-font-sans);

  /* Size scale — Figma spec */
  --ic-text-xxs:  0.6875rem;  /* 11px — Body Xxsmall */
  --ic-text-xs:   0.75rem;    /* 12px — Body Xsmall */
  --ic-text-sm:   0.8125rem;  /* 13px — Body Small */
  --ic-text-base: 0.875rem;   /* 14px — Body Medium, H4 */
  --ic-text-md:   1rem;       /* 16px — Body Large, H3 */
  --ic-text-lg:   1.125rem;   /* 18px — utility (avatar initials, card titles) */
  --ic-text-xl:   1.25rem;    /* 20px — H2 */
  --ic-text-2xl:  1.75rem;    /* 28px — H1 */

  /* Line heights — Figma spec (absolute, mirrors design intent) */
  --ic-lh-h1:       2.625rem;  /* 42px */
  --ic-lh-h2:       1.875rem;  /* 30px */
  --ic-lh-h3:       1.5rem;    /* 24px */
  --ic-lh-h4:       1.375rem;  /* 22px */
  --ic-lh-body-lg:  1.5rem;    /* 24px */
  --ic-lh-body-md:  1.375rem;  /* 22px */
  --ic-lh-body-sm:  1.25rem;   /* 20px */
  --ic-lh-body-xs:  1.125rem;  /* 18px */
  --ic-lh-body-xxs: 1rem;      /* 16px */

  --ic-leading-tight:   1.2;
  --ic-leading-normal:  1.5;
  --ic-leading-relaxed: 1.75;

  --ic-weight-regular:  400;
  --ic-weight-medium:   500;
  --ic-weight-semibold: 600;
  --ic-weight-bold:     700;

  /* ---- Spacing (4px base) ---- */
  --ic-space-0: 0;
  --ic-space-1: 4px;
  --ic-space-2: 8px;
  --ic-space-3: 12px;
  --ic-space-4: 16px;
  --ic-space-5: 24px;
  --ic-space-6: 32px;
  --ic-space-7: 40px;
  --ic-space-8: 48px;
  --ic-space-10: 64px;
  --ic-space-12: 80px;
  --ic-space-16: 128px;

  /* ---- Radii ---- */
  --ic-radius-none: 0;
  --ic-radius-sm: 4px;
  --ic-radius-md: 8px;
  --ic-radius-lg: 12px;
  --ic-radius-xl: 16px;
  --ic-radius-2xl: 24px;
  --ic-radius-full: 9999px;

  /* Numeric aliases — reach for these by px value */
  --ic-radius-0:  var(--ic-radius-none);
  --ic-radius-4:  var(--ic-radius-sm);
  --ic-radius-8:  var(--ic-radius-md);
  --ic-radius-12: var(--ic-radius-lg);

  /* ---- Shadows ---- */
  --ic-shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.04);
  --ic-shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.06);
  --ic-shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
  --ic-shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.10);
  --ic-shadow-xl: 0 24px 56px rgba(0, 0, 0, 0.14);

  /* ---- Z-index scale ---- */
  --ic-z-base: 0;
  --ic-z-dropdown: 100;
  --ic-z-sticky: 200;
  --ic-z-overlay: 800;
  --ic-z-modal: 900;
  --ic-z-toast: 1000;

  /* ---- Motion ---- */
  --ic-ease: cubic-bezier(0.2, 0, 0, 1);
  --ic-ease-out: cubic-bezier(0, 0, 0.2, 1);
  --ic-ease-in: cubic-bezier(0.4, 0, 1, 1);
  --ic-duration-fast: 120ms;
  --ic-duration-base: 200ms;
  --ic-duration-slow: 320ms;

  /* ---- Layout ---- */
  --ic-container-sm: 640px;
  --ic-container-md: 768px;
  --ic-container-lg: 1024px;
  --ic-container-xl: 1280px;
}

    /* === semantic.css === */
/* semantic.css — intent-named aliases over Icarus primitives.
 * Prototypes and components reference these, NOT raw palette tokens.
 * Swap a brand or theme by re-pointing aliases here — primitives never change.
 */

:root {
  /* ---- Surfaces ---- */
  --color-bg:             var(--ic-palette-gray-100);   /* page background */
  --color-surface:        var(--ic-palette-white);      /* cards, panels */
  --color-surface-muted:  var(--ic-palette-gray-150);   /* hover, subtle fills */
  --color-surface-sunken: var(--ic-palette-gray-200);   /* wells, inset areas */

  /* ---- Borders ---- */
  --color-border:         var(--ic-palette-gray-200);
  --color-border-strong:  var(--ic-palette-gray-300);
  --color-border-focus:   var(--ic-palette-blue-500);

  /* ---- Text ---- */
  --color-text:           var(--ic-palette-graphite-900);
  --color-text-muted:     var(--ic-palette-gray-700);
  --color-text-subtle:    var(--ic-palette-gray-500);
  --color-text-inverse:   var(--ic-palette-white);
  --color-text-link:      var(--ic-palette-blue-500);

  /* ---- Brand / primary action ---- */
  --color-brand:          var(--ic-palette-green-500);
  --color-brand-hover:    var(--ic-palette-green-600);
  --color-brand-active:   var(--ic-palette-green-700);
  --color-brand-subtle:   var(--ic-palette-green-100);

  /* ---- Accent (interactive secondary, links) ---- */
  --color-accent:         var(--ic-palette-blue-500);
  --color-accent-hover:   var(--ic-palette-blue-600);
  --color-accent-subtle:  var(--ic-palette-blue-100);

  /* ---- Status ---- */
  --color-success:        var(--ic-palette-green-500);
  --color-success-subtle: var(--ic-palette-green-100);
  --color-warning:        var(--ic-palette-yellow-500);
  --color-warning-subtle: var(--ic-palette-yellow-100);
  --color-danger:         var(--ic-palette-red-500);
  --color-danger-hover:   var(--ic-palette-red-600);
  --color-danger-subtle:  var(--ic-palette-red-100);
  --color-info:           var(--ic-palette-cyan-500);
  /* --color-info-subtle is en route to blue. cyan-100 was retired in the
     palette cleanup; backed by blue-100 until --color-info itself moves
     to blue, at which point the cyan-500 reference above also goes. */
  --color-info-subtle:    var(--ic-palette-blue-100);

  /* ---- Overlays ---- */
  --color-overlay:        rgba(38, 45, 61, 0.5); /* graphite-900 @ 50% — for modal scrims */

  /* ---- Type roles (size + line height paired) ---- */
  --type-h1: var(--ic-weight-semibold) var(--ic-text-2xl)/var(--ic-lh-h1) var(--ic-font-sans);
  --type-h2: var(--ic-weight-semibold) var(--ic-text-xl)/var(--ic-lh-h2) var(--ic-font-sans);
  --type-h3: var(--ic-weight-semibold) var(--ic-text-md)/var(--ic-lh-h3) var(--ic-font-sans);
  --type-h4: var(--ic-weight-semibold) var(--ic-text-base)/var(--ic-lh-h4) var(--ic-font-sans);
  --type-body-lg:  var(--ic-weight-regular) var(--ic-text-md)/var(--ic-lh-body-lg) var(--ic-font-sans);
  --type-body:     var(--ic-weight-regular) var(--ic-text-base)/var(--ic-lh-body-md) var(--ic-font-sans);
  --type-body-sm:  var(--ic-weight-regular) var(--ic-text-sm)/var(--ic-lh-body-sm) var(--ic-font-sans);
  --type-caption:  var(--ic-weight-medium) var(--ic-text-xs)/var(--ic-lh-body-xs) var(--ic-font-sans);
  --type-mono:     var(--ic-weight-regular) var(--ic-text-sm)/var(--ic-lh-body-sm) var(--ic-font-mono);
}

/* ---- Dark theme override ---- */
[data-theme="dark"] {
  --color-bg:             var(--ic-palette-zinc-900);
  --color-surface:        var(--ic-palette-zinc-800);
  --color-surface-muted:  var(--ic-palette-zinc-700);
  --color-surface-sunken: var(--ic-palette-zinc-900);

  --color-border:         var(--ic-palette-zinc-600);
  --color-border-strong:  var(--ic-palette-zinc-500);

  --color-text:           var(--ic-palette-gray-100);
  --color-text-muted:     var(--ic-palette-gray-400);
  --color-text-subtle:    var(--ic-palette-gray-600);
  --color-text-inverse:   var(--ic-palette-zinc-900);

  --color-brand:          var(--ic-palette-green-400);
  --color-brand-hover:    var(--ic-palette-green-300);
  --color-brand-active:   var(--ic-palette-green-200);
  --color-brand-subtle:   var(--ic-palette-green-800);
}

/* ---- Reset + base ---- */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--color-bg);
  color: var(--color-text);
  font: var(--type-body);
  -webkit-font-smoothing: antialiased;
}
.page {
  max-width: var(--ic-container-lg);
  margin: 0 auto;
  padding: var(--ic-space-8) var(--ic-space-5);
}

    /* === components.css === */
/* components.css — built on semantic aliases (semantic.css), never raw palette. */

/* ---------- Button ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--ic-space-2);
  height: 32px; /* default — sm */
  padding: 0 var(--ic-space-3);
  font: var(--ic-weight-medium) var(--ic-text-sm)/1 var(--ic-font-sans);
  border-radius: var(--ic-radius-sm);
  border: 1px solid transparent;
  cursor: pointer;
  transition: background var(--ic-duration-fast) var(--ic-ease),
              transform var(--ic-duration-fast) var(--ic-ease),
              box-shadow var(--ic-duration-fast) var(--ic-ease);
}
.btn-xs {
  height: 24px;
  padding: 0 var(--ic-space-2);
  font: var(--ic-weight-medium) var(--ic-text-xs)/1 var(--ic-font-sans);
}

/* Icons inside buttons. Place an <svg class="btn-icon" /> as a child. */
.btn-icon { width: 14px; height: 14px; flex-shrink: 0; }
.btn-xs .btn-icon { width: 12px; height: 12px; }

/* Icon-only button (no text) — fully rounded "pill" shape. */
.btn-icon-only            { width: 32px; padding: 0; border-radius: var(--ic-radius-full); }
.btn-icon-only.btn-xs     { width: 24px; }

/* Ghost as icon-only: muted graphite icon on transparent bg, gray-150
 * surface on hover. Distinct from text `.btn-ghost` which uses brand-blue;
 * icon-only ghosts (kebabs, X buttons) stay quiet and neutral. */
.btn-icon-only.btn-ghost {
  color: var(--ic-palette-graphite-500);
}
.btn-icon-only.btn-ghost:hover {
  background: var(--color-surface-muted);
  color: var(--ic-palette-graphite-500);
}

/* Danger as icon-only: red icon on transparent bg, no fill. Reads as a
 * destructive affordance without screaming "delete" in red until clicked. */
.btn-icon-only.btn-danger {
  background: transparent;
  color: var(--color-danger);
}
.btn-icon-only.btn-danger:hover  { background: var(--color-danger-subtle); }
.btn-icon-only.btn-danger:active { background: var(--color-danger-subtle); }
.btn:active { transform: translateY(1px); }
.btn:focus-visible {
  outline: 2px solid var(--color-border-focus);
  outline-offset: 2px;
}
.btn-primary {
  background: var(--color-brand);
  color: var(--color-text-inverse);
}
.btn-primary:hover  { background: var(--color-brand-hover); }
.btn-primary:active { background: var(--color-brand-active); }

.btn-secondary {
  background: var(--color-surface);
  color: var(--color-text);
  border-color: var(--color-border);
}
.btn-secondary:hover { background: var(--color-surface-muted); }

.btn-ghost {
  background: transparent;
  color: var(--color-accent);
}
/* Hover keeps the background transparent (clickable area unchanged) and
 * signals interactivity with an underline instead. */
.btn-ghost:hover { text-decoration: underline; text-underline-offset: 3px; }

.btn-danger {
  background: var(--color-danger);
  color: var(--color-text-inverse);
}
.btn-danger:hover  { background: var(--color-danger-hover); }

/* ---------- Field + Input ---------- */
.field { display: flex; flex-direction: column; gap: var(--ic-space-2); }
.field-label {
  font: var(--type-caption);
  color: var(--color-text-muted);
}
.field-hint {
  font: var(--type-caption);
  color: var(--color-text-subtle);
}
.field-hint.is-error { color: var(--color-danger); }
.input {
  height: 32px; /* default — sm */
  padding: 0 var(--ic-space-3);
  font: var(--type-body-sm);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--ic-radius-sm);
  color: var(--color-text);
  transition: border-color var(--ic-duration-fast) var(--ic-ease),
              box-shadow var(--ic-duration-fast) var(--ic-ease);
}
.input-xs {
  height: 24px;
  padding: 0 var(--ic-space-2);
  font: var(--ic-weight-regular) var(--ic-text-xs)/var(--ic-lh-body-sm) var(--ic-font-sans);
}

/* Input with an inset icon (left or right). The icon is decorative
 * (pointer-events pass through to the field); the input gets extra padding
 * on that side to make room.
 *
 *   <div class="input-icon input-icon-left">
 *     <i class="ph ph-calendar-blank input-icon-glyph"></i>
 *     <input class="input" type="text" />
 *   </div>
 *   <div class="input-icon input-icon-right">
 *     <input class="input" type="search" />
 *     <i class="ph ph-magnifying-glass input-icon-glyph"></i>
 *   </div>
 */
.input-icon { position: relative; }
.input-icon > .input { display: block; width: 100%; }
.input-icon-glyph {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  font-size: 16px;
  line-height: 1;
  color: var(--color-text-muted);
  pointer-events: none;
}
.input-icon-left  .input-icon-glyph { left: var(--ic-space-3); }
.input-icon-left  .input { padding-left: calc(var(--ic-space-3) + 16px + var(--ic-space-2)); }
.input-icon-right .input-icon-glyph { right: var(--ic-space-3); }
.input-icon-right .input { padding-right: calc(var(--ic-space-3) + 16px + var(--ic-space-2)); }
/* Match glyph inset to the tighter padding on the xs size */
.input-icon-left  .input-xs.input,
.input-icon-left  .input-xs { padding-left: calc(var(--ic-space-2) + 16px + var(--ic-space-1)); }
.input-icon-left:has(.input-xs) .input-icon-glyph { left: var(--ic-space-2); }
.input-icon-right .input-xs { padding-right: calc(var(--ic-space-2) + 16px + var(--ic-space-1)); }
.input-icon-right:has(.input-xs) .input-icon-glyph { right: var(--ic-space-2); }

/* Textarea variant of .input */
textarea.input {
  height: auto;
  min-height: 80px;
  padding: var(--ic-space-3) var(--ic-space-4);
  line-height: 1.5;
  resize: vertical;
}

/* Right-aligned hint — used for character counters */
.field-hint-end {
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.field-hint-row {
  display: flex;
  justify-content: space-between;
  gap: var(--ic-space-3);
}

/* ---------- Select (dropdown input) ----------
 * Trigger styled like .input, paired with a .dropdown-menu via JS toggle.
 *
 *   <div class="input-select">
 *     <button class="input-select-trigger" aria-expanded="false">
 *       <span class="input-select-value input-select-placeholder">Choose…</span>
 *       <svg class="btn-icon"><use href="#i-chevron-down"/></svg>
 *     </button>
 *     <div class="dropdown-menu" hidden>...</div>
 *   </div>
 */
.input-select {
  position: relative;
  width: 100%;
}
.input-select-trigger {
  display: inline-flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--ic-space-2);
  width: 100%;
  height: 32px;
  padding: 0 var(--ic-space-2) 0 var(--ic-space-3);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--ic-radius-sm);
  font: var(--type-body-sm);
  color: var(--color-text);
  text-align: left;
  cursor: pointer;
  transition: border-color var(--ic-duration-fast) var(--ic-ease),
              box-shadow var(--ic-duration-fast) var(--ic-ease);
}
.input-select-trigger:hover               { border-color: var(--color-border-strong); }
.input-select-trigger:focus-visible,
.input-select-trigger[aria-expanded="true"] {
  outline: none;
  border-color: var(--color-border-focus);
  box-shadow: 0 0 0 3px var(--color-accent-subtle);
}
.input-select-trigger > .btn-icon {
  color: var(--color-text-muted);
  transition: transform var(--ic-duration-fast) var(--ic-ease);
}
.input-select-trigger[aria-expanded="true"] > .btn-icon { transform: rotate(180deg); }
.input-select-placeholder { color: var(--color-text-subtle); }
.input-select-value {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.input-select .dropdown-menu {
  position: absolute;
  top: calc(100% + var(--ic-space-1));
  left: 0;
  right: 0;
  z-index: var(--ic-z-dropdown);
}
.input-select .dropdown-menu[hidden] { display: none; }

/* ---------- Tag input ----------
 * Container behaves like .input; chips + a free-text input live inside.
 * On Enter the typed text becomes a chip; Backspace on empty removes the last chip.
 *
 *   <div class="input-tags">
 *     <span class="dropdown-chip">React<button class="dropdown-chip-remove">…</button></span>
 *     <input class="input-tags-input" placeholder="Add tag…" />
 *   </div>
 */
.input-tags {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--ic-space-1);
  min-height: 32px;
  padding: 2px var(--ic-space-2);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--ic-radius-sm);
  cursor: text;
  transition: border-color var(--ic-duration-fast) var(--ic-ease),
              box-shadow var(--ic-duration-fast) var(--ic-ease);
}
/* Chips inside the tag input shrink to fit the 32px row */
.input-tags .chip { height: 24px; }
.input-tags:focus-within {
  border-color: var(--color-border-focus);
  box-shadow: 0 0 0 3px var(--color-accent-subtle);
}
.input-tags-input {
  flex: 1;
  min-width: 80px;
  height: 24px;
  padding: 0 var(--ic-space-1);
  border: 0;
  outline: 0;
  background: transparent;
  font: var(--type-body-sm);
  color: var(--color-text);
}
.input-tags-input::placeholder { color: var(--color-text-subtle); }

/* ---------- Rich text editor ----------
 * Toolbar + contenteditable body. Compose with .field for label + counter + error.
 *
 *   <div class="editor">
 *     <div class="editor-toolbar">…buttons…</div>
 *     <div class="editor-content" contenteditable="true" data-placeholder="…"></div>
 *   </div>
 */
.editor {
  display: flex;
  flex-direction: column;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--ic-radius-sm);
  transition: border-color var(--ic-duration-fast) var(--ic-ease),
              box-shadow var(--ic-duration-fast) var(--ic-ease);
}
.editor:focus-within {
  border-color: var(--color-border-focus);
  box-shadow: 0 0 0 3px var(--color-accent-subtle);
}
.editor.is-error                { border-color: var(--color-danger); }
.editor.is-error:focus-within   { box-shadow: 0 0 0 3px var(--color-danger-subtle); }
.editor.is-disabled             { opacity: 0.5; pointer-events: none; }

.editor-toolbar {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 2px;
  padding: var(--ic-space-1) var(--ic-space-2);
  border-bottom: 1px solid var(--color-border);
}
.editor-toolbar-divider {
  width: 1px;
  height: 16px;
  background: var(--color-border);
  margin: 0 var(--ic-space-1);
}

/* Toolbar select (e.g. "Normal Text" heading picker) — slimmer than .input-select */
.editor-toolbar-select { width: auto; }
.editor-toolbar-select .input-select-trigger {
  height: 32px;
  min-width: 120px;
  padding: 0 var(--ic-space-2);
  border: 0;
  background: transparent;
  font: var(--type-body-sm);
  gap: var(--ic-space-2);
}
.editor-toolbar-select .input-select-trigger:hover {
  background: var(--color-surface-muted);
}
.editor-toolbar-select .input-select-trigger:focus-visible,
.editor-toolbar-select .input-select-trigger[aria-expanded="true"] {
  box-shadow: none;
  background: var(--color-surface-muted);
}

.editor-toolbar-btn {
  width: 32px;
  height: 32px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  border: 0;
  background: transparent;
  border-radius: var(--ic-radius-sm);
  color: var(--color-text);
  cursor: pointer;
  transition: background var(--ic-duration-fast) var(--ic-ease),
              color var(--ic-duration-fast) var(--ic-ease);
}
.editor-toolbar-btn:hover               { background: var(--color-surface-muted); }
.editor-toolbar-btn.is-active           { background: var(--color-surface-muted); color: var(--color-brand); }

.editor-content {
  min-height: 160px;
  padding: var(--ic-space-4);
  font: var(--type-body);
  color: var(--color-text);
  outline: 0;
  line-height: 1.5;
  overflow-y: auto;
}
.editor-content:empty::before {
  content: attr(data-placeholder);
  color: var(--color-text-subtle);
  pointer-events: none;
}
.editor-content > :first-child { margin-top: 0; }
.editor-content > :last-child  { margin-bottom: 0; }
.editor-content ul,
.editor-content ol {
  margin: var(--ic-space-2) 0;
  padding-left: var(--ic-space-5);
}
.editor-content code {
  font: var(--type-mono);
  background: var(--color-surface-muted);
  padding: 1px 4px;
  border-radius: var(--ic-radius-sm);
}
.editor-content a { color: var(--color-text-link); }

/* Footer pattern — char count + validation tick, lives in .field-hint-row */
.editor-counter {
  display: inline-flex;
  align-items: center;
  gap: var(--ic-space-1);
}
.editor-counter-ok {
  width: 14px;
  height: 14px;
  color: var(--color-success);
}
.input::placeholder { color: var(--color-text-subtle); }
.input:focus {
  outline: none;
  border-color: var(--color-border-focus);
  box-shadow: 0 0 0 3px var(--color-accent-subtle);
}

/* ---------- Card ---------- */
.card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--ic-radius-lg);
  padding: var(--ic-space-5);
}
.card-title { font: var(--type-h3); margin: 0 0 var(--ic-space-2); color: var(--color-text); }
.card-body  { font: var(--type-body); color: var(--color-text-muted); margin: 0; }

/* ---------- Table ----------
 * Base: semantic <table>/<thead>/<tbody>/<tr>/<th>/<td>. Left-aligned, no grid lines,
 * subtle bottom border on the header row.
 *
 *   <table class="table table-wide">
 *     <thead><tr>
 *       <th><button class="th-sort">Name<svg .../></button></th>
 *       <th>Status</th>
 *     </tr></thead>
 *     <tbody>
 *       <tr><td>…</td><td>…</td></tr>
 *     </tbody>
 *   </table>
 *
 * Modifier:
 *   .table-wide — tall rows (80px) + zebra striping; for content-heavy lists.
 *
 * Cell-content helpers (compose inside <td>):
 *   .cell-title  — title + small subtype label
 *   .cell-user   — avatar + name + role
 *   .cell-meta   — small title + caption row (optional icon)
 *   .cell-actions— right-aligned action buttons (kebab etc.)
 */
.table {
  width: 100%;
  border-collapse: collapse;
  font: var(--type-body-sm);
  color: var(--color-text);
  text-align: left;
}
.table thead th {
  padding: var(--ic-space-3) var(--ic-space-4);
  font: var(--ic-weight-regular) var(--ic-text-sm)/1 var(--ic-font-sans);
  color: var(--color-text-muted);
  border-bottom: 1px solid var(--color-border);
  vertical-align: middle;
  white-space: nowrap;
}
.table tbody td {
  padding: var(--ic-space-3) var(--ic-space-4);
  vertical-align: middle;
  white-space: nowrap;
}

/* Wide variant — generous row height with zebra striping. */
.table-wide tbody td { padding: var(--ic-space-5) var(--ic-space-4); }
.table-wide tbody tr:nth-child(even) td { background: var(--color-surface-muted); }

/* Scroll container — wraps a .table to enable both axes of scrolling.
 * Sticky header keeps column labels visible while scrolling vertically. */
.table-scroll {
  overflow: auto;
  max-height: 480px;
  border: 1px solid var(--color-border);
  border-radius: var(--ic-radius-sm);
}
.table-scroll .table thead th {
  position: sticky;
  top: 0;
  background: var(--color-surface);
  z-index: 1;
}

/* Sortable header — button-styled span with an arrow icon */
.th-sort {
  display: inline-flex;
  align-items: center;
  gap: var(--ic-space-1);
  background: transparent;
  border: 0;
  padding: 0;
  cursor: pointer;
  font: inherit;
  color: inherit;
}
.th-sort .ph { font-size: 12px; color: var(--color-text-subtle); }
.th-sort:hover { color: var(--color-text); }
.th-sort:hover .ph { color: var(--color-text-muted); }

/* Right-aligned utility for action cells */
.cell-actions { display: flex; align-items: center; justify-content: flex-end; gap: var(--ic-space-2); }

/* Title + sub-label stack — bold title, small muted type below.
 * Wrap with .cell-title-row to add an expand/collapse toggle for tree tables. */
.cell-title { display: flex; flex-direction: column; gap: var(--ic-space-1); min-width: 0; }
.cell-title-text { font: var(--ic-weight-medium) var(--ic-text-base)/1.3 var(--ic-font-sans); color: var(--color-text); }
.cell-title-sub  { font: var(--ic-weight-regular) var(--ic-text-xs)/1.2 var(--ic-font-sans); color: var(--color-text-muted); }
.cell-title-row  { display: flex; align-items: center; gap: var(--ic-space-2); }

/* Nested row hierarchy — drive indentation off data-level on the <tr>. */
.table tbody tr[data-level="1"] .cell-title-row { padding-left: var(--ic-space-5); }
.table tbody tr[data-level="2"] .cell-title-row { padding-left: calc(var(--ic-space-5) * 2); }

/* Expand/collapse caret + a same-sized spacer for leaf rows so titles align across levels. */
.row-toggle {
  width: 20px;
  height: 20px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 0;
  padding: 0;
  cursor: pointer;
  color: var(--color-text-muted);
  border-radius: var(--ic-radius-sm);
  flex-shrink: 0;
  transition: background var(--ic-duration-fast) var(--ic-ease), color var(--ic-duration-fast) var(--ic-ease);
}
.row-toggle:hover { background: var(--color-surface-muted); color: var(--color-text); }
.row-toggle .ph { font-size: 14px; transition: transform var(--ic-duration-fast) var(--ic-ease); }
.row-toggle[aria-expanded="true"] .ph { transform: rotate(90deg); }
.row-toggle-spacer { display: inline-block; width: 20px; height: 20px; flex-shrink: 0; }

/* User cell — circular avatar + name + role */
.cell-user { display: flex; align-items: center; gap: var(--ic-space-3); min-width: 0; }
.cell-avatar {
  width: 32px;
  height: 32px;
  border-radius: var(--ic-radius-full);
  background: var(--color-surface-muted);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font: var(--ic-weight-medium) var(--ic-text-xs)/1 var(--ic-font-sans);
  color: var(--color-text-muted);
  flex-shrink: 0;
  text-transform: uppercase;
}
.cell-user-meta { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.cell-user-name { font: var(--ic-weight-medium) var(--ic-text-sm)/1.2 var(--ic-font-sans); color: var(--color-text); }
.cell-user-role { font: var(--type-caption); color: var(--color-text-muted); }

/* Meta cell — body text with optional caption row underneath */
.cell-meta { display: flex; flex-direction: column; gap: var(--ic-space-1); }
.cell-meta-title { font: var(--type-body-sm); color: var(--color-text); }
.cell-meta-sub   { font: var(--type-caption); color: var(--color-text-muted); display: inline-flex; align-items: center; gap: var(--ic-space-1); }
.cell-meta-sub .ph { font-size: 12px; color: var(--color-text-subtle); }

/* Health dot — small colored circle used inline in a cell */
.cell-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: var(--ic-radius-full);
  background: var(--color-success);
}
.cell-dot.is-warning { background: var(--color-warning); }
.cell-dot.is-danger  { background: var(--color-danger); }

/* ---------- Alert ----------
 * Horizontal block with: icon · message · optional CTAs · optional close button.
 *
 *   <div class="alert alert-danger" role="alert">
 *     <i class="ph ph-warning-octagon alert-icon"></i>
 *     <p class="alert-message">Something went wrong.</p>
 *     <div class="alert-actions">              optional — drop if no CTAs
 *       <button class="btn btn-xs btn-primary">Retry</button>
 *       <button class="btn btn-xs btn-secondary">Dismiss</button>
 *     </div>
 *     <button class="alert-close" aria-label="Close"><i class="ph ph-x"></i></button>
 *   </div>
 *
 * Variants: .alert-danger · .alert-warning · .alert-success · .alert-info
 * Omit the .alert-close button for persistent alerts.
 */
.alert {
  display: flex;
  align-items: center;
  gap: var(--ic-space-3);
  min-height: 56px;
  padding: var(--ic-space-4);
  border-radius: var(--ic-radius-md);
  border: 1px solid transparent;
  background: var(--color-surface-muted);
  color: var(--color-text);
  font: var(--type-body-sm);
}
.alert-icon    { font-size: 16px; flex-shrink: 0; }
.alert-message { flex: 1; min-width: 0; margin: 0; }
.alert-actions { display: inline-flex; gap: var(--ic-space-2); flex-shrink: 0; }
.alert-close {
  width: 24px;
  height: 24px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 0;
  padding: 0;
  cursor: pointer;
  color: var(--color-text-muted);
  border-radius: var(--ic-radius-sm);
  flex-shrink: 0;
  transition: background var(--ic-duration-fast) var(--ic-ease), color var(--ic-duration-fast) var(--ic-ease);
}
.alert-close:hover { background: color-mix(in srgb, currentColor 10%, transparent); color: var(--color-text); }
.alert-close .ph { font-size: 14px; }

/* Variants — soft tinted background + matching border in the variant hue. */
.alert-danger  { background: var(--color-danger-subtle);  border-color: color-mix(in srgb, var(--color-danger) 22%, transparent); }
.alert-danger  .alert-icon { color: var(--color-danger); }
.alert-warning { background: var(--color-warning-subtle); border-color: color-mix(in srgb, var(--color-warning) 32%, transparent); }
.alert-warning .alert-icon { color: var(--color-warning); }
.alert-success { background: var(--color-success-subtle); border-color: color-mix(in srgb, var(--color-success) 22%, transparent); }
.alert-success .alert-icon { color: var(--color-success); }
.alert-info    { background: var(--color-accent-subtle);  border-color: color-mix(in srgb, var(--color-accent) 22%, transparent); }
.alert-info    .alert-icon { color: var(--color-accent); }

/* ---------- Badge ----------
 * Status pill. Read-only as <span>; interactive (editable) as <button> —
 * picks up pointer cursor, hover dim, and focus ring automatically.
 * Optional parts compose inside any variant:
 *
 *   <span class="badge badge-success">Active</span>                          read-only
 *   <button class="badge badge-warning" type="button">Pending</button>       editable
 *   <span class="badge badge-info"><i class="ph ph-info badge-icon"></i>New</span>          icon left
 *   <span class="badge">Draft<button class="badge-remove" aria-label="Remove"><i class="ph ph-x"></i></button></span>   deletable
 */
.badge {
  display: inline-flex; align-items: center;
  gap: var(--ic-space-1);
  font: var(--type-caption);
  padding: var(--ic-space-1) var(--ic-space-2);
  border-radius: var(--ic-radius-full);
  /* Neutral follows the variant recipe: {hue}-100 fill + {hue}-150 stroke */
  background: var(--ic-palette-gray-100);
  color: var(--color-text-muted);
  border: 1px solid var(--ic-palette-gray-150);
}
.badge-success { background: var(--color-success-subtle); color: var(--ic-palette-green-700); border-color: var(--ic-palette-green-150); }
.badge-warning { background: var(--color-warning-subtle); color: var(--ic-palette-yellow-700); border-color: var(--ic-palette-yellow-150); }
.badge-danger  { background: var(--color-danger-subtle);  color: var(--color-danger); border-color: var(--ic-palette-red-150); }
.badge-info    { background: var(--color-info-subtle);    color: var(--ic-palette-blue-500); border-color: var(--ic-palette-blue-150); }

/* Editable — same pill rendered as a <button>. Deletable pills (those that
 * contain a .badge-remove) get the same hover so all interactive pills react. */
button.badge,
.badge:has(.badge-remove) {
  cursor: pointer;
  transition: filter var(--ic-duration-fast) var(--ic-ease);
}
button.badge:hover,
.badge:has(.badge-remove):hover { filter: brightness(0.96); }
button.badge:focus-visible {
  outline: 2px solid var(--color-border-focus);
  outline-offset: 1px;
}

/* Leading icon — Phosphor <i> or inline svg */
.badge-icon { font-size: 12px; width: 12px; height: 12px; flex-shrink: 0; }

/* Trailing remove × — clicking deletes the pill (delegated handler) */
.badge-remove {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 14px;
  height: 14px;
  margin-right: -2px;
  border: 0;
  padding: 0;
  background: transparent;
  color: inherit;
  cursor: pointer;
  border-radius: var(--ic-radius-full);
  opacity: 0.65;
  transition: opacity var(--ic-duration-fast) var(--ic-ease),
              background var(--ic-duration-fast) var(--ic-ease);
}
.badge-remove:hover { opacity: 1; background: color-mix(in srgb, currentColor 16%, transparent); }
.badge-remove .ph { font-size: 10px; }

/* ---------- Tag ----------
 * Status marker — distinct from .badge (soft pill). Two styles share one color hook (--tag-color):
 *   <span class="tag tag-positive">Label</span>           → solid filled chip + white text
 *   <span class="tag tag-indicator tag-positive">Label</span>  → colored dot + text
 */
.tag {
  --tag-color: var(--ic-palette-graphite-900);
  --tag-text:  var(--ic-palette-white);
  display: inline-flex;
  align-items: center;
  gap: var(--ic-space-1);
  height: 16px;
  padding: 0 var(--ic-space-2);
  border-radius: var(--ic-radius-sm);
  font: var(--ic-weight-semibold) var(--ic-text-xxs)/1 var(--ic-font-sans);
  background: var(--tag-color);
  color: var(--tag-text);
}

/* Status colors — drive both solid bg and indicator dot via --tag-color */
.tag-positive   { --tag-color: var(--color-success); }
.tag-negative   { --tag-color: var(--color-danger); }
.tag-warning    { --tag-color: var(--color-warning);          --tag-text: var(--ic-palette-graphite-900); }
.tag-dark       { --tag-color: var(--ic-palette-graphite-900); }
.tag-blue-light { --tag-color: var(--ic-palette-cyan-500); }
.tag-blue       { --tag-color: var(--ic-palette-blue-500); }
.tag-blue-dark  { --tag-color: var(--ic-palette-blue-700); }
.tag-light      { --tag-color: var(--ic-palette-gray-200);    --tag-text: var(--color-text); }

/* Solid tags are interactive (click swaps status via a dropdown) — subtle
 * hover dim signals it. Indicator style has its own hover below. */
.tag:not(.tag-indicator) {
  cursor: pointer;
  transition: filter var(--ic-duration-fast) var(--ic-ease);
}
.tag:not(.tag-indicator):hover { filter: brightness(0.92); }

/* Indicator style — colored dot + text, ghost-button hover affordance */
.tag-indicator {
  background: transparent;
  color: var(--color-text);
  padding: var(--ic-space-1) var(--ic-space-2);
  height: auto;
  gap: var(--ic-space-2);
  font-weight: var(--ic-weight-regular);
  cursor: pointer;
  transition: background var(--ic-duration-fast) var(--ic-ease);
}
.tag-indicator:hover { background: var(--color-surface-muted); }
.tag-indicator::before {
  content: '';
  width: 8px;
  height: 8px;
  border-radius: var(--ic-radius-full);
  background: var(--tag-color);
  flex-shrink: 0;
}

/* ---------- Count badge ----------
 * Circular numeric indicator (notification dot with a count).
 * Variants: primary (filled), secondary (outlined). Sizes: sm/md/lg → 12/16/20px.
 */
.count-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 16px;
  height: 16px;
  padding: 0 var(--ic-space-1);
  border-radius: var(--ic-radius-full);
  background: var(--color-danger);
  color: var(--ic-palette-white);
  font: var(--ic-weight-semibold) 10px/1 var(--ic-font-sans);
  border: 1px solid transparent;
  box-sizing: border-box;
}
.count-badge-sm {
  min-width: 12px;
  height: 12px;
  font-size: 9px;
  padding: 0 3px;
}
.count-badge-lg {
  min-width: 20px;
  height: 20px;
  font-size: 11px;
  padding: 0 5px;
}
.count-badge-secondary {
  background: var(--color-surface);
  color: var(--ic-palette-graphite-500);
  border-color: var(--color-border-strong);
}

/* ---------- Avatar ----------
 * Squarish identity badge (4px corner radius). Three content types share
 * the same root — the markup inside decides which renders:
 *
 *   Photo:     <span class="avatar avatar-md"><img src="…" alt="Jane"></span>
 *   Initials:  <span class="avatar avatar-md">JD</span>
 *   Team/co:   <span class="avatar avatar-md avatar-team"><i class="ph ph-buildings"></i></span>
 *
 * Sizes (default = avatar-md / 32px):
 *   .avatar-xs   16px
 *   .avatar-sm   24px
 *   .avatar-md   32px (default)
 *   .avatar-lg   40px
 *   .avatar-xl   80px
 *   .avatar-2xl 120px
 *
 * Interactive: render as <button> or <a> instead of <span> — picks up
 * pointer cursor, hover dim and focus-visible ring automatically.
 */
.avatar {
  --avatar-size: 32px;
  --avatar-text: var(--ic-text-sm);
  --avatar-icon: 16px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: var(--avatar-size);
  height: var(--avatar-size);
  border-radius: var(--ic-radius-sm);
  background: var(--color-surface-muted);
  color: var(--color-text-muted);
  font: var(--ic-weight-semibold) var(--avatar-text)/1 var(--ic-font-sans);
  text-transform: uppercase;
  flex-shrink: 0;
  overflow: hidden;
  user-select: none;
}

.avatar-xs  { --avatar-size: 16px;  --avatar-text: var(--ic-text-xxs); --avatar-icon: 10px; }
.avatar-sm  { --avatar-size: 24px;  --avatar-text: var(--ic-text-xs);  --avatar-icon: 14px; }
.avatar-md  { --avatar-size: 32px;  --avatar-text: var(--ic-text-sm);  --avatar-icon: 16px; }
.avatar-lg  { --avatar-size: 40px;  --avatar-text: var(--ic-text-base);--avatar-icon: 20px; }
.avatar-xl  { --avatar-size: 80px;  --avatar-text: var(--ic-text-2xl); --avatar-icon: 36px; }
.avatar-2xl { --avatar-size: 120px; --avatar-text: 42px;               --avatar-icon: 56px; }

/* Photo content — image fills the avatar */
.avatar > img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* Icon content — Phosphor or inline SVG, sized by --avatar-icon */
.avatar > .ph { font-size: var(--avatar-icon); }
.avatar > svg { width: var(--avatar-icon); height: var(--avatar-icon); }

/* Team / company variant — same neutral fill as initials; icon is the
 * differentiator from people avatars. */
.avatar-team {
  background: var(--color-surface-muted);
  color: var(--color-text-muted);
}

/* Interactive — applies when rendered as <button> or <a> */
button.avatar,
a.avatar {
  border: 0;
  padding: 0;
  cursor: pointer;
  text-decoration: none;
  transition: filter var(--ic-duration-fast) var(--ic-ease),
              box-shadow var(--ic-duration-fast) var(--ic-ease);
}
button.avatar:hover,
a.avatar:hover { filter: brightness(0.95); }
button.avatar:focus-visible,
a.avatar:focus-visible {
  outline: 2px solid var(--color-border-focus);
  outline-offset: 2px;
}

/* ---------- Switch ----------
 * Usage:
 *   <label class="switch">
 *     <input type="checkbox" class="switch-input" />
 *     <span class="switch-track"></span>
 *   </label>
 */
.switch {
  display: inline-flex;
  position: relative;
  width: 40px;
  height: 24px;
  cursor: pointer;
  flex-shrink: 0;
}
.switch-input {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  margin: 0;
  opacity: 0;
  cursor: inherit;
}
.switch-track {
  position: relative;
  width: 100%;
  height: 100%;
  background: var(--color-border-strong);
  border-radius: var(--ic-radius-full);
  transition: background var(--ic-duration-base) var(--ic-ease),
              box-shadow var(--ic-duration-fast) var(--ic-ease);
}
.switch-track::after {
  content: '';
  position: absolute;
  top: 4px;
  left: 4px;
  width: 16px;
  height: 16px;
  background: var(--ic-palette-white);
  border-radius: var(--ic-radius-full);
  box-shadow: var(--ic-shadow-sm);
  transition: transform var(--ic-duration-base) var(--ic-ease);
}
.switch-input:checked ~ .switch-track             { background: var(--color-accent); }
.switch-input:checked ~ .switch-track::after      { transform: translateX(16px); }
.switch-input:focus-visible ~ .switch-track       { box-shadow: 0 0 0 3px var(--color-accent-subtle); }
.switch-input:disabled                            { cursor: not-allowed; }
.switch:has(.switch-input:disabled)               { cursor: not-allowed; }
.switch-input:disabled ~ .switch-track            { opacity: 0.5; }

/* ---------- Checkbox ----------
 * Usage:
 *   <label class="checkbox">
 *     <input type="checkbox" class="checkbox-input" />
 *     <span class="checkbox-box">
 *       <svg class="checkbox-mark"><use href="#i-check"/></svg>
 *       <svg class="checkbox-mark checkbox-mark-dash"><use href="#i-minus"/></svg>
 *     </span>
 *     <span class="checkbox-label">Label</span>
 *   </label>
 * Add `.is-error` to .checkbox for invalid state.
 * Set `input.indeterminate = true` via JS for the indeterminate state.
 */
.checkbox {
  display: inline-flex;
  align-items: center;
  gap: var(--ic-space-2);
  cursor: pointer;
  position: relative;
}
.checkbox-input {
  position: absolute;
  inset: 0;
  width: 16px;
  height: 16px;
  margin: 0;
  opacity: 0;
  cursor: inherit;
}
.checkbox-box {
  position: relative;
  width: 16px;
  height: 16px;
  border-radius: var(--ic-radius-sm);
  border: 1px solid var(--color-border-strong);
  background: var(--color-surface);
  flex-shrink: 0;
  transition: border-color var(--ic-duration-fast) var(--ic-ease),
              background var(--ic-duration-fast) var(--ic-ease),
              box-shadow var(--ic-duration-fast) var(--ic-ease);
}
.checkbox-mark {
  position: absolute;
  inset: 1px;
  width: calc(100% - 2px);
  height: calc(100% - 2px);
  color: var(--ic-palette-white);
  opacity: 0;
  transition: opacity var(--ic-duration-fast) var(--ic-ease);
  pointer-events: none;
}
.checkbox-label {
  font: var(--type-body);
  color: var(--color-text);
}

/* States */
.checkbox:hover .checkbox-box                  { border-color: var(--color-text-muted); }
.checkbox-input:checked ~ .checkbox-box,
.checkbox-input:indeterminate ~ .checkbox-box  { background: var(--color-accent); border-color: var(--color-accent); }
.checkbox-input:checked ~ .checkbox-box .checkbox-mark:not(.checkbox-mark-dash),
.checkbox-input:indeterminate ~ .checkbox-box .checkbox-mark-dash { opacity: 1; }
.checkbox-input:focus-visible ~ .checkbox-box  { box-shadow: 0 0 0 3px var(--color-accent-subtle); }
.checkbox-input:disabled ~ .checkbox-box,
.checkbox-input:disabled ~ .checkbox-label     { opacity: 0.5; }
.checkbox:has(.checkbox-input:disabled)        { cursor: not-allowed; }

/* Error */
.checkbox.is-error .checkbox-box               { border-color: var(--color-danger); }
.checkbox.is-error .checkbox-input:checked ~ .checkbox-box {
  background: var(--color-danger);
  border-color: var(--color-danger);
}

/* ---------- Radio ----------
 * Usage:
 *   <label class="radio">
 *     <input type="radio" name="group" class="radio-input" />
 *     <span class="radio-circle"></span>
 *     <span class="radio-label">Label</span>
 *   </label>
 * Add `.is-error` to .radio for invalid state.
 */
.radio {
  display: inline-flex;
  align-items: center;
  gap: var(--ic-space-2);
  cursor: pointer;
  position: relative;
}
.radio-input {
  position: absolute;
  inset: 0;
  width: 16px;
  height: 16px;
  margin: 0;
  opacity: 0;
  cursor: inherit;
}
.radio-circle {
  width: 16px;
  height: 16px;
  border-radius: var(--ic-radius-full);
  border: 1px solid var(--color-border-strong);
  background: var(--color-surface);
  position: relative;
  flex-shrink: 0;
  transition: border-color var(--ic-duration-fast) var(--ic-ease),
              background var(--ic-duration-fast) var(--ic-ease),
              box-shadow var(--ic-duration-fast) var(--ic-ease);
}
.radio-circle::after {
  content: '';
  position: absolute;
  top: 50%; left: 50%;
  width: 6px;
  height: 6px;
  border-radius: var(--ic-radius-full);
  background: var(--ic-palette-white);
  transform: translate(-50%, -50%) scale(0);
  transition: transform var(--ic-duration-fast) var(--ic-ease);
}
.radio-label {
  font: var(--type-body);
  color: var(--color-text);
}

/* States */
.radio:hover .radio-circle                     { border-color: var(--color-text-muted); }
.radio-input:checked ~ .radio-circle           { background: var(--color-accent); border-color: var(--color-accent); }
.radio-input:checked ~ .radio-circle::after    { transform: translate(-50%, -50%) scale(1); }
.radio-input:focus-visible ~ .radio-circle     { box-shadow: 0 0 0 3px var(--color-accent-subtle); }
.radio-input:disabled ~ .radio-circle,
.radio-input:disabled ~ .radio-label           { opacity: 0.5; }
.radio:has(.radio-input:disabled)              { cursor: not-allowed; }

/* Error */
.radio.is-error .radio-circle                  { border-color: var(--color-danger); }
.radio.is-error .radio-input:checked ~ .radio-circle {
  background: var(--color-danger);
  border-color: var(--color-danger);
}

/* ---------- Slider ----------
 * Native <input type="range"> in a flex row. The filled-track portion is a
 * gradient driven by --slider-progress, kept in sync by the script block in
 * example.html (also syncs value readouts / number fields).
 *
 *   <div class="slider">
 *     <input class="slider-input" type="range" min="0" max="100" value="35" aria-label="Volume" />
 *   </div>
 *
 * Variants compose via optional siblings around the range input:
 *   icons        <i class="ph ph-minus slider-icon"></i> … <i class="ph ph-plus slider-icon"></i>
 *   labels       <span class="slider-label">Zoom Out</span> (pairs with icons)
 *   min/max      <span class="slider-value">0</span> … <span class="slider-value">100</span>
 *   current      <output class="slider-value" data-slider-output></output>  ← JS-synced
 *   input        <input class="input input-xs slider-field" type="number" />  ← JS-synced both ways
 */
.slider {
  display: flex;
  align-items: center;
  gap: var(--ic-space-3);
  width: 100%;
}
.slider-input {
  -webkit-appearance: none;
  appearance: none;
  flex: 1;
  min-width: 0;
  height: 24px; /* generous touch target around the 2px track */
  background: transparent;
  cursor: pointer;
  margin: 0;
}
/* Track — filled portion dark, remainder light, split at --slider-progress */
.slider-input::-webkit-slider-runnable-track {
  height: 2px;
  border-radius: var(--ic-radius-full);
  background: linear-gradient(to right,
    var(--color-accent) var(--slider-progress, 50%),
    var(--color-border-strong) var(--slider-progress, 50%));
}
.slider-input::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 16px;
  height: 16px;
  margin-top: -7px; /* centers the 16px thumb on the 2px track */
  border: 0;
  border-radius: var(--ic-radius-full);
  background: var(--color-accent);
  transition: box-shadow var(--ic-duration-fast) var(--ic-ease);
}
.slider-input::-webkit-slider-thumb:hover { box-shadow: 0 0 0 4px var(--color-accent-subtle); }
.slider-input:focus-visible { outline: none; }
.slider-input:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 4px var(--color-accent-subtle); }
/* Firefox */
.slider-input::-moz-range-track {
  height: 2px;
  border-radius: var(--ic-radius-full);
  background: var(--color-border-strong);
}
.slider-input::-moz-range-progress {
  height: 2px;
  border-radius: var(--ic-radius-full);
  background: var(--color-accent);
}
.slider-input::-moz-range-thumb {
  width: 16px;
  height: 16px;
  border: 0;
  border-radius: var(--ic-radius-full);
  background: var(--color-accent);
  transition: box-shadow var(--ic-duration-fast) var(--ic-ease);
}
.slider-input::-moz-range-thumb:hover { box-shadow: 0 0 0 4px var(--color-accent-subtle); }
.slider-input:focus-visible::-moz-range-thumb { box-shadow: 0 0 0 4px var(--color-accent-subtle); }
.slider-input:disabled { cursor: not-allowed; opacity: 0.5; }

/* Side adornments */
.slider-icon  { font-size: 16px; color: var(--ic-palette-graphite-500); flex-shrink: 0; }
.slider-label { font: var(--ic-weight-regular) var(--ic-text-xs)/1.5 var(--ic-font-sans); color: var(--ic-palette-graphite-500); flex-shrink: 0; white-space: nowrap; }
.slider-value { font: var(--ic-weight-semibold) var(--ic-text-base)/var(--ic-lh-body-md) var(--ic-font-sans); color: var(--ic-palette-graphite-500); flex-shrink: 0; font-variant-numeric: tabular-nums; }
/* Number field variant — fixed compact width, no spinners */
.slider-field { width: 56px; text-align: center; -moz-appearance: textfield; appearance: textfield; flex-shrink: 0; }
.slider-field::-webkit-outer-spin-button,
.slider-field::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

/* ---------- Modal ----------
 * Overlay + centered panel with header / body / footer. Sizes: xs/sm/md/lg/xl.
 *
 *   <div class="modal-overlay" id="my-modal" hidden>
 *     <div class="modal modal-md">
 *       <header class="modal-header">
 *         <h2 class="modal-title">Title</h2>
 *         <button class="modal-close" data-modal-close aria-label="Close"><svg><use href="#i-x"/></svg></button>
 *       </header>
 *       <div class="modal-body">…</div>
 *       <footer class="modal-footer">
 *         <button class="btn btn-secondary" data-modal-close>Cancel</button>
 *         <button class="btn btn-primary">Confirm</button>
 *       </footer>
 *     </div>
 *   </div>
 *
 * Trigger: any element with data-modal-open="my-modal". Close on overlay-click, Escape, or any data-modal-close.
 */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: var(--color-overlay);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--ic-space-5);
  z-index: var(--ic-z-modal);
}
.modal-overlay[hidden] { display: none; }

.modal {
  background: var(--color-surface);
  border-radius: var(--ic-radius-md);
  box-shadow: var(--ic-shadow-xl);
  width: 100%;
  max-height: calc(100vh - var(--ic-space-9));
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.modal-xs { max-width: 328px; }
.modal-sm { max-width: 520px; }
.modal-md { max-width: 650px; }
.modal-lg { max-width: 800px; }
.modal-xl { max-width: 1200px; }

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--ic-space-3);
  padding: var(--ic-space-4) var(--ic-space-5);
}
.modal-title {
  font: var(--ic-weight-semibold) var(--ic-text-md)/1.3 var(--ic-font-sans);
  color: var(--color-text);
  margin: 0;
}
.modal-close {
  width: 28px;
  height: 28px;
  padding: 0;
  border: 0;
  background: transparent;
  border-radius: var(--ic-radius-sm);
  color: var(--color-text-muted);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background var(--ic-duration-fast) var(--ic-ease),
              color var(--ic-duration-fast) var(--ic-ease);
}
.modal-close:hover { background: var(--color-surface-muted); color: var(--color-text); }
.modal-close svg   { width: 16px; height: 16px; }

.modal-body {
  flex: 1;
  min-height: 0; /* allow shrink below content for proper scroll behavior */
  padding: 0 var(--ic-space-5) var(--ic-space-5);
  overflow-y: auto;
  font: var(--type-body);
  color: var(--color-text);
}

.modal-footer {
  display: flex;
  justify-content: flex-end;
  gap: var(--ic-space-2);
  padding: var(--ic-space-4) var(--ic-space-5);
}

/* Mobile — buttons stack full width */
@media (max-width: 480px) {
  .modal-footer { flex-direction: column; }
  .modal-footer > .btn { width: 100%; }
}

/* ---------- Drawer ----------
 * Right-anchored side panel. Reuses .modal-header / .modal-body / .modal-footer for layout.
 * Sizes: narrow / regular / medium / wide / ultra / full.
 *
 *   <div class="drawer-overlay" id="my-drawer" hidden>
 *     <aside class="drawer drawer-regular">
 *       <header class="modal-header">…title + close…</header>
 *       <div class="modal-body">…</div>
 *       <footer class="modal-footer">…</footer>
 *     </aside>
 *   </div>
 */
.drawer-overlay {
  position: fixed;
  inset: 0;
  background: var(--color-overlay);
  display: flex;
  align-items: stretch;
  justify-content: flex-end;
  z-index: var(--ic-z-modal);
}
.drawer-overlay[hidden] { display: none; }

.drawer {
  background: var(--color-surface);
  box-shadow: var(--ic-shadow-xl);
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.drawer-narrow  { max-width: 440px; }
.drawer-regular { max-width: 560px; }
.drawer-medium  { max-width: 640px; }
.drawer-wide    { max-width: 960px; }
.drawer-ultra   { max-width: 1180px; }
.drawer-full    { max-width: 100%; }

/* On narrow viewports, any drawer goes full-width + footer buttons stack */
@media (max-width: 480px) {
  .drawer { max-width: 100%; }
}

/* ---------- Side navigation ----------
 * Two states: expanded (236px) and compact (62px), toggled with `.is-compact`.
 *
 *   <aside class="sidenav">
 *     <button class="sidenav-toggle" aria-label="Toggle">…chevron…</button>
 *     <ul class="sidenav-list">
 *       <li><a class="sidenav-item is-active" href="#">…icon… <span class="sidenav-item-label">Label</span></a></li>
 *     </ul>
 *     <div class="sidenav-spacer"></div>
 *     <div class="sidenav-footer">…more items…</div>
 *   </aside>
 */
.sidenav {
  position: relative;
  display: flex;
  flex-direction: column;
  width: 236px;
  height: 100%;
  padding: var(--ic-space-3);
  background: var(--ic-palette-gray-150);
  border-right: 1px solid var(--color-border);
  transition: width var(--ic-duration-base) var(--ic-ease);
  flex-shrink: 0;
}
.sidenav.is-compact { width: 62px; }

.sidenav-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
  list-style: none;
  margin: 0;
  padding: 0;
}

.sidenav-item {
  display: flex;
  align-items: center;
  gap: var(--ic-space-2);
  height: 36px;
  padding: 0 var(--ic-space-3);
  border-radius: var(--ic-radius-sm);
  font: var(--type-body);
  color: var(--color-text-muted);
  text-decoration: none;
  text-align: left;
  border: 0;
  background: transparent;
  cursor: pointer;
  white-space: nowrap;
  width: 100%;
  transition: background var(--ic-duration-fast) var(--ic-ease),
              color var(--ic-duration-fast) var(--ic-ease),
              box-shadow var(--ic-duration-fast) var(--ic-ease);
}
.sidenav-item:hover {
  background: var(--ic-palette-gray-200);
}
.sidenav-item.is-active {
  background: var(--ic-palette-gray-200);
  color: var(--color-text);
  font-weight: var(--ic-weight-medium);
}
.sidenav-item-icon {
  width: 18px;
  height: 18px;
  flex-shrink: 0;
  color: var(--color-text-muted);
  transition: color var(--ic-duration-fast) var(--ic-ease);
}
.sidenav-item.is-active .sidenav-item-icon { color: var(--color-text); }
.sidenav-item-label {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  opacity: 1;
  transition: opacity var(--ic-duration-fast) var(--ic-ease);
}
.sidenav-item-chevron {
  width: 16px;
  height: 16px;
  color: var(--color-text-muted);
  flex-shrink: 0;
  transition: transform var(--ic-duration-fast) var(--ic-ease);
}

/* Nested group — a parent item that expands to reveal child items. */
.sidenav-group { display: contents; }
.sidenav-group-trigger[aria-expanded="true"] .sidenav-item-chevron { transform: rotate(180deg); }
.sidenav-sublist {
  list-style: none;
  margin: 0;
  /* Indent so subitem labels line up with the parent label (icon + gap). */
  padding: 0 0 0 calc(var(--ic-space-2) + 18px);
  display: flex;
  flex-direction: column;
  gap: 2px;
  overflow: hidden;
}
.sidenav-group-trigger[aria-expanded="false"] + .sidenav-sublist { display: none; }
.sidenav-subitem {
  height: 32px;
  font: var(--type-body-sm);
}

/* Compact state — icon-only square buttons, labels hidden */
.sidenav.is-compact .sidenav-item {
  justify-content: center;
  padding: 0;
  width: 36px;
  margin: 0 auto;
}
.sidenav.is-compact .sidenav-item-label,
.sidenav.is-compact .sidenav-item-chevron { display: none; }
.sidenav.is-compact .sidenav-sublist { display: none; }

.sidenav-spacer { flex: 1; }
.sidenav-footer {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding-top: var(--ic-space-3);
  border-top: 1px solid var(--color-border);
  margin-top: var(--ic-space-3);
}

/* Toggle button — floats over the right edge of the sidebar */
.sidenav-toggle {
  position: absolute;
  top: var(--ic-space-4);
  right: -12px;
  width: 24px;
  height: 24px;
  padding: 0;
  border-radius: var(--ic-radius-full);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--color-text-muted);
  z-index: var(--ic-z-sticky);
  box-shadow: var(--ic-shadow-sm);
  transition: color var(--ic-duration-fast) var(--ic-ease),
              background var(--ic-duration-fast) var(--ic-ease);
}
.sidenav-toggle:hover { color: var(--color-text); background: var(--color-surface-muted); }
.sidenav-toggle svg {
  width: 14px;
  height: 14px;
  transition: transform var(--ic-duration-base) var(--ic-ease);
}
.sidenav.is-compact .sidenav-toggle svg { transform: rotate(180deg); }

/* App shell — pairs sidenav + main content */
.app-shell {
  display: flex;
  height: 560px;
  background: var(--color-bg);
  border: 1px solid var(--color-border);
  border-radius: var(--ic-radius-sm);
  overflow: hidden;
}
.app-shell-main {
  flex: 1;
  background: var(--color-surface);
  padding: var(--ic-space-5);
  overflow: auto;
}

/* ---------- Breadcrumbs ----------
 * Path trail — usually the first row inside a page head, but works standalone.
 * Parent crumbs are blue links (underline on hover); the current page is plain
 * text and not interactive. Chevron separators come from the ::after on each
 * non-last item, so markup stays flat:
 *
 *   <nav class="breadcrumbs" aria-label="Breadcrumb">
 *     <a class="breadcrumb" href="#">Processes</a>
 *     <a class="breadcrumb" href="#">Onboarding</a>
 *     <span class="breadcrumb is-current" aria-current="page">Review step</span>
 *   </nav>
 */
.breadcrumbs {
  display: flex;
  align-items: center;
  gap: var(--ic-space-1);
  flex-wrap: wrap;
  min-width: 0;
}
.breadcrumb {
  display: inline-flex;
  align-items: center;
  gap: var(--ic-space-1);
  font: var(--ic-weight-semibold) var(--ic-text-base)/var(--ic-lh-body-md) var(--ic-font-sans);
  color: var(--color-accent);
  text-decoration: none;
  white-space: nowrap;
}
a.breadcrumb:hover { text-decoration: underline; text-underline-offset: 3px; }
/* Chevron separator after every crumb except the last */
.breadcrumb:not(:last-child)::after {
  content: '';
  width: 16px;
  height: 16px;
  flex-shrink: 0;
  background-color: var(--color-text-subtle);
  -webkit-mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>') center / contain no-repeat;
  mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>') center / contain no-repeat;
}
/* Current page — plain text, no link affordance */
.breadcrumb.is-current {
  color: var(--color-text);
  cursor: default;
}

/* ---------- Page head ----------
 * Page-level header. Title (+ optional breadcrumbs + count + subtitle) on
 * the left, actions on the right. Breadcrumbs, when present, are the first
 * row inside .page-head-main, above the title.
 *
 *   <div class="page-head">
 *     <div class="page-head-main">
 *       <nav class="breadcrumbs" aria-label="Breadcrumb">          ← optional
 *         <a class="breadcrumb" href="#">Processes</a>
 *         <span class="breadcrumb is-current" aria-current="page">Onboarding</span>
 *       </nav>
 *       <div class="page-head-title">
 *         <h1 class="page-head-heading">Processes</h1>
 *         <span class="count-badge count-badge-lg count-badge-secondary">12</span>
 *       </div>
 *       <p class="page-head-subtitle">Optional subtitle.</p>
 *     </div>
 *     <div class="page-head-actions">
 *       <button class="btn btn-secondary">Filter</button>
 *       <button class="btn btn-primary">New process</button>
 *     </div>
 *   </div>
 */
.page-head {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: var(--ic-space-5);
  padding-bottom: var(--ic-space-3);
  border-bottom: 1px solid var(--ic-palette-gray-150);
  margin-bottom: var(--ic-space-6);
}
.page-head-main { min-width: 0; }
/* Breadcrumbs as the first row of a page head — small gap above the title */
.page-head-main > .breadcrumbs { margin-bottom: var(--ic-space-2); }
.page-head-title {
  display: flex;
  align-items: center;
  gap: var(--ic-space-3);
}
.page-head-heading {
  font: var(--type-h1);
  color: var(--color-text);
  margin: 0;
}
/* Count next to the heading uses the secondary count-badge component
 * directly — no separate .page-head-count rule. Markup:
 *   <span class="count-badge count-badge-lg count-badge-secondary">12</span>
 */
.page-head-subtitle {
  font: var(--type-body-sm);
  color: var(--color-text-muted);
  margin: var(--ic-space-1) 0 0;
}
.page-head-actions {
  display: flex;
  align-items: center;
  gap: var(--ic-space-2);
  flex-shrink: 0;
}

/* Template frame — full app preview: topbar + sidenav + main, vertically stacked */
.template-frame {
  display: flex;
  flex-direction: column;
  height: 760px;
  background: var(--color-bg);
  border: 1px solid var(--color-border);
  border-radius: var(--ic-radius-sm);
  overflow: hidden;
}
.template-frame .app-shell {
  border: 0;
  border-radius: 0;
  height: auto;
  flex: 1;
}

/* Stat tile — used inside templates */
.stat-card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--ic-radius-md);
  padding: var(--ic-space-4);
}
.stat-card-label {
  font: var(--type-caption);
  color: var(--color-text-muted);
  margin: 0;
}
.stat-card-value {
  font: var(--ic-weight-semibold) var(--ic-text-2xl)/1.2 var(--ic-font-sans);
  color: var(--color-text);
  margin: var(--ic-space-1) 0 0;
}

/* List row — denser card variant for index pages */
.list-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--ic-space-4);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--ic-radius-md);
  padding: var(--ic-space-3) var(--ic-space-4);
  transition: background var(--ic-duration-fast) var(--ic-ease);
}
.list-row:hover { background: var(--color-surface-muted); }
.list-row-title  { font: var(--type-body); font-weight: var(--ic-weight-medium); color: var(--color-text); margin: 0; }
.list-row-meta   { font: var(--type-body-sm); color: var(--color-text-muted); margin: 2px 0 0; }

/* ---------- Tabs ----------
 * Horizontal tab strip with a hairline border underneath and a 2px accent
 * indicator under the active tab. Triggers are buttons; pair with
 * `<div role="tabpanel">` panels via aria-controls + matching ids.
 *
 *   <div class="tabs" role="tablist">
 *     <button class="tab is-active" role="tab" aria-selected="true" aria-controls="p-1" id="t-1" type="button">Overview</button>
 *     <button class="tab" role="tab" aria-selected="false" aria-controls="p-2" id="t-2" type="button">Activity</button>
 *   </div>
 *   <div role="tabpanel" id="p-1" aria-labelledby="t-1">…</div>
 *   <div role="tabpanel" id="p-2" aria-labelledby="t-2" hidden>…</div>
 */
.tabs {
  display: flex;
  gap: var(--ic-space-6);
  border-bottom: 1px solid var(--color-border);
}
.tab {
  background: transparent;
  border: 0;
  border-bottom: 2px solid transparent;
  padding: 0 0 var(--ic-space-1);
  margin-bottom: -1px;
  cursor: pointer;
  font: var(--ic-weight-semibold) var(--ic-text-sm)/1.25 var(--ic-font-sans);
  color: var(--color-text-muted);
  white-space: nowrap;
  transition: color var(--ic-duration-fast) var(--ic-ease),
              border-color var(--ic-duration-fast) var(--ic-ease);
}
.tab:hover { color: var(--color-text); }
.tab.is-active {
  color: var(--color-text);
  border-bottom-color: var(--color-accent);
}
.tab:focus-visible {
  outline: 2px solid var(--color-border-focus);
  outline-offset: 2px;
  border-radius: var(--ic-radius-sm);
}

/* ---------- Stepper ----------
 * Horizontal step indicator for wizards / multi-step flows. Numbered 24px
 * circles + labels, joined by caret separators. The current step's circle is
 * filled with the accent; all others are outlined.
 *
 *   <ol class="stepper">
 *     <li class="stepper-step is-current"><span class="stepper-num">1</span><span class="stepper-label">Details</span></li>
 *     <li class="stepper-sep"><i class="ph ph-caret-right"></i></li>
 *     <li class="stepper-step"><span class="stepper-num">2</span><span class="stepper-label">Review</span></li>
 *   </ol>
 */
.stepper {
  display: flex;
  align-items: center;
  gap: var(--ic-space-1);
  flex-wrap: wrap;
  list-style: none;
  margin: 0;
  padding: 0;
}
.stepper-step {
  display: inline-flex;
  align-items: center;
  gap: var(--ic-space-2);
}
.stepper-num {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 24px;
  flex-shrink: 0;
  border-radius: var(--ic-radius-full);
  border: 1px solid var(--color-border-strong);
  background: var(--color-surface);
  color: var(--ic-palette-graphite-500);
  font: var(--ic-weight-semibold) var(--ic-text-xs)/1 var(--ic-font-sans);
}
.stepper-label {
  font: var(--ic-weight-semibold) var(--ic-text-xxs)/1.3 var(--ic-font-sans);
  color: var(--ic-palette-graphite-500);
  white-space: nowrap;
}
/* Current step — filled accent circle, white number */
.stepper-step.is-current .stepper-num {
  background: var(--color-accent);
  border-color: var(--color-accent);
  color: var(--color-text-inverse);
}
/* Completed step (optional) — same accent fill with a check instead of a number */
.stepper-step.is-complete .stepper-num {
  background: var(--color-accent);
  border-color: var(--color-accent);
  color: var(--color-text-inverse);
}
.stepper-sep {
  display: inline-flex;
  align-items: center;
  flex-shrink: 0;
  color: var(--color-text-subtle);
}
.stepper-sep .ph { font-size: 16px; }

/* ---------- Tooltip ----------
 * CSS-only tooltip on any element via [data-tooltip="…"]. Default placement
 * is top; override with [data-placement="bottom"|"left"|"right"].
 *
 * Two styles:
 *   Compact (default) — dark pill, caption text, single line. For icon
 *     buttons and short labels.
 *   Regular — add [data-tooltip-style="regular"]. White surface, 13/20 body
 *     text that wraps (max 240px), soft shadow, caret pointing at the
 *     trigger. For longer explanatory copy.
 *
 *   <button class="btn" data-tooltip="Copied!" data-placement="bottom">Copy</button>
 *   <button class="btn" data-tooltip="Longer explanation…" data-tooltip-style="regular">Help</button>
 *
 * Renders via ::after (+ ::before for the regular caret) so no extra DOM.
 * Reveals on :hover and :focus-visible.
 */
[data-tooltip] { position: relative; }
[data-tooltip]::after {
  content: attr(data-tooltip);
  position: absolute;
  background: var(--ic-palette-graphite-900);
  color: var(--color-text-inverse);
  padding: var(--ic-space-1) var(--ic-space-2);
  border-radius: var(--ic-radius-sm);
  font: var(--type-caption);
  line-height: 1.3;
  white-space: nowrap;
  pointer-events: none;
  opacity: 0;
  z-index: var(--ic-z-toast);
  transition: opacity var(--ic-duration-fast) var(--ic-ease) 80ms;
  /* Default placement: top */
  bottom: calc(100% + 6px);
  left: 50%;
  transform: translateX(-50%);
}
[data-tooltip]:hover::after,
[data-tooltip]:focus-visible::after { opacity: 1; }

[data-tooltip][data-placement="bottom"]::after {
  bottom: auto;
  top: calc(100% + 6px);
}
[data-tooltip][data-placement="left"]::after {
  bottom: auto;
  top: 50%;
  right: calc(100% + 6px);
  left: auto;
  transform: translateY(-50%);
}
[data-tooltip][data-placement="right"]::after {
  bottom: auto;
  top: 50%;
  left: calc(100% + 6px);
  transform: translateY(-50%);
}

/* Regular style — white surface, wrapping body text, caret.
 * Shadow matches Figma "Shadows/Level 4" (two centered layers). */
[data-tooltip][data-tooltip-style="regular"]::after {
  background: var(--color-surface);
  color: var(--ic-palette-graphite-500);
  font: var(--type-body-sm);
  padding: var(--ic-space-4);
  border-radius: var(--ic-radius-sm);
  white-space: normal;
  width: max-content;
  max-width: 240px;
  text-align: left;
  box-shadow: 0 0 4px rgba(0, 0, 0, 0.24), 0 0 32px rgba(0, 0, 0, 0.12);
  bottom: calc(100% + 12px);
}
/* Caret — rotated square; its shadowed half pokes out from under the bubble
 * (::after paints above ::before, hiding the inner half). */
[data-tooltip][data-tooltip-style="regular"]::before {
  content: '';
  position: absolute;
  width: 10px;
  height: 10px;
  background: var(--color-surface);
  box-shadow: 0 0 4px rgba(0, 0, 0, 0.24);
  pointer-events: none;
  opacity: 0;
  z-index: var(--ic-z-toast);
  transition: opacity var(--ic-duration-fast) var(--ic-ease) 80ms;
  /* Default placement: top */
  bottom: calc(100% + 8px);
  left: 50%;
  transform: translateX(-50%) rotate(45deg);
}
[data-tooltip][data-tooltip-style="regular"]:hover::before,
[data-tooltip][data-tooltip-style="regular"]:focus-visible::before { opacity: 1; }

[data-tooltip][data-tooltip-style="regular"][data-placement="bottom"]::after {
  bottom: auto;
  top: calc(100% + 12px);
}
[data-tooltip][data-tooltip-style="regular"][data-placement="bottom"]::before {
  bottom: auto;
  top: calc(100% + 8px);
}
[data-tooltip][data-tooltip-style="regular"][data-placement="left"]::after {
  bottom: auto;
  top: 50%;
  right: calc(100% + 12px);
  left: auto;
  transform: translateY(-50%);
}
[data-tooltip][data-tooltip-style="regular"][data-placement="left"]::before {
  bottom: auto;
  top: 50%;
  right: calc(100% + 8px);
  left: auto;
  transform: translateY(-50%) rotate(45deg);
}
[data-tooltip][data-tooltip-style="regular"][data-placement="right"]::after {
  bottom: auto;
  top: 50%;
  left: calc(100% + 12px);
  transform: translateY(-50%);
}
[data-tooltip][data-tooltip-style="regular"][data-placement="right"]::before {
  bottom: auto;
  top: 50%;
  left: calc(100% + 8px);
  transform: translateY(-50%) rotate(45deg);
}

/* ---------- Loaders ----------
 * Chase spinner — the Operationalize logo mark (24 segments) fading in
 * sequence. Copy the <svg class="chase …" viewBox="0 0 22 32"> block from
 * example.html#loaders; per-segment delays are computed by the small JS
 * snippet in the script block (i/n stagger), so markup carries no timing.
 *
 *   <svg class="chase size-md" viewBox="0 0 22 32">…24 paths…</svg>      counter-clockwise, blue
 *   <svg class="chase-cw size-md" viewBox="0 0 22 32">…same paths…</svg> clockwise, graphite + blue flash
 *
 * Sizes: .size-sm 24px · .size-md 32px · .size-lg 48px
 */
.chase, .chase-cw { display: block; height: auto; }
.chase path, .chase-cw path { fill: currentColor; }
.chase { color: var(--color-accent); }
.chase path { animation: ic-chase-fade 1.1s linear infinite; }
.chase-cw { color: var(--ic-palette-graphite-300); }
.chase-cw path { animation: ic-chase-fade-cw 1.1s linear infinite; }
.chase.size-sm, .chase-cw.size-sm { width: 24px; }
.chase.size-md, .chase-cw.size-md { width: 32px; }
.chase.size-lg, .chase-cw.size-lg { width: 48px; }
@keyframes ic-chase-fade { 0%, 100% { opacity: 0.15; } 12% { opacity: 1; } }
@keyframes ic-chase-fade-cw { 0%, 100% { opacity: 0.15; } 12% { opacity: 1; color: var(--color-accent); } }
@media (prefers-reduced-motion: reduce) {
  .chase path, .chase-cw path { animation: none; opacity: 0.55; }
}

/* ---------- Toast ----------
 * Floating notification anchored to the top-right corner. Spawn via the
 * global `toast(...)` helper (see example.html). Three behaviors —
 *   persistent → no auto-dismiss, shows close button
 *   timed      → auto-dismisses after `timeout` ms (default 5000)
 *   action     → shows an action button + close button
 *
 * Five color variants:
 *   .toast-neutral · .toast-error · .toast-warning · .toast-success · .toast-info
 *
 *   <div class="toast-region" aria-live="polite"></div>     ← one per page
 *   <div class="toast toast-success">
 *     <i class="ph ph-check-circle toast-icon"></i>
 *     <p class="toast-message">Saved.</p>
 *     <button class="btn btn-xs btn-secondary toast-action">Undo</button>
 *     <button class="toast-close" aria-label="Close"><i class="ph ph-x"></i></button>
 *   </div>
 */
.toast-region {
  position: fixed;
  top: var(--ic-space-4);
  right: var(--ic-space-4);
  z-index: var(--ic-z-toast);
  display: flex;
  flex-direction: column;
  gap: var(--ic-space-2);
  max-width: 380px;
  pointer-events: none;
}
.toast {
  --toast-accent: var(--color-border-strong);
  display: flex;
  align-items: flex-start;
  gap: var(--ic-space-3);
  padding: var(--ic-space-3) var(--ic-space-4);
  border-radius: var(--ic-radius-md);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  color: var(--color-text);
  font: var(--type-body-sm);
  box-shadow: var(--ic-shadow-md);
  pointer-events: auto;
  min-width: 280px;
  max-width: 380px;
  transition: opacity var(--ic-duration-base) var(--ic-ease),
              transform var(--ic-duration-base) var(--ic-ease);
}
.toast.is-entering { opacity: 0; transform: translateX(20%); }
.toast.is-leaving  { opacity: 0; transform: translateX(20%); }

.toast-icon { font-size: 18px; flex-shrink: 0; color: var(--toast-accent); margin-top: 1px; }
.toast-message { flex: 1; min-width: 0; margin: 0; line-height: 1.4; }
.toast-action { flex-shrink: 0; align-self: center; }
.toast-close {
  width: 20px;
  height: 20px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 0;
  padding: 0;
  cursor: pointer;
  color: var(--color-text-muted);
  border-radius: var(--ic-radius-sm);
  flex-shrink: 0;
  align-self: center;
  transition: color var(--ic-duration-fast) var(--ic-ease);
}
.toast-close:hover { color: var(--color-text); }
.toast-close .ph { font-size: 14px; }

/* Color variants — set --toast-accent, icon color follows */
.toast-neutral { --toast-accent: var(--color-border-strong); }
.toast-neutral .toast-icon { color: var(--color-text-muted); }
.toast-error   { --toast-accent: var(--color-danger);  background: var(--color-danger-subtle); }
.toast-warning { --toast-accent: var(--color-warning); background: var(--color-warning-subtle); }
.toast-success { --toast-accent: var(--color-success); background: var(--color-success-subtle); }
.toast-info    { --toast-accent: var(--color-accent);  background: var(--color-accent-subtle); }

/* ---------- Top bar ----------
 * Dark application chrome. 56px tall, graphite-800 background.
 * Brand on left, search in middle, avatar on right.
 */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--ic-space-5);
  height: 56px;
  padding: 0 var(--ic-space-5);
  background: var(--ic-palette-graphite-800);
  color: var(--ic-palette-white);
}
.topbar-brand {
  display: inline-flex;
  align-items: center;
  gap: var(--ic-space-2);
  text-decoration: none;
  color: inherit;
  font: var(--ic-weight-semibold) var(--ic-text-md)/1 var(--ic-font-sans);
  flex-shrink: 0;
}
.topbar-logo {
  width: 20px; height: 20px;
  border-radius: var(--ic-radius-full);
  border: 1.5px solid currentColor;
  display: inline-block;
  flex-shrink: 0;
}
.topbar-brand-logo {
  height: 22px;
  width: auto;
  display: block;
}
.topbar-actions {
  display: flex;
  align-items: center;
  gap: var(--ic-space-4);
  flex-shrink: 0;
}

.topbar-search {
  position: relative;
  width: 360px;
}
.topbar-search .search-icon {
  position: absolute;
  left: var(--ic-space-3);
  top: 50%;
  transform: translateY(-50%);
  width: 16px; height: 16px;
  color: rgba(255, 255, 255, 0.55);
  pointer-events: none;
}
.topbar-search-input {
  width: 100%;
  height: 36px;
  padding: 0 var(--ic-space-4) 0 36px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.10);
  border-radius: var(--ic-radius-sm);
  color: var(--ic-palette-white);
  font: var(--type-body);
  transition: background var(--ic-duration-fast) var(--ic-ease),
              border-color var(--ic-duration-fast) var(--ic-ease);
}
.topbar-search-input::placeholder { color: rgba(255, 255, 255, 0.55); }
.topbar-search-input:hover { background: rgba(255, 255, 255, 0.12); }
.topbar-search-input:focus {
  outline: none;
  background: rgba(255, 255, 255, 0.14);
  border-color: rgba(255, 255, 255, 0.30);
}

.topbar-avatar {
