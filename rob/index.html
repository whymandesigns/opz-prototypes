<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RoB Meetings — Operationalize</title>

  <!-- /rob/ used to be the prototype itself. It is now the family, and the
       prototype is a version inside it: v1-production is what the product does
       today, and every proposal branches off it, so the baseline stays
       reviewable against the real thing. See versions.json.

       This page exists so that links, bookmarks and screenshots pointing at
       /rob/ keep landing on the baseline. The query and hash come along, so
       /rob/?role=participant#occurrence=2026-11-25 still works.

       A redirect rather than the real page because the versions plugin
       resolves each folder against versions.json and its folder names must
       match vN-slug — the baseline cannot both sit here and be in the family. -->
  <meta http-equiv="refresh" content="0; url=./v1-production/" />
  <link rel="canonical" href="./v1-production/" />

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      color: #596377;
      font: 400 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    a { color: #204ECF; }
  </style>
</head>
<body>
  <!-- Seen only if the redirect is blocked or scripting is off. -->
  <p>Opening the <a href="./v1-production/">RoB Meetings baseline</a>…</p>

  <script>
    // Carry the query and hash across, which a meta refresh alone drops.
    location.replace('./v1-production/' + location.search + location.hash);
  </script>
</body>
</html>
